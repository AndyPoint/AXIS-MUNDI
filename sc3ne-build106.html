  }
  S.lastArray=made.map(l=>l.id);
  markDirty(); return made.length;
}
/* ══ RECIPES — an array that stays an array ════════════════
   Until now an array was an event: it scattered copies and was
   over. A recipe is the array itself, kept — it remembers what it
   repeats and how, and rebuilding it costs the same as making it.
   Change a count a month later and it answers.

   The copies are still ordinary layers, so everything that works
   on a layer still works. What changes is that something owns
   them and can make them again.
──────────────────────────────────────────────────────────── */
function newRecipe(kind,srcIds){
  return {id:'r'+(uid++),kind,src:srcIds.slice(),made:[],
    nx:5,nz:1,gap:0,
    // a stack: the document's default is twenty plates over a hundred metres
    n:20,step:5,axis:'y',fade:0,grow:0,
    of:'earth',start:0,size:120,tilt:0,yaw:0,
    // a field: counts and spacings on all three
    cx:4,cy:1,cz:4,sx:0,sy:4,sz:0,fall:0,
    rnd:{turn:0,size:0,shift:0,wide:0,flip:false},
    on:true,name:kind+' '+((S.recipes||[]).length+1)};
}
const recipeById=id=>(S.recipes||[]).find(r=>r.id===id);
// A recipe's copies, cleared. The sources are never touched.
function clearRecipe(r){
  if(!r.made||!r.made.length) return;
  const gone=new Set(r.made.filter(id=>!r.src.includes(id)));
  S.layers=S.layers.filter(l=>!gone.has(l.id));
  if(gone.has(S.sel)) S.sel=null;
  S.multi=(S.multi||[]).filter(id=>!gone.has(id));
  r.made=[];
  pruneGroups();
}
function buildRecipe(r){
  if(!r) return 0;
  if(r.kind==='build') bFollow(r);         // read where it now stands before it is cleared
  clearRecipe(r);
  const src=S.layers.filter(l=>r.src.includes(l.id));
  // A cut stack has no source by design — it makes its own surfaces. Asking it
  // for one is what made every CUT PLANE button quietly do nothing.
  if(!src.length&&r.kind!=='cut'&&r.kind!=='build'){ hint('its source is gone'); return 0; }
  const made=[];
  const rr=()=>Math.random()*2-1;
  if(r.kind==='grid'){
    const a=S.assets.get(src[0].assetId);
    const w=a?widthOf(src[0],a):src[0].height;
    const d=isPlane(src[0])?src[0].height:w;
    const sx=w+r.gap, sz=d+r.gap;
    for(let i=0;i<Math.max(1,r.nx|0);i++) for(let j=0;j<Math.max(1,r.nz|0);j++){
      if(!i&&!j) continue;                       // the source is the first one
      for(const s of src){
        const c=cloneOf(s,[s.pos[0]+i*sx,s.pos[1],s.pos[2]+j*sz]);
        applyJitter(c,r.rnd,rr);
        made.push(c);
      }
    }
  } else if(r.kind==='cut'){
    /* A cut stack is not made from an object. It IS the environment: a set of
       big empty surfaces at a fixed spacing, one for each layer of a world —
       cloud above cloud above ridge above city above ground. Nothing is
       selected to make one, because there is nothing to select yet: the stack
       comes first and the pictures go onto it afterwards.

       Objects — people, trees, rocks — do not belong here. They are scattered
       onto what these surfaces define, with the tools that scatter things. */
    const a=A(r.of||'earth')||A('blank');
    if(!a) return 0;
    const n=Math.max(1,r.n|0), step=r.step, size=r.size;
    const yaw=(r.yaw||0)*Math.PI/180;
    const vertical=r.axis!=='y';
    for(let i=0;i<n;i++){
      const off=r.axis==='y'?[0,i*step,0]
        :(r.axis==='x'?[i*step,0,0]:[0,0,i*step]);
      const l=addLayer(a.id,
        [S.cam.tgt[0]+off[0], (r.start||0)+off[1], S.cam.tgt[2]+off[2]],
        {height:size});
      // Lying down like the ground is the default, because that is what a layer
      // of a world is. Standing up is the same tool turned on its side.
      l.face=vertical?'fixed':'plane';
      l.yaw=yaw;
      if(!vertical) l.tilt=r.tilt||0;
      l.wscale=1;
      if(r.fade>0.001)
        l.opacity=clamp(1-r.fade*(i/Math.max(1,n-1)),0,1);
      if(r.grow>0.001){
        const k=1+r.grow*(i/Math.max(1,n-1));
        l.height=size*k; l.wscale=k;
      }
      l.name=(r.of||'earth')+' '+(i+1);
      made.push(l);
    }
  } else if(r.kind==='field'){
    /* Counts on all three axes. Spacing defaults to the thing's own size, so a
       field of plates abuts and a field of trees stands clear. */
    const a=S.assets.get(src[0].assetId);
    const w=a?widthOf(src[0],a):src[0].height;
    const dz=isPlane(src[0])?src[0].height:w;
    const sx=r.sx>0.001?r.sx:w, sz=r.sz>0.001?r.sz:dz;
    const sy=r.sy>0.001?r.sy:src[0].height;
    const nx=Math.max(1,r.cx|0), ny=Math.max(1,r.cy|0), nz=Math.max(1,r.cz|0);
    const midX=(nx-1)/2, midZ=(nz-1)/2;
    for(let i=0;i<nx;i++) for(let j=0;j<ny;j++) for(let k=0;k<nz;k++){
      if(!i&&!j&&!k) continue;
      // falloff thins the field toward its edges rather than cutting it
      if(r.fall>0.001){
        const dxn=midX?Math.abs(i-midX)/midX:0, dzn=midZ?Math.abs(k-midZ)/midZ:0;
        if(Math.random()<Math.max(dxn,dzn)*r.fall) continue;
      }
      for(const s of src){
        const c=cloneOf(s,[s.pos[0]+i*sx, s.pos[1]+j*sy, s.pos[2]+k*sz]);
        applyJitter(c,r.rnd,rr);
        if(r.drop!==false&&!isPlane(c)&&j===0) dropToSurface(c);
        made.push(c);
      }
    }
  } else if(r.kind==='build'){
    made.push(...buildShape(r));
  } else if(r.kind==='path'){
    if(!r.path||r.path.length<2){ hint('no path'); return 0; }
    const keep=S.path; S.path=r.path;
    const n=arrayOnPath(src,r.arr||S.pathArr);
    S.path=keep;
    (S.lastArray||[]).forEach(id=>made.push(S.layers.find(l=>l.id===id)));
    return finishRecipe(r,made.filter(Boolean));
  }
  return finishRecipe(r,made);
}
function applyJitter(c,o,rr){
  if(!o) return;
  if(o.turn>0.001){ c.yaw=(c.yaw||0)+rr()*o.turn*Math.PI;
    if(c.face==='camera') c.face='fixed'; }
  if(o.size>0.001){ const k=1+rr()*o.size;
    c.height=Math.max(0.05,c.height*k); c.wscale=Math.max(0.05,(c.wscale||1)*k); }
  if(o.wide>0.001) c.wscale=Math.max(0.05,(c.wscale||1)*(1+rr()*o.wide));
  if(o.flip&&Math.random()<0.5) c.wscale=-(c.wscale||1);
  if(o.shift>0.001){ c.pos[0]+=rr()*o.shift; c.pos[2]+=rr()*o.shift; }
}
function finishRecipe(r,made){
  // A stack is one thing in the layer list, collapsed. Twenty loose plates in
  // the list is twenty rows of noise for something you think of as one object.
  if((r.kind==='stack'||r.kind==='cut'||r.kind==='build')&&made.length>1){
    const g=makeGroup(made,r.name||'stack');
    if(g){ g.collapsed=true; r.group=g.id; }
  }
  r.made=made.map(l=>l.id);
  S.lastArray=r.made.slice();
  markDirty(); draw(); bump();
  return made.length;
}
// Let it go: the copies stay, nothing owns them any more.
function releaseRecipe(r){
  S.recipes=(S.recipes||[]).filter(x=>x!==r);
  markDirty(); bump();
}
function deleteRecipe(r){
  clearRecipe(r);
  S.recipes=(S.recipes||[]).filter(x=>x!==r);
  markDirty(); draw(); bump();
}
// GRID ARRAY — the same expansion a component would do, with one member and no
// parameters. Spacing defaults to the layer's own footprint so plates abut.
function gridArray(src,nx,nz,sx,sz){
  snap(true);
  const made=[];
  for(let i=0;i<nx;i++) for(let j=0;j<nz;j++){
    if(!i&&!j) { made.push(src); continue; }
    made.push(cloneOf(src,[src.pos[0]+i*sx, src.pos[1], src.pos[2]+j*sz]));
  }
  S.lastArray=made.map(l=>l.id);
  markDirty(); return made;
}
// Randomness applied to a set rather than to a brush.
function randomiseSet(ids,o){
  snap(true);
  const set=S.layers.filter(l=>ids.includes(l.id));
  for(const l of set){
    const r=()=>Math.random()*2-1;
    if(o.turn>0.001){ l.yaw=(l.yaw||0)+r()*o.turn*Math.PI; if(l.face==='camera') l.face='fixed'; }
    if(o.size>0.001){ l.height=Math.max(0.05,l.height*(1+r()*o.size));
      l.wscale=Math.max(0.05,(l.wscale||1)*(1+r()*o.size*0.6)); }
    if(o.wide>0.001) l.wscale=Math.max(0.05,(l.wscale||1)*(1+r()*o.wide));
    if(o.flip&&Math.random()<0.5) l.wscale=-(l.wscale||1);
    if(o.shift>0.001){ l.pos[0]+=r()*o.shift; l.pos[2]+=r()*o.shift; }
    if(o.lift>0.001) l.pos[1]=Math.max(0,l.pos[1]+r()*o.lift);
    if(o.tilt>0.001&&isPlane(l)) l.tilt=clamp((l.tilt||0)+r()*o.tilt,0,90);
  }
  markDirty(); return set.length;
}
// A clipboard for layers. It holds descriptions rather than references, so a
// copy survives its original being deleted, and pasting twice gives two things.
let clip=null;
function copySelection(){
  const set=(S.multi&&S.multi.length)?multiLayers()
    :(S.sel?[S.layers.find(x=>x.id===S.sel)].filter(Boolean):[]);
  if(!set.length){ hint('nothing to copy'); return false; }
  clip=set.map(l=>JSON.parse(JSON.stringify(l)));
  hint(clip.length+' copied'); return true;
}
function pasteClip(){
  if(!clip||!clip.length){ hint('nothing to paste'); return false; }
  snap(true);
  // land it a little forward of the camera's target, keeping the set's shape
  const c=groupCentre(clip);
  const to=[S.cam.tgt[0],0,S.cam.tgt[2]];
  const made=[];
  for(const src of clip){
    if(!S.assets.has(src.assetId)) continue;
    const l=JSON.parse(JSON.stringify(src));
    l.id='l'+(uid++);
    l.pos=[to[0]+(src.pos[0]-c[0]),src.pos[1],to[2]+(src.pos[2]-c[2])];
    delete l.group;
    const a=S.assets.get(l.assetId);
    l.name=a.name+' '+(S.layers.filter(x=>x.assetId===l.assetId).length+1);
    S.layers.push(l); made.push(l);
  }
  if(!made.length){ hint('those assets are gone'); return false; }
  S.multi=made.length>1?made.map(l=>l.id):[];
  S.sel=made[made.length-1].id;
  markDirty(); draw(); bump(); hint(made.length+' pasted');

}
function beginRepeat(origin,copy,at){
  S.repeat={origin,copy,made:[copy],n:1,style:'linear',at:at||null};
  showRepeat();
}
function applyRepeat(){
  const R=S.repeat; if(!R) return;
  for(const l of R.made) { const i=S.layers.indexOf(l); if(i>=0) S.layers.splice(i,1); }
  R.made=[];
  const o=R.origin.pos, d=[R.copy.pos[0]-o[0],R.copy.pos[1]-o[1],R.copy.pos[2]-o[2]];
  const n=Math.max(1,Math.min(400,R.n|0));
  if(R.style==='radial'){
    const r=Math.hypot(d[0],d[2]), a0=Math.atan2(d[0],d[2]);
    for(let i=0;i<n;i++){
      const a=a0+(Math.PI*2)*(i+1)/(n+1);
      R.made.push(cloneOf(R.origin,[o[0]+Math.sin(a)*r,o[1]+d[1],o[2]+Math.cos(a)*r],
        {yaw:R.origin.face==='fixed'?a:R.origin.yaw}));
    }
  } else {
    const div=R.style==='between'?n:1;
    for(let i=1;i<=n;i++){
      const k=(R.style==='between'?i/div:i);
      R.made.push(cloneOf(R.origin,[o[0]+d[0]*k,o[1]+d[1]*k,o[2]+d[2]*k]));
    }
  }
  S.sel=R.made.length?R.made[R.made.length-1].id:R.origin.id;
  markDirty(); draw(); bump();

function endRepeat(){ S.repeat=null; hideRepeat(); draw(); bump(); }
const rEl=()=>document.getElementById('repeat');
function showRepeat(){
  const el=rEl(), vp=viewports()[0];
  const at=S.repeat.at;
  const q=at?null:project(vp.m,S.repeat.copy.pos,vp.w,vp.h);
  el.classList.add('on');
  const PW=230,PH=214;
  const x=clamp(at?at[0]+22:(q?q[0]+vp.x+22:W/2),12,Math.max(12,W-PW));
  const y=clamp(at?at[1]-40:(q?q[1]+vp.y-40:Hh/2),12,Math.max(12,Hh-PH));
  el.style.left=x+'px'; el.style.top=y+'px';
  const inp=el.querySelector('input');
  inp.value=String(S.repeat.n);
  setTimeout(()=>{inp.focus();inp.select();},0);
  syncRepeatSeg();
}
function hideRepeat(){ rEl().classList.remove('on'); }
function syncRepeatSeg(){
  rEl().querySelectorAll('.seg button').forEach(b=>
    b.classList.toggle('on',S.repeat&&b.dataset.style===S.repeat.style));
}


/* ══ LANDSCAPE — points into planar surfaces ═══════════════
   Heights on a grid, then one flat surface fitted through each
   set of four corners. Four points in space almost never lie on
   a plane, so each tile takes the plane that best fits its own
   corners: the average height sets where it sits, and the two
   slopes across it set which way it leans. The artist never meets
   any of that — they move a relief slider.

   Seams disagree slightly, and that is left alone. At this scale
   the disagreement reads as rock. Cover a hole with a bush.
──────────────────────────────────────────────────────────── */
function landHeight(L,i,j){
  // value noise: a few octaves of a hashed lattice, smoothed
  const h=(x,y)=>{ const n=Math.sin((x*127.1+y*311.7+L.seed*57.3))*43758.5453;
    return n-Math.floor(n); };
  let v=0, amp=1, f=1, sum=0;
  for(let o=0;o<3;o++){
    const x=i*f*0.6, y=j*f*0.6;
    const x0=Math.floor(x), y0=Math.floor(y), fx=x-x0, fy=y-y0;
    const sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy);
    const a=h(x0,y0), b=h(x0+1,y0), c=h(x0,y0+1), d=h(x0+1,y0+1);
    v+=amp*((a+(b-a)*sx)+((c+(d-c)*sx)-(a+(b-a)*sx))*sy);
    sum+=amp; amp*=L.rough; f*=2.1;
  }
  v/=Math.max(0.0001,sum);
  // smoothing pulls the whole field toward its own middle
  return (v-0.5)*L.relief*(1-L.smooth*0.6)+L.relief*L.smooth*0.15;
}
// One flat surface covering a rectangle in plan, leaning to meet the four
// heights given for its corners. Mean height says where it sits; the two slopes
// say which way it leans. This is FORCE PLANAR, and it is the only geometry in
// the landscape — a tile and a connector are the same function called twice.
function landPlane(a,cx,cz,wx,wz,h00,h10,h01,h11,grow){
  const mid=(h00+h10+h01+h11)/4;
  const dx=((h10+h11)-(h00+h01))/2/Math.max(0.001,wx);
  const dz=((h01+h11)-(h00+h10))/2/Math.max(0.001,wz);
  const slope=Math.hypot(dx,dz);
  const yaw=Math.atan2(dx,dz);
  const tilt=Math.atan(slope)*57.3;
  const cos=Math.max(0.15,Math.cos(Math.atan(slope)));
  const dep=(wz/cos)*(grow||1);                 // leaning costs depth
  const l=addLayer(a.id,[cx,mid,cz],{height:dep});
  l.face='plane';
  l.yaw=yaw;
  l.tilt=clamp(tilt,0,80);
  l.wscale=(wx*(grow||1))/(dep*(a.aspect||1));
  const {up}=faceBasis(l,viewports()[0]);
  l.pos=[cx-up[0]*dep/2, mid-up[1]*dep/2, cz-up[2]*dep/2];
  return l;
}
/* The landscape is flat plates at stepped heights, and the ground BETWEEN them
   is made of connecting planes that lean from one plate to the next — along the
   rows, along the columns, and a small piece at each crossing. Nothing is left
   open, and no gap runs in a line, because there are no gaps: what used to be a
   seam is now a surface of its own that can be replaced, textured or removed by
   hand like anything else. */
function buildLandscape(){
  const L=S.land;
  if(L.made&&L.made.length){
    const gone=new Set(L.made);
    S.layers=S.layers.filter(l=>!gone.has(l.id));
    if(gone.has(S.sel)) S.sel=null;
    L.made=[];
    pruneGroups();          // the old landscape's group goes with its surfaces
  }
  const a=S.assets.get(L.asset)||A('earth')||A('ground')||A('blank');
  if(!a) return 0;
  // a landscape made before the broken grid keeps the kind it was made as
  if(!L.mode) L.mode=(L.made&&L.made.length)?'joined':'broken';
  if(L.mode==='broken'){
    const made=buildBroken(L,a);
    const g=makeGroup(made,'landscape');
    if(g) g.collapsed=true;
    L.made=made.map(l=>l.id);
    S.sel=made.length?made[0].id:null;
    markDirty(); draw(); bump();
    return made.length;
  }
  const s=L.size;
  const cover=clamp(L.cover===undefined?0.62:L.cover,0.2,0.98);
  const flat=s*cover, gap=s-flat;
  const x0=S.cam.tgt[0]-L.nx*s/2, z0=S.cam.tgt[2]-L.nz*s/2;
  const H=[];                                    // one height per plate
  for(let i=0;i<=L.nx;i++){ H[i]=[];
    for(let j=0;j<=L.nz;j++) H[i][j]=Math.max(0,landHeight(L,i,j)); }
  const cx=i=>x0+i*s+s/2, cz=j=>z0+j*s+s/2;
  const made=[], grow=1+(L.overlap===undefined?0.06:L.overlap);
  // the plates: flat, each at its own height
  for(let i=0;i<L.nx;i++) for(let j=0;j<L.nz;j++){
    const h=H[i][j];
    made.push(landPlane(a,cx(i),cz(j),flat,flat,h,h,h,h,grow));
  }
  if(gap>0.01){
    // along the rows
    for(let i=0;i<L.nx-1;i++) for(let j=0;j<L.nz;j++)
      made.push(landPlane(a,cx(i)+s/2,cz(j),gap,flat,
        H[i][j],H[i+1][j],H[i][j],H[i+1][j],grow));
    // along the columns
    for(let i=0;i<L.nx;i++) for(let j=0;j<L.nz-1;j++)
      made.push(landPlane(a,cx(i),cz(j)+s/2,flat,gap,
        H[i][j],H[i][j],H[i][j+1],H[i][j+1],grow));
    // and the small piece where four plates meet
    for(let i=0;i<L.nx-1;i++) for(let j=0;j<L.nz-1;j++)
      made.push(landPlane(a,cx(i)+s/2,cz(j)+s/2,gap,gap,
        H[i][j],H[i+1][j],H[i][j+1],H[i+1][j+1],grow));
  }
  const g=makeGroup(made,'landscape');
  if(g) g.collapsed=true;
  L.made=made.map(l=>l.id);
  S.sel=made.length?made[0].id:null;
  markDirty(); draw(); bump();
  return made.length;
}

/* ══ BROKEN GRID — a landscape of uneven plates ════════════
   The grid stops being a grid. Its lines are spaced unevenly,
   its corners are pushed off square — so no plate has four right
   angles — and some plates are divided again into halves, strips
   or quarters, more often where the ground stands high, the way a
   tower reads finer than the plain around it. Heights can come in
   steps, like terraces, and where one plate stands above its
   neighbour a riser closes the drop, so the whole reads as a
   massing rather than as tiles floating at different heights.

   Everything is made of four-corner surfaces sharing exact
   corners: the subdivisions are cut through the same mapping as
   the grid, so no seam opens anywhere. A riser is only drawn from
   the side it faces, which is what keeps a stepped mass readable
   without a depth buffer.
──────────────────────────────────────────────────────────── */
function seeded(seed){
  let s=(seed*2654435761)>>>0||1;
  return ()=>{ s=(s+0x6D2B79F5)>>>0; let t=s;
    t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296; };
}
function buildBroken(L,a){
  const R=seeded(L.seed||1);
  const nx=Math.max(1,L.nx|0), nz=Math.max(1,L.nz|0), s=L.size;
  const irr=clamp(L.irr===undefined?0.5:L.irr,0,1);
  const skew=clamp(L.skew===undefined?0.4:L.skew,0,1);
  // uneven spacing of the grid lines
  const line=(n)=>{ const w=[]; for(let i=0;i<n;i++) w.push(s*(1+irr*(R()*2-1)*0.7));
    const out=[0]; for(const x of w) out.push(out[out.length-1]+x); return out; };
  const xs=line(nx), zs=line(nz);
  // a landscape node says where it stands; the panel builds in front of the camera
  const cx=L.cx===undefined?S.cam.tgt[0]:L.cx, cz=L.cz===undefined?S.cam.tgt[2]:L.cz;
  const x0=cx-xs[nx]/2, z0=cz-zs[nz]/2;
  // corners pushed off square — shared by every plate that meets there
  const Vx=[],Vz=[];
  for(let i=0;i<=nx;i++){ Vx[i]=[]; Vz[i]=[];
    for(let j=0;j<=nz;j++){
      const wx=Math.min(i>0?xs[i]-xs[i-1]:1e9,i<nx?xs[i+1]-xs[i]:1e9);
      const wz=Math.min(j>0?zs[j]-zs[j-1]:1e9,j<nz?zs[j+1]-zs[j]:1e9);
      Vx[i][j]=x0+xs[i]+(R()*2-1)*skew*0.32*wx;
      Vz[i][j]=z0+zs[j]+(R()*2-1)*skew*0.32*wz;
    }}
  const map=(u,v)=>{
    const i=clamp(Math.floor(u),0,nx-1), j=clamp(Math.floor(v),0,nz-1);

/* ══ BUILD — houses out of planes ══════════════════════════
   A building here is not a model. It is a handful of four-corner
   surfaces that agree on their corners: walls that meet, a roof
   that sits on them, steps that climb. Each is made from a few
   numbers and stays made from them — change the width a month
   later and the house rebuilds where it now stands.

   Five kinds: a HOUSE (gable, shed or flat roof), a ROUND building
   (flat, cone or dome), a BRIDGE (deck, rails, piers, an arch if
   asked), a STAIRCASE (straight or turning), and a TUBE — a
   section carried along the drawn path, which is a pipe, a
   tunnel, an arcade or a covered street.

   Closed shapes are drawn from outside only, face by face, which
   is what lets a box read as a box without a depth buffer. Every
   face takes the sun by the way it faces.

   edges — up, level, or tilted — sharing that edge exactly; and

function addBuilding(kind){
  snap(true);

  const p=surfaceAt(vp.x+vp.w/2,vp.y+vp.h*0.62,vp)||[S.cam.tgt[0],0,S.cam.tgt[2]];
  r.origin=[p[0],groundUnder([p[0],p[1],p[2]]),p[2]];
  // faces the camera square on, so the front is the side you are looking at
  const b=basisOf(S.cam);
  r.yaw=Math.atan2(-b.right[2],b.right[0]);

    // carried along the drawn path, kept with it in its own frame

    r.lpath=S.path.map(q=>[q[0]-o[0],q[1],q[2]-o[2]]);

const EDGES=[['top','top'],['bottom','bottom'],['left','left'],['right','right']];
function edgeOf(C,which){
  return which==='bottom'?[C[1],C[0]]:which==='left'?[C[0],C[3]]:which==='right'?[C[2],C[1]]:[C[3],C[2]];
}
function growFrom(l,which,how,angle,len){
  if(!l) return null;
  const C=cornersOf(l,viewports()[0]);
  const [e0,e1]=edgeOf(C,which);
  const e=V.norm(V.sub(e1,e0));
  const n=V.norm(V.cross(V.sub(C[1],C[0]),V.sub(C[3],C[0])));
  const mid=vmid(e0,e1), cen=[0,1,2].map(i=>(C[0][i]+C[1][i]+C[2][i]+C[3][i])/4);
  let out=V.sub(mid,cen); out=V.sub(out,V.mul(e,V.dot(out,e)));       // away from the surface, in its plane
  if(V.len(out)<1e-6) out=V.cross(e,n);
  out=V.norm(out);
  let dir;
  if(how==='same') dir=out;
  else {
    let hz=V.cross(e,[0,1,0]);
    if(V.len(hz)<1e-4) hz=[out[0],0,out[2]];                         // a vertical edge: go level, outward
    hz=V.norm(hz); if(V.dot(hz,out)+V.dot(hz,n)*0.01<0) hz=V.mul(hz,-1);
    if(how==='up') dir=Math.abs(e[1])>0.9?hz:[0,1,0];
    else if(how==='level') dir=hz;
    else { const a=(angle||0)*Math.PI/180; dir=V.norm(V.add(V.mul(hz,Math.cos(a)),[0,Math.sin(a),0])); }
  }
  const L=Math.max(0.05,len||2);
  const N=[e0,e1,V.add(e1,V.mul(dir,L)),V.add(e0,V.mul(dir,L))];
  snap(true);
  const g=quadFrom(l.assetId,N,{uv:l.uv&&isQuad(l)?quadUV(N,l.qtile||0):null});
  if(l.group) g.group=l.group;
  g.useAlpha=l.useAlpha; g.solid=l.solid;
  g.name=(S.assets.get(l.assetId)||{}).name+' '+S.layers.length;
  S.sel=g.id; markDirty(); draw(); bump();
  return g;
}
// Freeze any card into four corners, so its corners can be moved one by one.
function toQuad(l){
  if(!l||isQuad(l)) return l;
  snap(true);
  const C=cornersOf(l,viewports()[0]);
  setQuad(l,C); markDirty(); draw(); bump();
  return l;
}

/* ── dragging a corner ──────────────────────────────────────────
   In BUILD, a selected four-corner surface shows its corners. A
   corner drags on its own level — with shift, straight up or down
   — and catches on any corner of any surface within reach, which
   is how separate planes are joined into one shape without
   measuring anything.
──────────────────────────────────────────────────────────── */
const cornerMode=()=>WS[S.ws]==='BUILD'&&!S.present;
function cornerHandles(){
  if(!cornerMode()) return null;
  const l=S.layers.find(x=>x.id===S.sel);
  if(!isQuad(l)) return null;
  const vp=viewports()[0];
  return quadCorners(l).map((c,i)=>{ const q=project(vp.m,c,vp.w,vp.h);
    return q?{i,c,x:q[0]+vp.x,y:q[1]+vp.y}:null; });
}
function cornerAt(px,py){
  const H=cornerHandles(); if(!H) return null;
  const R=document.body.classList.contains('touch')?22:12;
  let best=null;
  for(const q of H) if(q&&Math.hypot(q.x-px,q.y-py)<R&&(!best||Math.hypot(q.x-px,q.y-py)<best.d))
    best={i:q.i,d:Math.hypot(q.x-px,q.y-py)};
  return best?best.i:null;
}
let cornerSnap=null;
function cornerDrag(drag,e){
  const l=drag.layer, vp=drag.vp;
  const C=quadCorners(l), c0=drag.c0;
  let p;
  if(drag.vert||e.shiftKey){
    const d=Math.max(0.5,distTo(c0,vp.b.eye)), mPerPx=2*vp.tan*d/vp.h;
    p=[c0[0],c0[1]+(drag.y0-e.clientY)*mPerPx,c0[2]];
  } else {
    const g=rayPlane(e.clientX,e.clientY,vp,c0[1]);
    if(!g) return;
    p=[g[0]+drag.off[0],c0[1],g[2]+drag.off[1]];
  }
  // catch on the nearest corner of anything else in reach
  cornerSnap=null;
  if(S.snapOpt.on!==false){
    const reach=Math.max(0.2,(S.snapOpt.dist||1)*1.2);
    let best=null;
    for(const q of S.layers){
      if(q===l||q.hidden) continue;
      if(!(isQuad(q)||isPlane(q)||q.face==='fixed'||q.face==='free')) continue;
      for(const k of cornersOf(q,vp)){
        const dd=V.len(V.sub(k,p));
        if(dd<reach&&(!best||dd<best.d)) best={d:dd,k};
      }
    }
    if(best){ p=best.k.slice(); cornerSnap=p; }
  }
  C[drag.corner]=p;
  const keep={yaw:l.yaw};
  setQuad(l,C);
  markDirty(); draw(); bump();
}
function drawCornerHandles(){
  const H=cornerHandles(); if(!H) return;
  octx.save();
  for(const q of H){ if(!q) continue;
    const on=drag&&drag.corner===q.i;
    octx.fillStyle=on?'#FF3A1E':'#F2F2F2';
    octx.fillRect(q.x-4,q.y-4,8,8);
    octx.strokeStyle='rgba(0,0,0,0.6)'; octx.lineWidth=1; octx.strokeRect(q.x-4.5,q.y-4.5,9,9);
  }
  if(cornerSnap&&drag&&drag.corner!==undefined){
    const vp=viewports()[0], s=project(vp.m,cornerSnap,vp.w,vp.h);
    if(s){ octx.strokeStyle='#4CC38A'; octx.lineWidth=1.5;
      octx.beginPath(); octx.arc(s[0]+vp.x,s[1]+vp.y,8,0,6.284); octx.stroke(); }
  }
  octx.restore();
}

/* ══ BRIDGE — SC3NE among the other tools ══════════════════
   SC3NE does not need to know what is on the other end. It
   needs a common language, and MIDI is the one every SYSTEM8
   tool already speaks.

   Two directions, kept separate on purpose:
     SLAVE  — something out there moves things in here
     MASTER — things in here are sent out as CC or as MPE

   MPE matters because its three dimensions per voice map onto
   the three SC3NE cares about. A note's pitch bend is X, its
   timbre is Y, its pressure is Z — or a colour, which is also
   three. Same shape, so the same wire carries either.
──────────────────────────────────────────────────────────── */
const MIDI={access:null,ins:[],outs:[],in:null,out:null,err:''};

// What can be driven from outside. Each is a name, a range and a way in.
const BRIDGE_TARGETS=[
  ['camera turn',      v=>{S.cam.az=v*Math.PI*2;},        ()=>S.cam.az/(Math.PI*2)],
  ['camera height',    v=>{S.cam.el=-0.25+v*1.7;},        ()=>(S.cam.el+0.25)/1.7],
  ['camera distance',  v=>{S.cam.dist=2+v*398;},          ()=>(S.cam.dist-2)/398],
  ['lens',             v=>{S.cam.lens=10+v*190;},         ()=>(S.cam.lens-10)/190],
  ['exposure',         v=>{S.exposure=0.4+v*1.4;},        ()=>(S.exposure-0.4)/1.4],
  ['contrast',         v=>{S.contrast=0.4+v*1.4;},        ()=>(S.contrast-0.4)/1.4],
  ['saturation',       v=>{S.saturation=v*2;},            ()=>S.saturation/2],
  ['fog',              v=>{S.fog=v*2.5;},                 ()=>S.fog/2.5],
  ['sun turn',         v=>{S.sun.az=v*6.28;},             ()=>S.sun.az/6.28],
  ['sun height',       v=>{S.sun.el=0.01+v*1.54;},        ()=>(S.sun.el-0.01)/1.54],
  ['sun strength',     v=>{S.sun.int=v*1.4;},             ()=>S.sun.int/1.4],
  ['duotone',          v=>{S.duo.amt=v;},                 ()=>S.duo.amt],
  ['weather amount',   v=>{ for(const em of S.emit||[]) em.amount=v; },
                       ()=>(S.emit&&S.emit[0])?S.emit[0].amount:0],
  ['playback speed',   v=>{S.clock.master=v*3;},          ()=>(S.clock.master||1)/3],
  ['sky turn',         v=>{HDRI.spin=v*6.28;},            ()=>HDRI.spin/6.28],
  ['selected · across',v=>{const l=selLayer(); if(l){l.pos[0]=-100+v*200;}},
                       ()=>{const l=selLayer(); return l?(l.pos[0]+100)/200:0;}],
  ['selected · up',    v=>{const l=selLayer(); if(l){l.pos[1]=v*60;}},
                       ()=>{const l=selLayer(); return l?l.pos[1]/60:0;}],
  ['selected · back',  v=>{const l=selLayer(); if(l){l.pos[2]=-100+v*400;}},
                       ()=>{const l=selLayer(); return l?(l.pos[2]+100)/400:0;}],
  ['selected · size',  v=>{const l=selLayer(); if(l){l.height=0.2+v*60;}},
                       ()=>{const l=selLayer(); return l?(l.height-0.2)/60:0;}],
  ['selected · fade',  v=>{const l=selLayer(); if(l){l.opacity=v;}},
                       ()=>{const l=selLayer(); return l?(l.opacity===undefined?1:l.opacity):0;}]
];
const selLayer=()=>S.layers.find(x=>x.id===S.sel);
const targetByName=n=>BRIDGE_TARGETS.find(t=>t[0]===n);

function midiInit(){
  if(!navigator.requestMIDIAccess){
    MIDI.err='This browser has no MIDI. Safari on iPad is the usual reason — '+
      'a desktop browser, or a wrapper that provides it, will see your devices.';
    bump(); return;
  }
  navigator.requestMIDIAccess({sysex:false}).then(acc=>{
    MIDI.access=acc; MIDI.err='';
    const scan=()=>{
      MIDI.ins=[...acc.inputs.values()];
      MIDI.outs=[...acc.outputs.values()];
      if(MIDI.in&&!MIDI.ins.find(p=>p.id===MIDI.in.id)) MIDI.in=null;
      if(MIDI.out&&!MIDI.outs.find(p=>p.id===MIDI.out.id)) MIDI.out=null;
      bump();
    };
    acc.onstatechange=scan; scan();
    S.midi.on=true; bump();
  }).catch(err=>{ MIDI.err=String(err&&err.message||err); bump(); });
}
function midiListen(port){
  if(MIDI.in) MIDI.in.onmidimessage=null;
  MIDI.in=port;
  if(port) port.onmidimessage=onMIDI;
  bump();
}
const chOf=b=>(b&0x0f)+1;
const wanted=ch=>!S.midi.ch||S.midi.ch===ch;

// MPE: one note per channel across a zone, each carrying bend, timbre and
// pressure. Three continuous dimensions per voice, which is exactly the shape
// of a position or a colour.
const MPEV={};
function mpeUpdate(ch){
  const v=MPEV[ch]; if(!v) return;
  const m=S.midi;
  if(m.mpeTarget==='position'){
    const l=selLayer(); if(!l) return;
    l.pos[0]=(v.bend*2-1)*(m.span||20);
    l.pos[1]=Math.max(0,v.slide*(m.span||20)*0.5);
    l.pos[2]=(v.press*2-1)*(m.span||20);
    markDirty();
  } else if(m.mpeTarget==='colour'){
    const l=selLayer(); if(!l) return;
    l.tint=hsv(v.bend,0.2+v.slide*0.8,0.3+v.press*0.7);
    markDirty();
  } else if(m.mpeTarget==='camera'){
    S.cam.az=(v.bend*2-1)*Math.PI;
    S.cam.el=clamp(v.slide*1.4,-0.2,1.4);
    S.cam.dist=2+v.press*200;
  }
  draw();
}
function onMIDI(e){
  const d=e.data, st=d[0]&0xf0, ch=chOf(d[0]);
  const m=S.midi;
  if(m.role==='master') return;              // sending, not listening
  if(!wanted(ch)) return;
  if(m.mpe){
    if(ch>=(m.zoneFrom||2)&&ch<=(m.zoneTo||16)){
      const v=MPEV[ch]||(MPEV[ch]={bend:0.5,slide:0,press:0,on:false});
      if(st===0x90&&d[2]>0){ v.on=true; v.note=d[1]; }
      else if(st===0x80||(st===0x90&&d[2]===0)) v.on=false;
      else if(st===0xe0) v.bend=((d[2]<<7|d[1])/16383);
      else if(st===0xb0&&d[1]===74) v.slide=d[2]/127;
      else if(st===0xd0) v.press=d[1]/127;
      if(v.on) mpeUpdate(ch);
      return;
    }
  }
  if(st===0xb0){
    const cc=d[1], val=d[2]/127;
    if(m.learn){                              // the next knob you touch takes it
      m.map=[...(m.map||[]).filter(x=>x.target!==m.learn), {cc,ch,target:m.learn}];
      m.learn=null; hint('CC '+cc+' → '+(m.map[m.map.length-1].target)); bump();
      return;
    }
    for(const b of m.map||[]) if(b.cc===cc){
      const t=targetByName(b.target); if(t) t[1](val);
    }
    markDirty(); draw();
  }
}
// Sending. XYZ and colour are three numbers each, so both fit the same three CCs
// — which is the whole reason the bridge stays this small.
function midiSend(bytes){
  if(!MIDI.out||S.midi.role!=='master') return;
  try{ MIDI.out.send(bytes); }catch(err){}
}
const cc7=(ch,cc,v)=>midiSend([0xb0|((ch-1)&0x0f),cc&0x7f,
  Math.max(0,Math.min(127,Math.round(v*127)))]);
function bridgeTick(){
  const m=S.midi;
  if(m.role!=='master'||!MIDI.out) return;
  const ch=m.ch||1;
  const l=selLayer();
  if(m.send==='colour'){
    const c=(l&&l.tint)||[1,1,1];
    cc7(ch,m.cc0||16,c[0]); cc7(ch,(m.cc0||16)+1,c[1]); cc7(ch,(m.cc0||16)+2,c[2]);
  } else {
    const p=l?l.pos:S.cam.tgt;
    const sp=m.span||20;
    cc7(ch,m.cc0||16,(p[0]/sp+1)/2);
    cc7(ch,(m.cc0||16)+1,clamp(p[1]/sp,0,1));
    cc7(ch,(m.cc0||16)+2,(p[2]/sp+1)/2);
  }
}

// The bridge, as a block the settings panel can hold. It is plumbing between
// machines, not a tool for making pictures, so it belongs under the hamburger.
function BridgeBlock(){
  const K=[];
    const m=S.midi;
    K.push(h('div',{className:'seg',key:'role'},

/* ══ WEB — the scene as a page ═════════════════════════════
   In presentation the saved views can be read the way a page is
   read: by scrolling. A tall, invisible page sits in front of the
   canvas, one stretch of it per view, and the browser does the
   scrolling — its momentum, its snapping, its back button. The
   camera only listens.

   STEPS   the wheel steps one view per gesture (what there was)
   SNAPS   each view is one screen; the page snaps to it, and when
           it settles the camera flies there
   FLIES   the scroll position IS the camera: scrolling moves it
           continuously along the numbered views, resting at each

   How long a move takes can come from the view, as in a slide
   deck, or from the distance it covers. By distance, a move takes
   longer the further it goes, but less than in proportion — so a
   long sweep travels fast and a small adjustment moves gently.
   In FLIES the same rule decides how much scrolling a move costs.
──────────────────────────────────────────────────────────── */
function newWeb(){
  return {scroll:'off',timing:'distance',minT:0.5,stdT:1.6,maxT:4,far:0.5,
    leg:1.0,rest:0.6,settle:'near',smooth:0.35,hash:true,panels:true,reduce:true};
}
// Old documents have no settings here, newer ones may lack a field.
function webNormalise(){ S.web=Object.assign(newWeb(),S.web||{}); }
const webOn=()=>!!S.web&&(S.web.scroll==='snap'||S.web.scroll==='fly');
const webActive=()=>webOn()&&S.present&&S.shots.length>0;
const reducedMotion=()=>{ try{ return !!(S.web&&S.web.reduce!==false)&&
  matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(err){ return false; } };

/* ── how far one view is from another ─────────────────────────
   Not only the metres the eye travels: turning on the spot is a
   move too, and so is a change of lens. All three are read in
   metres at the distance the camera is looking, so they add.
──────────────────────────────────────────────────────────── */
function viewGap(a,b){
  const ea=basisOf(a).eye, eb=basisOf(b).eye;
  const r=Math.max(1,((a.dist||20)+(b.dist||20))/2);
  let da=(b.az||0)-(a.az||0);
  while(da>Math.PI) da-=2*Math.PI; while(da<-Math.PI) da+=2*Math.PI;
  const turn=Math.abs(da)+Math.abs((b.el||0)-(a.el||0));
  const zoom=Math.abs(Math.log(Math.max(1,a.lens||50)/Math.max(1,b.lens||50)));
  return V.len(V.sub(ea,eb))*0.5+V.len(V.sub(a.tgt,b.tgt))*0.5+turn*r*0.6+zoom*r*0.5;
}
// The typical move in this deck — the median leg — so "a typical move" means
// the same thing in a garden as in a city.
function typicalGap(){
  const n=S.shots.length; if(n<2) return 20;
  const g=[];
  for(let i=0;i<n-1;i++) g.push(viewGap(S.shots[i],S.shots[i+1]));
  g.sort((x,y)=>x-y);
  return Math.max(0.5,g[(g.length/2)|0]);
}
// time = shortest + k·distance^p, with p below one: double the distance and the
// move takes less than twice as long, so it is faster. p = 1 would be constant
// speed; p = 0 would make every move the same length of time.
function flightTime(a,b){
  const W=S.web||newWeb();
  if(reducedMotion()) return 0.2;
  if(W.timing==='slide') return moveOf(b);
  const p=clamp(1-(W.far===undefined?0.5:W.far),0,1);
  const d=viewGap(a,b), ref=typicalGap();
  const k=Math.max(0,(W.stdT-W.minT))/Math.pow(ref,p);
  return clamp(W.minT+k*Math.pow(d,p),W.minT,Math.max(W.minT,W.maxT));
}

/* ── the page ───────────────────────────────────────────────── */
let webEl=null, webSig='', webIdx=-1, webSettle=null, webTarget=null, webLegs=null;
function webBuild(){
  if(!webEl){
    webEl=document.createElement('div'); webEl.id='webscroll';
    webEl.innerHTML='<div class="track"></div>';
    document.body.appendChild(webEl);
    webEl.addEventListener('scroll',guard(webScrolled),{passive:true});
    // the outer thirds still step, as presentation always has
    webEl.addEventListener('click',guard(e=>{
      if(e.target.closest&&e.target.closest('.webpanel,.presentbar,a')) return;
      if(gameClick(e.clientX,e.clientY)) return;
      if(e.clientX<W*0.28) webStep(-1); else if(e.clientX>W*0.72) webStep(1);
    }));
    if('onscrollsnapchange' in webEl)
      webEl.addEventListener('scrollsnapchange',guard(()=>webScrolled(true)));
  }
  const W_=S.web, n=S.shots.length, H=Math.max(1,window.innerHeight);
  const track=webEl.firstChild;
  track.innerHTML='';
  webEl.className='on '+W_.scroll+(W_.scroll==='fly'?' settle-'+W_.settle:'');
  if(W_.scroll==='snap'){
    webLegs=null;
    for(let i=0;i<n;i++){
      const s=document.createElement('section');
      s.style.height=H+'px'; s.dataset.i=i; track.appendChild(s);
    }
    return;
  }
  // FLIES: each view rests for a while, then each leg costs scroll in proportion
  // to how long the move between the two would take
  const legs=[]; let y=0;
  const times=[];
  for(let i=0;i<n-1;i++) times.push(flightTime(S.shots[i],S.shots[i+1]));
  const mean=times.length?times.reduce((a,b)=>a+b,0)/times.length:1;
  for(let i=0;i<n;i++){
    const rest=Math.max(0,W_.rest)*H;
    legs.push({i,at:y,rest});
    const m=document.createElement('section');
    m.className='mark'; m.style.top=y+'px'; m.dataset.i=i; track.appendChild(m);
    y+=rest;
    if(i<n-1){
      const len=Math.max(H*0.15,W_.leg*H*(times[i]/Math.max(0.01,mean)));
      legs[i].leg=len; y+=len;
    } else legs[i].leg=0;
  }
  track.style.height=(y+H)+'px';
  webLegs={legs,total:y};
}
// Rebuilt only when something it depends on has changed.
function webSync(){
  const on=webActive();
  if(!on){
    if(webEl&&webEl.classList.contains('on')){ webEl.className=''; webEl.firstChild.innerHTML=''; }
    webSig=''; webIdx=-1; webTarget=null;
    document.body.classList.remove('webpage');
    return;
  }
  document.body.classList.add('webpage');
  const sh=S.shots.map(s=>[s.tgt.join(','),s.az,s.el,s.dist,s.lens,s.move].join(';')).join('|');
  const sig=JSON.stringify(S.web)+'#'+sh+'#'+window.innerHeight;
  if(sig===webSig) return;
  webSig=sig;
  const keep=webIdx>=0?webIdx:slideIndex();
  webBuild();
  webGoto(keep,false);
}
function webOffset(i){
  const n=S.shots.length; i=clamp(i,0,n-1);
  if(S.web.scroll==='snap') return i*Math.max(1,window.innerHeight);
  return webLegs&&webLegs.legs[i]?webLegs.legs[i].at:0;
}
function webGoto(i,smooth){
  if(!webEl) return;
  i=clamp(i,0,S.shots.length-1);
  if(!smooth){
    // jump: put the page and the camera there together
    webEl.scrollTop=webOffset(i);
    webIdx=i; applyShot(S.shots[i]); applyShotState(S.shots[i]);
    S.shotSel=S.shots[i].id; webTarget=null;
    webHash(i); gameArrive(); draw(); bump();
    return;
  }
  webEl.scrollTo({top:webOffset(i),behavior:reducedMotion()?'auto':'smooth'});
}
function webStep(d){
  const n=S.shots.length; if(!n) return;
  let i=(webIdx<0?slideIndex():webIdx)+d;
  if(S.play.loop) i=(i+n)%n; else i=clamp(i,0,n-1);
  webGoto(i,true);
  hint((i+1)+' / '+n);
}
function webHash(i){
  if(!S.web||!S.web.hash) return;
  try{ history.replaceState(null,'','#view-'+(i+1)); }catch(err){}
}
function webScrolled(now){
  if(!webActive()) return;
  if(S.web.scroll==='fly'){ webFly(); return; }
  // SNAPS: wait for the page to come to rest, then fly
  clearTimeout(webSettle);
  const go=()=>{
    const H=Math.max(1,window.innerHeight);
    const i=clamp(Math.round(webEl.scrollTop/H),0,S.shots.length-1);
    if(i===webIdx) return;
    webIdx=i;
    const s=S.shots[i];
    tweenTo(s,flightTime(camNow(),s));
    webHash(i);
  };
  if(now===true) go(); else webSettle=setTimeout(go,110);
}
// FLIES: where the scroll is, in views — a rest at each, a leg between.
function webFly(){
  if(!webLegs||S.play.on) return;
  const y=webEl.scrollTop, L=webLegs.legs;
  let k=0;
  while(k<L.length-1&&y>=L[k+1].at) k++;
  const g=L[k], into=y-g.at;
  const a=S.shots[k], b=S.shots[Math.min(k+1,S.shots.length-1)];
  let u=0;
  if(into>g.rest&&g.leg>0) u=clamp((into-g.rest)/g.leg,0,1);
  const t=S.play.ease?easeIO(u):u;
  webTarget={tgt:[0,1,2].map(i=>a.tgt[i]+(b.tgt[i]-a.tgt[i])*t),
    dist:a.dist+(b.dist-a.dist)*t, az:lerpAng(a.az,b.az,t),
    el:a.el+(b.el-a.el)*t, lens:a.lens+(b.lens-a.lens)*t};
  const near=u<0.5?k:Math.min(k+1,S.shots.length-1);
  if(near!==webIdx){
    webIdx=near; S.shotSel=S.shots[near].id;
    applyShotState(S.shots[near]); webHash(near); bump();
    setTimeout(gameArrive,0);              // after the camera has had a frame to arrive
  }
  tween=null;                              // the page drives the camera now
  animCheck();
}
// Called every frame: ease the camera toward where the page says it should be.
let webTickT=0;
function webTick(){
  if(!webTarget||!webActive()){ webTickT=0; return false; }
  // measured in time, not frames, so a slow device glides the same distance
  const now=performance.now(), dt=webTickT?clamp(now-webTickT,1,200):16; webTickT=now;
  const sm=clamp(S.web.smooth||0,0,0.95);
  const k=reducedMotion()?1:1-Math.pow(sm,dt/16.7);
  const c=S.cam, T_=webTarget;
  c.tgt=[0,1,2].map(i=>c.tgt[i]+(T_.tgt[i]-c.tgt[i])*k);
  c.dist+=(T_.dist-c.dist)*k; c.el+=(T_.el-c.el)*k; c.lens+=(T_.lens-c.lens)*k;
  c.az=lerpAng(c.az,T_.az,k);
  const left=Math.abs(T_.dist-c.dist)+Math.abs(T_.el-c.el)+Math.abs(T_.lens-c.lens)+
    Math.abs(lerpAng(c.az,T_.az,1)-c.az)+V.len(V.sub(T_.tgt,c.tgt));
  if(left<0.0005){ Object.assign(c,{tgt:T_.tgt.slice(),dist:T_.dist,el:T_.el,lens:T_.lens,az:T_.az});
    webTarget=null; return false; }
  return true;
}
const webChasing=()=>!!webTarget&&webActive();
window.addEventListener('resize',()=>{ if(webActive()){ webSig=''; webSync(); } });
// Starting at the view the address names, if it names one.
function webFromHash(){
  const m=/^#view-(\d+)$/.exec(location.hash||'');
  return m?clamp(parseInt(m[1],10)-1,0,Math.max(0,S.shots.length-1)):-1;
}

/* ── a panel for each view ────────────────────────────────────
   Real page text, not text in the scene: it can be selected,
   translated and found. Kept deliberately small — paragraphs, a
   heading with #, and [links](https://…). Nothing else is read as
   markup, so a panel can never carry a script.
──────────────────────────────────────────────────────────── */
const newPage=()=>({side:'right',open:'auto',body:''});
function pageHTML(src){
  const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
  const inline=t=>esc(t).replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:|#)[^)\s]+)\)/g,
    (m,a,u)=>'<a href="'+u+'"'+(u[0]==='#'?'':' target="_blank" rel="noopener"')+'>'+a+'</a>');
  return String(src||'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean).map(p=>
    /^#\s/.test(p)?'<h2>'+inline(p.replace(/^#\s+/,''))+'</h2>'
                  :'<p>'+inline(p).replace(/\n/g,'<br>')+'</p>').join('');
}
function WebPanel(){
  const [openTap,setOpenTap]=React.useState(null);
  if(!S.present||!S.web||!S.web.panels) return null;
  const i=webActive()&&webIdx>=0?webIdx:slideIndex();
  const s=S.shots[i];
  const pg=s&&s.page;
  if(!pg||!pg.body||pg.open==='off') return null;
  const shown=pg.open==='auto'?openTap!==s.id+':closed':openTap===s.id+':open';
  const side=pg.side==='left'?'left':'right';
  return h(React.Fragment,null,
    h('aside',{className:'webpanel '+side+(shown?' open':''),
      onWheel:e=>e.stopPropagation()},
      h('button',{className:'wpx','aria-label':'close',
        onClick:()=>setOpenTap(s.id+':closed')},'✕'),
      h('div',{className:'wpbody',dangerouslySetInnerHTML:{__html:pageHTML(pg.body)}})),
    shown?null:h('button',{className:'webtab '+side,'aria-label':'open',
      onClick:()=>setOpenTap(s.id+':open')},side==='left'?'›':'‹'));
}

/* ── the room ───────────────────────────────────────────────── */
function webPanel(K){
  webNormalise();
  const W_=S.web;
  const set=(k,v)=>{ W_[k]=v; markDirty(); webSync(); draw(); bump(); };
  K.push(h('div',{className:'note',key:'n'},
    'How the scene behaves as a page. Nothing here changes the editor — it acts in '+
    'presentation, in PREVIEW below, and wherever the scene is embedded. Saved with '+
    'the scene, so a scene file carries its own page settings.'));
  const mode=W_.scroll==='step'||(W_.scroll==='off'&&S.scrollDeck)?'step':W_.scroll;
  K.push(h('div',{className:'seg',key:'sc'},
    [['off','off'],['step','steps'],['snap','snaps'],['fly','flies']].map(([k,lab])=>
      h('button',{key:k,className:mode===k?'on':'',onClick:()=>{
        S.scrollDeck=(k==='step'); set('scroll',k);}},lab))));
  K.push(h('div',{className:'note',key:'scn'},
    mode==='off'?'Scrolling does nothing; the views are stepped with the arrows and taps.':
    mode==='step'?'The wheel or a flick moves one view per gesture — the scroll that was '+
      'already here.':
    mode==='snap'?'A page one screen per view, snapping like a page. When it comes to rest '+
      'the camera flies to that view. Momentum, the back button and an address per view '+
      'all come from the browser.':
    'The scroll position is the camera. Scrolling flies it through the views in their '+
    'numbered order and stops at each; scrolling back flies it back. Nothing jumps.'));
  if(mode==='snap'||mode==='fly'||W_.scroll==='step'){
    K.push(h('div',{className:'seg',key:'tm'},
      [['distance','by distance'],['slide',"each view's own"]].map(([k,lab])=>
        h('button',{key:k,className:W_.timing===k?'on':'',onClick:()=>set('timing',k)},lab))));
    if(W_.timing==='distance'){
      K.push(h(Slider,{key:'mn',label:'Shortest move',min:0.1,max:3,step:0.05,value:W_.minT,
        onChange:v=>set('minT',Math.min(v,W_.maxT)),fmt:v=>v.toFixed(2)+' s'}));
      K.push(h(Slider,{key:'sd',label:'A typical move',min:0.2,max:6,step:0.05,value:W_.stdT,
        onChange:v=>set('stdT',v),fmt:v=>v.toFixed(2)+' s'}));
      K.push(h(Slider,{key:'mx',label:'Longest move',min:0.5,max:12,step:0.1,value:W_.maxT,
        onChange:v=>set('maxT',Math.max(v,W_.minT)),fmt:v=>v.toFixed(1)+' s'}));
      K.push(h(Slider,{key:'fr',label:'Far moves fly faster',min:0,max:1,step:0.01,value:W_.far,
        onChange:v=>set('far',v),
        fmt:v=>v<0.01?'same speed':(v>0.99?'same time':Math.round(v*100)+'%')}));
      K.push(h('div',{className:'note',key:'tn'},
        'A typical move is the middle one in this deck. At 0% every move travels at one '+
        'speed, so a long one takes long. At 100% every move takes the same time, so a '+
        'long one is a rush and a short one a crawl. Between, a far move takes longer '+
        'than a near one but covers the ground faster.'));
      if(S.shots.length>1)
        K.push(h(List,{key:'legs',label:'The moves',count:(S.shots.length-1)+'',open:false},
          S.shots.slice(0,-1).map((a,i)=>{
            const b=S.shots[i+1], d=viewGap(a,b), t=flightTime(a,b);
            return h('div',{className:'row',key:a.id},
              h('span',{className:'k'},(i+1)+' → '+(i+2)),
              h('span',{className:'v'},Math.round(d)+' m  ·  '+t.toFixed(1)+' s  ·  '+
                Math.round(d/Math.max(0.05,t))+' m/s'));
          })));
    }
  }
  if(mode==='fly'){
    K.push(h(Slider,{key:'lg',label:'Scroll for a typical move',min:0.3,max:4,step:0.05,
      value:W_.leg,onChange:v=>set('leg',v),fmt:v=>v.toFixed(2)+' screens'}));
    K.push(h(Slider,{key:'rs',label:'Rest at each view',min:0,max:3,step:0.05,
      value:W_.rest,onChange:v=>set('rest',v),fmt:v=>v<0.01?'none':v.toFixed(2)+' screens'}));

/* ══ GAME — things that speak, places that answer ══════════
   The smallest game this scene can be: some layers SPEAK when
   they are clicked in presentation, some layers are ZONES that
   speak — or move the story on — when a view is reached inside
   them. The player is the camera; the views are where they can
   stand.

   What is said is chosen, not generated. Each voice is a body of
   lines: public-domain texts quoted exactly, and lines written for
   SC3NE in a manner, never copied from anyone. A line carries the
   steps of the journey it belongs to and a few images. Choosing
   follows three rules:

   1. A voice does not repeat itself until it has said everything
      it has — the bag is emptied before it is refilled. (John
      Cage drew from his charts the same way.)
   2. Lines that belong to the current step of the journey weigh
      more.
   3. A line that shares an image with what was last said — by
      any voice, or by the place you are standing in — weighs more.
      That is the coincidence the player will notice: not chance,
      and not a script, but chance leaning toward what just
      happened. Synchronicity, simulated, and honest about it.

   Lao Tzu adds one rule of his own: press him and he says less.
──────────────────────────────────────────────────────────── */

const VOICE_KEYS=Object.keys(VOICES);
function newGame(){
  return {on:true,start:0,stage:0,every:3,type:34,hold:2.6,quiet:true,echo:0.6,
    own:{},names:{}};
}
function gameNormalise(){ S.game=Object.assign(newGame(),S.game||{}); }
// One line as data. "[tag,tag] text" in your own lines sets its images.
function parseLine(s){
  const p=String(s).split('|');
  if(p.length>=3) return {st:p[0]?p[0].split(',').map(Number):[],tags:p[1]?p[1].split(','):[],
    t:p.slice(2).join('|')};
  const m=/^\s*\[([^\]]*)\]\s*(.*)$/.exec(s);
  if(m) return {st:[],tags:m[1].split(',').map(x=>x.trim()).filter(Boolean),t:m[2]};
  return {st:[],tags:[],t:String(s).trim()};
}
const voiceName=k=>(S.game&&S.game.names&&S.game.names[k])||(VOICES[k]||{}).name||k;
function voiceLines(k){
  const v=VOICES[k]; if(!v) return [];
  const own=((S.game&&S.game.own&&S.game.own[k])||'').split('\n').map(x=>x.trim()).filter(Boolean);
  return v.lines.map(parseLine).concat(own.map(parseLine)).filter(x=>x.t);
}

/* ── the running game: never saved, started again with each presentation ── */
const GR={bags:{},echo:[],enc:0,log:[],press:{},zonesIn:new Set(),fired:new Set(),caps:[]};
function gameStart(){
  gameNormalise();
  S.game.stage=clamp(S.game.start|0,0,JOURNEY.length-1);
  GR.bags={}; GR.echo=[]; GR.enc=0; GR.log=[]; GR.press={};
  GR.zonesIn=new Set(); GR.fired=new Set(); gameClear();
}
function pickLine(k,place){
  const all=voiceLines(k); if(!all.length) return null;
  let bag=GR.bags[k];
  if(!bag||!bag.length) bag=GR.bags[k]=all.map((_,i)=>i);       // the bag refills
  const G=S.game, st=G.stage;
  const near=new Set(GR.echo.concat(place||[]));
  // Lao Tzu, pressed, has less to say: each quick return shortens what he allows
  let maxLen=1e9;
  if(VOICES[k]&&VOICES[k].quiet&&G.quiet){
    const pr=GR.press[k]||{n:0,t:0}, now=performance.now();
    pr.n=(now-pr.t<6000)?pr.n+1:0; pr.t=now; GR.press[k]=pr;
    if(pr.n>=3) return {t:'…',tags:['silence'],st:[]};
    if(pr.n===2) maxLen=60; else if(pr.n===1) maxLen=95;
  }
  let cands=bag.filter(i=>all[i]&&all[i].t.length<=maxLen);
  if(!cands.length) cands=all.map((_,i)=>i).filter(i=>all[i].t.length<=maxLen);
  if(!cands.length) return {t:'…',tags:['silence'],st:[]};
  const w=cands.map(i=>{
    const L=all[i];
    let x=1;
    if(L.st.length) x*=L.st.includes(st)?3.2:0.35;              // belongs to this step, or not
    const hits=L.tags.filter(t=>near.has(t)).length;
    x*=1+hits*2.5*(G.echo===undefined?0.6:G.echo);               // the echo
    return x;
  });
  let r=Math.random()*w.reduce((a,b)=>a+b,0), j=0;
  while(j<w.length-1&&(r-=w[j])>0) j++;
  const idx=cands[j];
  GR.bags[k]=bag.filter(i=>i!==idx);
  return all[idx];
}
// A line is said: it is shown, remembered, and the story counts it.
function say(k,from,place){
  const L=pickLine(k,place); if(!L) return null;
  GR.echo=L.tags.slice(0,3);
  GR.log.push({voice:k,t:L.t,stage:S.game.stage});
  if(GR.log.length>80) GR.log.shift();
  if(L.t!=='…'&&++GR.enc>=Math.max(1,S.game.every|0)){
    GR.enc=0; S.game.stage=Math.min(JOURNEY.length-1,S.game.stage+1);
  }
  gameCaption(k,L.t,from);
  bump(); return L;
}

/* ── what a click does in presentation ───────────────────────── */
const isZone=l=>!!(l&&l.game&&l.game.zone);
const speaks=l=>!!(l&&l.game&&l.game.voice&&!l.game.zone);
const gameLive=()=>S.present&&!!S.game&&S.game.on!==false;
function gameClick(x,y){
  if(!gameLive()) return false;
  const l=pick(x,y,vpAt(x)||viewports()[0]);
  if(!speaks(l)) return false;
  say(l.game.voice,l,l.game.tags);
  return true;
}
// Arriving at a view: any zone the camera's aim falls inside answers once.
function zoneHas(l,p){
  const a=S.assets.get(l.assetId); if(!a) return false;
  const yaw=l.yaw||0, r=[Math.cos(yaw),0,-Math.sin(yaw)], f=[Math.sin(yaw),0,Math.cos(yaw)];
  const w=Math.abs(widthOf(l,a))/2;
  if(!isPlane(l)){                                // a standing zone: a disc around it
    return Math.hypot(p[0]-l.pos[0],p[2]-l.pos[2])<Math.max(w,l.height*0.5);
  }
  const d=l.height/2, c=[l.pos[0]+f[0]*d,0,l.pos[2]+f[2]*d];
  const q=[p[0]-c[0],0,p[2]-c[2]];
  return Math.abs(q[0]*r[0]+q[2]*r[2])<=w&&Math.abs(q[0]*f[0]+q[2]*f[2])<=d;
}
function gameArrive(){
  if(!gameLive()) return;
  const p=S.cam.tgt;
  const now=new Set();
  for(const l of S.layers){
    if(!isZone(l)||!zoneHas(l,p)) continue;
    now.add(l.id);
    if(GR.zonesIn.has(l.id)) continue;            // already standing in it
    if(l.game.once&&GR.fired.has(l.id)) continue;
    GR.fired.add(l.id);
    if(l.game.stage!==null&&l.game.stage!==undefined&&l.game.stage>=0)
      S.game.stage=clamp(l.game.stage|0,0,JOURNEY.length-1);
    if(l.game.voice) say(l.game.voice,null,l.game.tags);
  }
  GR.zonesIn=now;
}

/* ── words on the screen ─────────────────────────────────────────
   Page text, typed out beside whoever says it — or low in the frame
   when a place speaks. It fades on its own; a new line from the same
   voice replaces the old one.
──────────────────────────────────────────────────────────── */
let capEl=null;
function capRoot(){
  if(!capEl){ capEl=document.createElement('div'); capEl.id='gamesay'; document.body.appendChild(capEl); }
  return capEl;
}
function gameCaption(k,text,from){
  const root=capRoot();
  GR.caps=GR.caps.filter(c=>{ if(c.voice===k){ c.el.remove(); return false; } return true; });
  while(GR.caps.length>=3){ const c=GR.caps.shift(); c.el.remove(); }
  const el=document.createElement('div');
  el.className='cap'+(from?'':' narr');
  el.innerHTML='<span class="who"></span><span class="txt"></span>';
  el.firstChild.textContent=voiceName(k);
  root.appendChild(el);
  const G=S.game;
  const typeT=text.length/Math.max(5,G.type||34);
  GR.caps.push({voice:k,text,from:from?from.id:null,el,t0:performance.now(),
    life:(typeT+Math.max(0.8,G.hold||2.6)+text.length*0.03)*1000,typeT:typeT*1000});
  animCheck();
}
function gameClear(){ for(const c of GR.caps) c.el.remove(); GR.caps=[]; }
const gameBusy=()=>GR.caps.length>0;
function gameCaptionsTick(){
  if(!GR.caps.length) return;
  const now=performance.now(), vp=viewports()[0];
  GR.caps=GR.caps.filter(c=>{
    const age=now-c.t0;
    if(age>c.life){ c.el.remove(); return false; }
    const n=Math.ceil(c.text.length*clamp(age/Math.max(1,c.typeT),0,1));
    const tx=c.el.lastChild;
    if(tx.textContent.length!==n) tx.textContent=c.text.slice(0,n);
    c.el.style.opacity=String(clamp((c.life-age)/700,0,1));
    const l=c.from&&S.layers.find(x=>x.id===c.from);
    if(l){
      const {up}=faceBasis(l,vp);
      const q=project(vp.m,V.add(l.pos,V.mul(up,l.height*1.04)),vp.w,vp.h);
      if(q){
        const x=clamp(q[0]+vp.x,16,W-16), y=clamp(q[1]+vp.y,16,Hh-16);
        c.el.style.left=x+'px'; c.el.style.top=y+'px';
      }
    }
    return true;
  });
}

            ['fade',null,'Fade','opacity per depth'],['merge',null,'Merge','join chains']]]

const selectedLayerIds=()=>(S.multi&&S.multi.length)?S.multi.slice():(S.sel?[S.sel]:[]);
function firstPicture(){
  const l=S.layers.find(x=>x.id===S.sel);
  if(l&&!l.node&&!isQuad(l)) return l.assetId;
  const own=pictures().find(a=>!a.builtin&&!isSeq(a));
  return own?own.id:(A('tree')||{}).id;
}
// Add a node after the one selected — connected, the way Wire does it. A signal
// added while a node is selected goes straight onto its first live control.
function addNode(type,mode,extra){
  snap(true);
  const sel=nodeById(S.nodeSel);
  const d=NODE_DEFS[type];
  const chain=sel&&defOf(sel).fam!=='grade'&&d.fam!=='grade';
  // after the selected one, in line; otherwise a new row under everything
  // rows go into three lanes side by side, the shortest first, so the graph
  // grows wide rather than into one tall column
  const LW=3*(NW+48)+56, lanes=[0,1,2].map(i=>{
    const xs=80+i*LW, own=S.nodes.filter(m=>m.x>=xs-40&&m.x<xs+LW-40);
    return {x:xs,b:own.length?Math.max(...own.map(m=>m.y+nodeHeight(m)))+48:80};
  });
  const lane=lanes.reduce((a,b)=>b.b<a.b-1?b:a);
  let x=lane.x, y=lane.b;
  if(chain){ x=sel.x+NW+48; y=sel.y;
    if(d.vout){ x=sel.x-NW*0.5; y=sel.y+nodeHeight(sel)+36; } }
  else if(d.fam==='grade'){ [x,y]=freeSpot(null); }
  const n=mkNode(type,x,y,extra);
  if(mode&&d.modes) n.mode=mode;
  if(type==='layers'){ n.ids=selectedLayerIds(); if(!n.ids.length) n.mode='all'; }
  if(type==='image'&&!n.asset) n.asset=firstPicture();
  if(type==='particles'&&!n.kind) n.kind='SNOW';
  if(sel&&sel!==n){
    const ds=defOf(sel);
    if(d.vout&&!ds.vout) connect(n.id,sel.id);
    else if(ds.tout&&d.tin) connect(sel.id,n.id);
  }
  S.nodeSel=n.id; S.nodeMulti=[];
  if(!S.nodesOpen){ S.nodesOpen=true; }
  revealNode(n);
  invalidateChains(); markDirty(); animCheck(); draw(); bump();
  return n;
}

/* ── components: a chain folded into one node ───────────────── */
function packNodes(ids){
  const set=new Set(ids.filter(id=>{ const n=nodeById(id); return n&&defOf(n).fam!=='grade'&&n.type!=='component'; }));
  if(set.size<2){ hint('pick two or more scene nodes'); return null; }
  snap(true);
  const inner=S.nodes.filter(n=>set.has(n.id));
  const cx=inner.reduce((s,n)=>s+n.x,0)/inner.length, cy=inner.reduce((s,n)=>s+n.y,0)/inner.length;
  const c={id:'n'+(uid++),type:'component',x:Math.round(cx),y:Math.round(cy),p:{},
    name:'component '+(S.nodes.filter(n=>n.type==='component').length+1),
    sub:{nodes:inner.map(n=>{ const m=JSON.parse(JSON.stringify(n)); delete m._count; return m; }),links:[]},
    expose:[], x0:Math.round(cx), y0:Math.round(cy)};
  // the useful controls come up front: the first live one of each node inside
  for(const m of c.sub.nodes){
    const ps=paramsOf(m).filter(isLive);
    if(ps.length&&c.expose.length<6){ c.expose.push({node:m.id,param:ps[0][0]}); c.p[m.id+'.'+ps[0][0]]=m.p[ps[0][0]]; }
  }
  const keep=[]; let dropped=0;
  for(const l of S.links){
    const a=set.has(l.from), b=set.has(l.to);
    if(a&&b){ c.sub.links.push(Object.assign({},l)); continue; }
    if(!a&&!b){ keep.push(l); continue; }
    if(b){ // from outside into the component
      if(portOfLink(l)==='main') keep.push({from:l.from,to:c.id});
      else { const pk=String(l.port).slice(2);
        if(!c.expose.some(e=>e.node===l.to&&e.param===pk)){
          c.expose.push({node:l.to,param:pk}); c.p[l.to+'.'+pk]=nodeById(l.to).p[pk]; }
        keep.push(Object.assign({},l,{to:c.id,port:'p:'+l.to+'.'+pk})); }
    } else { // from inside out
      if(portOfLink(l)==='main') keep.push({from:c.id,to:l.to}); else dropped++;
    }
  }
  // dedupe what joins the component to the rest
  const seen=new Set();
  S.links=keep.filter(l=>{ const k=l.from+'>'+l.to+'>'+(l.port||''); if(seen.has(k)) return false; seen.add(k); return true; });
  S.nodes=S.nodes.filter(n=>!set.has(n.id)); S.nodes.push(c);
  S.nodeSel=c.id; S.nodeMulti=[];
  hint(dropped?('packed — '+dropped+' signal wire leaving it was dropped'):'packed into one node');
  invalidateChains(); markDirty(); draw(); bump();
  return c;
}
function unpackNode(c){
  if(!c||c.type!=='component') return;
  snap(true);
  const dx=c.x-(c.x0||c.x), dy=c.y-(c.y0||c.y);
  const inner=(c.sub.nodes||[]).map(m=>{ const n=JSON.parse(JSON.stringify(m)); n.x+=dx; n.y+=dy; return n; });
  // the values set on the component go back into the nodes they came from
  for(const e of c.expose||[]){ const n=inner.find(m=>m.id===e.node); const v=c.p[e.node+'.'+e.param];
    if(n&&v!==undefined) n.p[e.param]=v; }
  const fedInside=new Set(c.sub.links.filter(l=>portOfLink(l)==='main').map(l=>l.to));
  const feeds=new Set(c.sub.links.filter(l=>portOfLink(l)==='main').map(l=>l.from));
  const entry=inner.filter(m=>defOf(m).tin&&!fedInside.has(m.id)).map(m=>m.id);
  const exit=inner.filter(m=>defOf(m).tout&&!feeds.has(m.id)).map(m=>m.id);
  const links=c.sub.links.map(l=>Object.assign({},l));
  for(const l of S.links){
    if(l.to===c.id){
      if(portOfLink(l)==='main') entry.forEach(t=>links.push({from:l.from,to:t}));
      else { const [nid,pk]=String(l.port).slice(2).split('.'); links.push(Object.assign({},l,{to:nid,port:'p:'+pk})); }
    } else if(l.from===c.id) exit.forEach(f=>links.push({from:f,to:l.to}));
    else links.push(l);
  }
  S.links=links;
  S.nodes=S.nodes.filter(n=>n!==c).concat(inner);
  S.nodeMulti=inner.map(n=>n.id); S.nodeSel=inner[0]?inner[0].id:null;
  invalidateChains(); markDirty(); draw(); bump();
}

  if(inPaint()){
    ptrs.delete(e.pointerId);
    if(nav&&nav.mode==='pview'&&ptrs.size<2) nav=null;
    if(drag&&drag.brush){ strokeEnd(); drag=null; bump(); }
    return;
  }
  if(drag&&drag.ykb){
    ykbEnd(); drag=null; ptrs.delete(e.pointerId); draw(); bump(); return;
  }
  if(drag&&drag.corner!==undefined){
    drag=null; cornerSnap=null; ptrs.delete(e.pointerId); draw(); bump(); return;
  }
  if(drag&&drag.path){
    drag=null; ptrs.delete(e.pointerId);
    if(S.path&&S.path.length>2) S.path=simplifyPath(S.path,S.pathTol||1.2);
    setTool('select');                       // one sweep, then back to the arrow
    hint(S.path&&S.path.length>1?(S.path.length+' points'):'too short');
    if(!S.path||S.path.length<2) S.path=null;
    draw(); bump(); return;
  }
  if(drag&&drag.ink){
    drag=null; ptrs.delete(e.pointerId); S.ink.cur=null;
    if(S.ink.once!==false){ inkToCard(); setTool('select'); }
    draw(); bump(); return;
  }
  if(drag&&drag.rect){
    const r=S.drawRect; S.drawRect=null; drag=null; ptrs.delete(e.pointerId);
    const l=r&&surfaceFromRect(r[0],r[1],r[2],r[3],S.drawAsset);
    if(!l) hint('too small');
    draw(); bump(); return;
  }
  ptrs.delete(e.pointerId);
  if(nav&&nav.pid===e.pointerId&&!nav.moved&&ptrs.size===0&&S.sel&&!S.repeat){
    const src=S.layers.find(x=>x.id===S.sel);
    if(S.inGroup&&!src){
      const g=findGroup(S.inGroup);
      S.inGroup=g&&g.parent?g.parent:null;
      hint(S.inGroup?('back to '+(findGroup(S.inGroup)||{}).name):'out');
      bump(); draw(); return;
    }
    if(S.gizMode==='copy'&&src&&!inPaint()){
      // Tap to place. The copy lands where the ray meets a real surface — the
      // same surface the sun is casting shadows onto, not the y=0 plane.
      const vp=vpAt(e.clientX)||viewports()[0];
      const p=surfaceAt(e.clientX,e.clientY,vp);
      if(p){
        snap(true);

        dropToSurface(c);

    }

  if(drag&&drag.band){
    const hit=bandPick(S.band);
    const base=drag.add?(S.multi||[]).slice():[];
    S.multi=[...new Set(base.concat(hit))];
    S.sel=S.multi.length?S.multi[S.multi.length-1]:null;
    S.band=null; S.bandHit=null; drag=null; ptrs.delete(e.pointerId);
    hint(S.multi.length?(S.multi.length+' selected'):'none');
    markDirty(); draw(); bump(); return;
  }
  if(drag&&drag.shiftPick&&drag.origin){   // held still — it joins the selection
    toggleMulti(drag.origin);
    hint(S.multi.length?(S.multi.length+' selected'):'none');
    drag=null; ptrs.delete(e.pointerId); draw(); bump(); return;
  }
  if(drag&&drag.paint) scatterEnd();   // one stroke becomes one group
  S.heldB=null;                       // the schematic is free to refit again
  const mine=drag&&(drag.pid===undefined||drag.pid===e.pointerId);
  if(mine){
    if(drag.dup&&drag.origin&&drag.l!==drag.origin){
      const o=drag.origin.pos,c=drag.l.pos;
      if(Math.hypot(c[0]-o[0],c[1]-o[1],c[2]-o[2])>0.02)
        beginRepeat(drag.origin,drag.l,[e.clientX,e.clientY]);

    drag=null;
  }
  if(armed&&armed.pid===e.pointerId) armed=null;
  if(ptrs.size<2&&nav&&nav.mode==='pinch') nav=null;
  if(ptrs.size===0){ nav=null; drag=null; armed=null; }
}

const dropEl=document.getElementById('drop');

window.addEventListener('drop',guard(e=>{
  e.preventDefault(); dropEl.classList.remove('on');
  const vp=vpAt(e.clientX);
  const p=surfaceAt(e.clientX,e.clientY,vp)||[0,0,S.cam.tgt[2]];
  const tag=e.dataTransfer.getData('text/plain');
  if(tag){
    const a=S.assets.get(tag)||A(tag);
    if(a) addLayer(a.id,[p[0],a.kind==='fog'?4:(a.kind==='glow'?3:p[1]),p[2]]);
    draw(); bump(); return;
  }
  // Files dropped onto the view land where they were dropped, at the size they
  // would have been drawn — the same reader as the library, so an iCloud
  // placeholder or a PDF says so rather than failing silently.
  (async()=>{
    const files=[...(e.dataTransfer.files||[])];
    if(!files.length) return;
    // A pile of numbered frames dropped together is a sequence, not forty
    // pictures — the names say so, and the importer reads them.
    const groups=groupByName(files);
    const anySeq=[...groups.values()].some(g=>g.length>1);
    if(anySeq){
      hint('reading '+files.length+' files…');
      const {made,bad}=await importFiles(files);
      let n=0;
      for(const m of made){
        const l=addLayer(m.asset.id,[0,0,0],
          {height:DEFAULT_H[m.asset.kind]||3});
        if(m.seq) l.anim=newAnim();
        const vp=vpAt(e.clientX)||viewports()[0];
        const hit=surfaceAt(e.clientX+n*18,e.clientY,vp)||
          rayPlane(e.clientX+n*18,e.clientY,vp,0);
        if(hit) l.pos=[hit[0],hit[1],hit[2]];
        l.face='fixed';
        l.yaw=Math.atan2(-vp.b.right[2],vp.b.right[0]);
        S.sel=l.id; n++;
      }
      if(bad.length) showErr('Skipped:\n'+bad.join('\n'));
      hint(made.map(m=>m.seq?(m.asset.name+' · '+m.n+' fr'):m.asset.name).join('  ·  '));
      animCheck(); markDirty(); draw(); bump();
      return;
    }
    const bad=[]; let n=0;
    for(const f of files){
      try{
        const img=await loadImageFile(f);
        placeImage(img,f.name.replace(/\.[^.]+$/,''),e.clientX+n*18,e.clientY+n*18);
        n++;
      }catch(err){ bad.push(f.name+' — '+err.message); }
    }
    if(n) hint(n+' placed');
    if(bad.length) showErr('Not imported:\n'+bad.join('\n'));

}));

/* ══ HISTORY ══════════════════════════════════════════════
   Undo for the document. Painted pixels keep their own stroke
   undo — a plate is a different medium and copying it into this
   stack would cost megabytes a stroke.
──────────────────────────────────────────────────────────── */
// Groups and recipes travel with the layers they describe. Leaving them out meant
// an undo brought layers back while their group or array stayed changed.
const HKEYS=['layers','sel','shots','sun','env','ambient','ambWarm','fog','ptype','pAmt',
  'pSize','pWind','exposure','contrast','saturation','curve','levels','duo','invert',
  'lutName','nodes','links','aspect','over','groups','recipes','emit'];
let past=[], future=[], snapT=0;
function snapshot(){
  const o={}; for(const k of HKEYS) o[k]=S[k];
  return JSON.stringify(o);
}
// Call before a change, not after. Repeated calls inside one gesture collapse.
function snap(force){
  const now=performance.now();
  if(!force&&now-snapT<250) return;
  snapT=now;
  past.push(snapshot()); if(past.length>40) past.shift();
  future.length=0;
}
function applyState(str){
  const o=JSON.parse(str);
  for(const k of HKEYS) if(o[k]!==undefined) S[k]=o[k];
  if(S.inGroup&&!findGroup(S.inGroup)) S.inGroup=null;
  animCheck&&animCheck();
  invalidateChains&&invalidateChains();
  invalidateLut&&invalidateLut();
  markDirty(); draw(); bump();
}
function undo(){
  if(inPaint()&&hasStrokeUndo()){ paintUndo(); return true; }
  if(WS[S.ws]==='YKB'&&ykbHasUndo()){ ykbUndo(); return true; }
  if(!past.length) return false;
  future.push(snapshot());
  applyState(past.pop());
  return true;
}
function redo(){
  if(!future.length) return false;
  past.push(snapshot());
  applyState(future.pop());
  return true;
}
const canUndo=()=>past.length>0||(inPaint()&&hasStrokeUndo())||
  (WS[S.ws]==='YKB'&&ykbHasUndo());
const canRedo=()=>future.length>0;
/* ══ STORE — the document survives the app closing ═════════
   Two halves, because they age differently. The document is
   small JSON and is rewritten constantly. The imported images
   are large and almost never change, so they are written once
   and kept by id. IndexedDB holds both: localStorage would
   choke on a single photograph.

   A restore point is kept alongside the live save — the state
   as it was when this session began — so an autosave writing
   over yesterday's work is recoverable rather than final.
──────────────────────────────────────────────────────────── */
const DB_NAME='sc3ne', DB_VER=1;
let dbP=null;
function db(){
  if(dbP) return dbP;
  dbP=new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=()=>{
      const d=r.result;
      if(!d.objectStoreNames.contains('doc')) d.createObjectStore('doc');
      if(!d.objectStoreNames.contains('img')) d.createObjectStore('img');
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
  return dbP;
}
async function idbPut(store,key,val){
  const d=await db();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,'readwrite');
    t.objectStore(store).put(val,key);
    t.oncomplete=()=>res(true); t.onerror=()=>rej(t.error);
  });
}
async function idbGet(store,key){
  const d=await db();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,'readonly');
    const q=t.objectStore(store).get(key);
    q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
  });
}
async function idbKeys(store){
  const d=await db();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,'readonly');
    const q=t.objectStore(store).getAllKeys();
    q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error);
  });
}

/* ── what a document is ──────────────────────────────────── */
const DOC_KEYS=['layers','groups','recipes','shots','sel','sun','env','ambient','ambWarm','fog',
  'emit','exposure','contrast','saturation','curve','levels','duo','invert','lutName',
  'nodes','links','nodeRun','nview','aspect','over','cam','scatter','arr','rnd','pathArr','path','pathOnGround',
  'ykb','web','game'];
function docSnapshot(){
  const o={v:DOC_VERSION,at:Date.now()};
  for(const k of DOC_KEYS) o[k]=S[k];
  // assets: builtins are regenerated, imports are kept by id in the image store
  o.assets=[...S.assets.values()].map(a=>({id:a.id,name:a.name,kind:a.kind,
    builtin:!!a.builtin,group:a.group,aspect:a.aspect,srcW:a.srcW,srcH:a.srcH,
    frames:isSeq(a)?a.frames.length:0,fps:a.fps||0}));
  return o;
}
const canvasBlob=c=>new Promise(r=>c.toBlob(r,'image/png'));
// A picture is written once and kept by id. Two exceptions: a sequence writes
// every frame (it used to write only the first, so a walk came back from a
// restart as a still), and a control channel is written again whenever it has
// been painted since.
async function writeImages(){
  const have=new Set(await idbKeys('img'));
  const put=async(key,src)=>{
    const c=cnv(src.width,src.height);
    c.getContext('2d').drawImage(src,0,0);
    await idbPut('img',key,await canvasBlob(c));
  };
  for(const a of S.assets.values()){
    if(a.builtin) continue;
    if(isSeq(a)){
      for(let i=0;i<a.frames.length;i++){
        const key=i?a.id+'#'+i:a.id;
        if(!have.has(key)) await put(key,a.frames[i]);
      }
      continue;
    }
    if(have.has(a.id)&&!a.repaint) continue;
    const src=a.levels?a.levels[0]:a.src;
    if(!src) continue;
    a.repaint=false;
    await put(a.id,src);
  }
}
async function saveDoc(){
  try{
    await idbPut('doc','live',docSnapshot());
    await writeImages();
    return true;
  }catch(err){ return false; }
}
// The session's starting state, kept once, so an autosave can be undone.
async function keepRestorePoint(){
  try{
    const live=await idbGet('doc','live');
    if(live) await idbPut('doc','restore',live);
  }catch(err){}
}
async function loadDoc(key){
  const o=await idbGet('doc',key||'live');
  if(!o) return null;
  const blobs={}, frames={};
  for(const a of o.assets||[]) if(!a.builtin){
    const b=await idbGet('img',a.id); if(b) blobs[a.id]=b;
    if(a.frames>1){
      const list=[b];
      for(let i=1;i<a.frames;i++) list.push(await idbGet('img',a.id+'#'+i));
      if(list.every(Boolean)) frames[a.id]=list;
    }
  }
  return {doc:o,blobs,frames};
}
function blobToImage(b){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(b), im=new Image();
    im.onload=()=>{ URL.revokeObjectURL(u); res(im); };
    im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('image')); };
    im.src=u;
  });
}
// Every stage from here adds fields. A document is read through this, so an
// older one arrives with the defaults the newer code expects rather than with
// holes in it. Keyed by version, additive, and never destructive.
const DOC_VERSION=6;
function migrateDoc(o){
  if(!o) return o;
  const from=o.v||1;
  if(from<2){
    for(const l of o.layers||[]){
      if(l.solid===undefined) l.solid=false;
      if(l.uv===undefined) l.uv=null;
      if(l.hidden===undefined) l.hidden=false;
    }
    for(const s of o.shots||[]){
      if(s.move===undefined) s.move=(o.play&&o.play.move)||3;
      if(s.hold===undefined) s.hold=(o.play&&o.play.hold)||0.8;
      if(s.title===undefined) s.title='';
      if(s.sub===undefined) s.sub='';
      if(s.hidden===undefined) s.hidden=[];
    }
    if(!o.groups) o.groups=[];
  }
  if(from<3){
    if(!o.recipes) o.recipes=[];      // arrays used to be events, not things
  }
  if(from<4){
    // A layer may now carry a control channel (YKB). Older layers have none,
    // which reads as none — nothing to fill in, but the line belongs here so
    // the next field has somewhere to go.
    for(const l of o.layers||[]) if(l.ykb===undefined) l.ykb=null;
  }
  if(from<5){
    // a view may carry a page panel (WEB room); older views have none
    for(const s of o.shots||[]) if(s.page===undefined) s.page=null;
    // and a layer may speak, or be a zone (GAME room)
    for(const l of o.layers||[]) if(l.game===undefined) l.game=null;
  }
  if(from<6){
    // the graph grew scene nodes (build 106). A layer may now be made by a node,
    // and a node may be bypassed or have a mode; old ones are neither.
    for(const l of o.layers||[]) if(l.node===undefined) l.node=null;
    for(const n of o.nodes||[]){ if(n.bypass===undefined) n.bypass=false; if(!n.p) n.p={}; }
    for(const l of o.links||[]) if(l.port===undefined) delete l.port;
  }
  o.v=DOC_VERSION;
  return o;
}
// Everything new gets an id from one counter. A document read back from storage
// or a file carries ids of its own, and the counter has to start above them —
// otherwise the next import could take an id already in use and overwrite a
// picture the scene depends on.
function reserveIds(o){
  const part={};
  for(const k of ['layers','assets','groups','shots','recipes','nodes','links','emit'])
    part[k]=o[k];
  const re=/"[a-z]{1,2}(\d{1,9})"/g;
  const txt=JSON.stringify(part);
  let m, top=0;
  while((m=re.exec(txt))) top=Math.max(top,parseInt(m[1],10));
  if(top>=uid) uid=top+1;
}
// A sequence coming back: every frame exactly as it was stored, without the
// import's thinning or trimming being applied a second time.
function sequenceFrom(imgs,name,group,fps){
  const frames=imgs.map(im=>frameCanvas(im,Math.max(im.width,im.height)));
  const a=addAsset(name||'sequence',frames[0],'sequence',false,group||'Sequences');
  a.frames=frames; a.fps=fps||24;
  a.texes=new Array(frames.length).fill(null);
  return a;
}
async function restoreDoc(key){
  const got=await loadDoc(key); if(!got) return false;
  const {doc,blobs,frames}=got;
  migrateDoc(doc);
  reserveIds(doc);
  for(const a of doc.assets||[]){
    if(a.builtin||S.assets.has(a.id)) continue;
    if(frames&&frames[a.id]){
      try{
        const imgs=[];
        for(const b of frames[a.id]) imgs.push(await blobToImage(b));
        const made=sequenceFrom(imgs,a.name,a.group,a.fps);
        S.assets.delete(made.id); made.id=a.id; S.assets.set(a.id,made);
        continue;
      }catch(err){ /* fall back to the still below */ }
    }
    const b=blobs[a.id]; if(!b) continue;
    try{
      const img=await blobToImage(b);
      const made=addAsset(a.name,img,a.kind,false,a.group||'Imported');
      // keep the id the layers refer to
      S.assets.delete(made.id); made.id=a.id; S.assets.set(a.id,made);
    }catch(err){}
  }
  for(const k of DOC_KEYS) if(doc[k]!==undefined) S[k]=doc[k];
  // layers pointing at assets that never came back would draw nothing
  S.layers=(S.layers||[]).filter(l=>S.assets.has(l.assetId));
  S.multi=[]; S.inGroup=null; S.pathRun=null;
  ykbNormalise&&ykbNormalise(); webNormalise(); gameNormalise();
  animCheck();
  invalidateChains&&invalidateChains();
  invalidateLut&&invalidateLut();
  markDirty(); draw(); bump();
  return true;
}
/* ── leaving the app ──────────────────────────────────────
   A scene file carries the document AND the pictures, because
   the thing it is for — a presentation on someone else's page —
   has no access to this machine's image store. Builtins are
   still regenerated, so only what you imported is written.
──────────────────────────────────────────────────────────── */
// Two shapes of the same file. CARRIED holds every picture inside it, which is
// one file and no server. LINKED names them instead, which keeps the scene small
// enough to stay useful on a web page once sequences arrive.
function sceneFile(linked){
  const o=docSnapshot();
  o.kind='sc3ne-scene';
  if(linked){
    o.imgBase='img/';
    o.imgFiles={}; o.seqFiles={}; o.fps={};
    for(const a of S.assets.values()){
      if(a.builtin) continue;
      // a sequence is named frame by frame — naming only the first is what
      // made a linked scene arrive with its walks standing still
      if(isSeq(a)){
        o.seqFiles[a.id]=a.frames.map((_,i)=>a.id+(i?'-'+i:'')+'.png');
        o.fps[a.id]=a.fps||12;
      } else o.imgFiles[a.id]=a.id+'.png';
    }
    return o;
  }
  o.img={}; o.seq={};
  for(const a of S.assets.values()){
    if(a.builtin) continue;
    if(a.frames&&a.frames.length>1){
      // a sequence writes every frame, which is why the linked form exists
      o.seq[a.id]=a.frames.map(c=>c.toDataURL('image/png'));
      o.fps=o.fps||{}; o.fps[a.id]=a.fps||12;
      continue;
    }
    const src=a.levels?a.levels[0]:null; if(!src) continue;
    const c=cnv(src.width,src.height);
    c.getContext('2d').drawImage(src,0,0);
    o.img[a.id]=c.toDataURL('image/png');
  }
  return o;
}
// The pictures on their own, named as the linked file expects to find them.
async function saveSceneImages(){
  let n=0;
  const one=(src,name)=>new Promise(res=>{
    const c=cnv(src.width,src.height);
    c.getContext('2d').drawImage(src,0,0);
    c.toBlob(b=>{
      const u=URL.createObjectURL(b), el=document.createElement('a');
      el.href=u; el.download=name;
      document.body.appendChild(el); el.click(); el.remove();
      setTimeout(()=>URL.revokeObjectURL(u),4000); n++; res();
    },'image/png');
  });
  for(const a of S.assets.values()){
    if(a.builtin) continue;
    if(isSeq(a)){
      for(let i=0;i<a.frames.length;i++) await one(a.frames[i],a.id+(i?'-'+i:'')+'.png');
      continue;
    }
    const src=a.levels?a.levels[0]:null; if(!src) continue;
    await one(src,a.id+'.png');
  }
  hint(n+' images saved');
}
function saveSceneFile(linked){
  const txt=JSON.stringify(sceneFile(linked));
  const b=new Blob([txt],{type:'application/json'});
