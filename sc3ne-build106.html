    const step=Math.max(1.2,R*2*Math.max(0.05,b.spacing));
    const pts=[];
    for(let t=0;t<=1.0001;t+=0.004){
      pts.push([12+t*(Wp-24), Hp/2+Math.sin(t*Math.PI*2)*Hp*0.24]);
    }
    let acc=0, last=pts[0];
    const isEff=isEffect(b.tip);
    for(const q of pts){
      acc+=Math.hypot(q[0]-last[0],q[1]-last[1]); last=q;
      if(acc<step) continue; acc=0;
      const t2=(q[0]-12)/(Wp-24);
      const force=clamp(Math.sin(t2*Math.PI)*1.15,0.06,1);   // a pen's rise and fall
      const jr=R*rnd(b.jSize)*((1-b.pSize)+b.pSize*force);
      const x=q[0]+(Math.random()*2-1)*R*b.jScatter*2;
      const y=q[1]+(Math.random()*2-1)*R*b.jScatter*2;
      const a=clamp(b.opacity*rnd(b.jOpacity)*((1-b.pFlow)+b.pFlow*force),0,1);
      const col=isEff?[0.6,0.6,0.6]:hsv(b.hue+(Math.random()*2-1)*b.jHue,b.sat,b.val);
      const src=isEff?tipCanvas(b.tip,128):stampFor();
      const tmp=cnv(src.width,src.height), tg=tmp.getContext('2d');
      tg.drawImage(src,0,0); tg.globalCompositeOperation='source-in';
      tg.fillStyle=rgbCss(col); tg.fillRect(0,0,tmp.width,tmp.height);
      g.save(); g.globalAlpha=a*(b.tip==='INK PEN'?1:0.85);
      g.translate(x,y); g.rotate(Math.random()*Math.PI*2*b.jAngle);
      g.drawImage(tmp,-jr,-jr,jr*2,jr*2); g.restore();
    }
    g.globalAlpha=1;
  });
  return h('canvas',{ref,style:{position:'relative',width:Wp+'px',height:Hp+'px',
    display:'block',marginBottom:'16px'}});
}

/* ── colour ──────────────────────────────────────────────── */
// A hue ring on the outside, saturation disc inside, greys on their own ring.
function Wheel(p){
  const ref=React.useRef(null); const SZ=p.size||236;
  React.useEffect(()=>{
    const c=ref.current; if(!c) return;
    const d=window.devicePixelRatio||1; c.width=SZ*d; c.height=SZ*d;
    const g=c.getContext('2d'); g.setTransform(d,0,0,d,0,0);
    g.clearRect(0,0,SZ,SZ);
    const R=SZ/2-2, RING=Math.max(14,SZ*0.10), Ri=R-RING, Rd=Ri-8;
    for(let i=0;i<360;i++){                   // hue ring
      const a0=(i-0.6)*Math.PI/180, a1=(i+0.6)*Math.PI/180;
      g.beginPath(); g.arc(SZ/2,SZ/2,(R+Ri)/2,a0,a1);
      g.strokeStyle=rgbCss(hsv(i/360,1,1)); g.lineWidth=RING; g.stroke();
    }
    const im=g.createImageData(SZ,SZ);        // saturation disc at the chosen hue
    for(let y=0;y<SZ;y++)for(let x=0;x<SZ;x++){
      const dx=x-SZ/2, dy=y-SZ/2, rr=Math.hypot(dx,dy), i=(y*SZ+x)*4;
      if(rr>Rd){ im.data[i+3]=0; continue; }
      const col=hsv(p.hue,clamp(rr/Rd,0,1),p.val);
      im.data[i]=col[0]*255; im.data[i+1]=col[1]*255; im.data[i+2]=col[2]*255;
      im.data[i+3]=255;
    }
    const tmp=cnv(SZ,SZ); tmp.getContext('2d').putImageData(im,0,0);
    g.drawImage(tmp,0,0);
    const ha=p.hue*2*Math.PI;                 // markers
    g.strokeStyle='#F2F2F2'; g.lineWidth=2;
    g.beginPath(); g.arc(SZ/2+Math.cos(ha)*(R+Ri)/2,SZ/2+Math.sin(ha)*(R+Ri)/2,6,0,6.284);
    g.stroke();
    g.lineWidth=1.5;
    g.beginPath(); g.arc(SZ/2+p.sat*Rd,SZ/2,6,0,6.284); g.stroke();
  });
  const pick=e=>{
    const r=ref.current.getBoundingClientRect();
    const dx=e.clientX-r.left-SZ/2, dy=e.clientY-r.top-SZ/2;
    const R=SZ/2-2, RING=Math.max(14,SZ*0.10), Rd=R-RING-8, rr=Math.hypot(dx,dy);
    if(rr>Rd) p.onChange(((Math.atan2(dy,dx)/(2*Math.PI))+1)%1,null);
    else p.onChange(null,clamp(rr/Rd,0,1));
  };
  return h('canvas',{ref,style:{position:'relative',width:SZ+'px',height:SZ+'px',
      display:'block',margin:'0 auto 16px',touchAction:'none'},
    onPointerDown:e=>{e.preventDefault();e.stopPropagation();
      ref.current.setPointerCapture(e.pointerId);ref.current._on=1;pick(e);},
    onPointerMove:e=>{ if(ref.current&&ref.current._on) pick(e); },
    onPointerUp:()=>{ if(ref.current) ref.current._on=0; }});
}
// Greys get their own ring: black at the top, round to white.
function GreyRing(p){
  const ref=React.useRef(null); const SZ=p.size||88;
  React.useEffect(()=>{
    const c=ref.current; if(!c) return;
    const d=window.devicePixelRatio||1; c.width=SZ*d; c.height=SZ*d;
    const g=c.getContext('2d'); g.setTransform(d,0,0,d,0,0); g.clearRect(0,0,SZ,SZ);
    const R=SZ/2-2, RING=Math.max(12,SZ*0.24);
    for(let i=0;i<360;i++){
      const v=i/359, a0=(i-91)*Math.PI/180, a1=(i-89)*Math.PI/180;
      g.beginPath(); g.arc(SZ/2,SZ/2,R-RING/2,a0,a1);
      g.strokeStyle=rgbCss([v,v,v]); g.lineWidth=RING; g.stroke();
    }
    if(p.sat<0.02){
      const a=(p.val*359-90)*Math.PI/180;
      g.strokeStyle='#FF3A1E'; g.lineWidth=2;
      g.beginPath(); g.arc(SZ/2+Math.cos(a)*(R-RING/2),SZ/2+Math.sin(a)*(R-RING/2),5,0,6.284);
      g.stroke();
    }
  });
  const pick=e=>{
    const r=ref.current.getBoundingClientRect();
    const dx=e.clientX-r.left-SZ/2, dy=e.clientY-r.top-SZ/2;
    p.onChange(clamp(((Math.atan2(dy,dx)*180/Math.PI+90)+360)%360/359,0,1));
  };
  return h('canvas',{ref,style:{position:'relative',width:SZ+'px',height:SZ+'px',
      display:'block',touchAction:'none'},
    onPointerDown:e=>{e.preventDefault();e.stopPropagation();
      ref.current.setPointerCapture(e.pointerId);ref.current._on=1;pick(e);},
    onPointerMove:e=>{ if(ref.current&&ref.current._on) pick(e); },
    onPointerUp:()=>{ if(ref.current) ref.current._on=0; }});
}
/* ══ YKB — Yves Klein Brush ════════════════════════════════
   A layer may carry a second picture: its control channel. It is
   never seen as itself. A stroke on it is weight, not colour —
   faint where light, full where solid — and the mapping decides
   what that weight does to the layer: cut it away (MATTE), or
   push it back into the haze (DEPTH). More mappings are the same
   channel read differently, which is why this is one mechanism
   and not one tool per effect.

   The channel is stored as an asset so it saves, travels in a
   scene file and comes back like any picture. Copies of a layer
   share their channel until one is given its own — the same
   bargain as everything else here that repeats.

   Three ways to look at it:
     CONTROL  the blue is the language — painted weight shows as
              blue over the layer, nothing is cut, so you can see
              what you are saying
     RENDER   the blue is data — invisible, only its effect shows
     VISIBLE  the blue is the artwork — it is painted into the
              picture and takes the light and haze with the rest
   CONTROL is a working view: outside this room it reads as RENDER.
──────────────────────────────────────────────────────────── */
const IKB=[0.0,47/255,167/255];                   // International Klein Blue
const IKB_CSS='rgb(0,47,167)';
const YKB_TIPS=['INK PEN','INK BRUSH','CHARCOAL','DRY'];
const YKB_MAPS=[['off','off'],['matte','matte'],['depth','depth']];
const ykbOpts=()=>S.ykb||(S.ykb={view:'control',paint:false,tip:'INK BRUSH',
  size:60,weight:0.85,erase:false,detail:512});
// What the screen shows. CONTROL belongs to this room; anywhere else the channel
// simply does its job.
function ykbView(){
  const v=ykbOpts().view||'control';
  if(v==='control'&&WS[S.ws]!=='YKB') return 'render';
  return v;
}
const ykbViewCode=()=>({render:0,control:1,visible:2})[ykbView()]||0;
function ykbAsset(l){
  const id=l&&l.ykb&&l.ykb.ch;
  const a=id?S.assets.get(id):null;
  return isCtrl(a)?a:null;
}
// The settings a layer carries, made on first use. Making them does not make a
// channel — that waits for the first stroke, so choosing a mapping costs nothing.
function ykbSettings(l){
  if(!l.ykb) l.ykb={on:true,map:'matte',amt:1,inv:false,ch:null};
  return l.ykb;
}
// A channel the shape of the picture it belongs to, at a fixed working size.
// Weight is stored in alpha; the colour is the blue, so the stored file reads
// as what it is if anyone ever opens it.
function ykbEnsure(l){
  const y=ykbSettings(l);
  let a=ykbAsset(l);
  if(a) return a;
  const src=S.assets.get(l.assetId), asp=Math.abs(src?src.aspect:1)||1;
  const D=ykbOpts().detail||512;
  const w=asp>=1?D:Math.max(16,Math.round(D*asp));
  const hh=asp>=1?Math.max(16,Math.round(D/asp)):D;
  const c=cnv(w,hh);
  a=addAsset('channel '+(l.name||''),c,'ykb',false,'Channels');
  a.levels=[c]; a.repaint=true; a.cdirty=true;
  y.ch=a.id;
  return a;
}
// After a load, a channel is a single canvas again — the import made levels of
// it, and painting must go into the one that is saved.
function ykbNormalise(){
  for(const a of S.assets.values()) if(isCtrl(a)){
    a.levels=[a.levels[0]]; a.cdirty=true; a.level=-1;
  }
}
function ykbTex(a){
  if(!a.ctex){ a.ctex=gl.createTexture(); a.cdirty=true; }
  if(a.cdirty){ upload(a.ctex,a.levels[0],true); a.cdirty=false; }
  return a.ctex;
}
// What the renderer needs to know, or null when the layer has no say.
function ykbOf(l){
  const y=l.ykb; if(!y||y.on===false) return null;
  const a=ykbAsset(l); if(!a) return null;
  return {tex:ykbTex(a),map:y.map==='matte'?1:(y.map==='depth'?2:0),
    amt:y.amt===undefined?1:y.amt,inv:!!y.inv};
}
// How much of a point survives the matte, for picking: what has been cut away
// cannot be clicked. In CONTROL nothing is cut, so everything can be.
function ykbCut(l,u,v){
  const y=l.ykb; if(!y||y.on===false||y.map!=='matte') return 1;
  if(ykbView()!=='render') return 1;
  const a=ykbAsset(l); if(!a) return y.inv?0:1;
  const c=a.levels[0];
  const x=clamp(Math.floor(u*c.width),0,c.width-1), yy=clamp(Math.floor(v*c.height),0,c.height-1);
  let w=c.getContext('2d').getImageData(x,yy,1,1).data[3]/255;
  if(y.inv) w=1-w;
  return 1-w*(y.amt===undefined?1:y.amt);
}

/* ── painting on a layer ─────────────────────────────────────
   The stroke is laid where the ray from the pointer meets the
   card's own plane, in the card's own picture space — so a lying
   plane, a leaning card or one turned away all paint where the
   pointer is. Off the edge the plane carries on, so a stroke can
   leave the card and come back without breaking.
──────────────────────────────────────────────────────────── */
const ykbArmed=()=>WS[S.ws]==='YKB'&&!!(S.ykb&&S.ykb.paint)&&!S.nodesOpen;
function ykbUV(l,px,py){
  const vp=vpAt(px)||viewports()[0];
  const a=S.assets.get(l.assetId); if(!a) return null;
  const w=widthOf(l,a), dpt=l.height;
  const {right,up}=faceBasis(l,vp);
  const n=V.norm(V.cross(right,up));
  const ro=vp.b.eye, dir=rayDir(px,py,vp);
  const den=V.dot(n,dir); if(Math.abs(den)<1e-7) return null;
  const t=V.dot(n,V.sub(l.pos,ro))/den; if(t<=0.02) return null;
  const rel=V.sub(V.add(ro,V.mul(dir,t)),l.pos);
  const u=V.dot(rel,right)/w+0.5, v=1-V.dot(rel,up)/Math.max(1e-6,dpt);
  // channel pixels per screen pixel, measured at the depth of the hit
  const mPerPx=2*vp.tan*t/vp.h;
  return {u,v,scr:Math.abs(w)/Math.max(1e-6,mPerPx)};
}
function ykbOver(l,px,py){
  if(!l||l.hidden) return false;
  const q=ykbUV(l,px,py);
  return !!q&&q.u>=0&&q.u<=1&&q.v>=0&&q.v<=1;
}
let ykbHist=null, ykbLast=null, ykbLayer=null;
const ykbTipCache=new Map();
function ykbTip(tip){
  if(ykbTipCache.has(tip)) return ykbTipCache.get(tip);
  const src=tipCanvas(tip,128), c=cnv(src.width,src.height), g=c.getContext('2d');
  g.drawImage(src,0,0);
  g.globalCompositeOperation='source-in'; g.fillStyle=IKB_CSS;
  g.fillRect(0,0,c.width,c.height);
  ykbTipCache.set(tip,c); return c;
}
function ykbBegin(l,s){
  const a=ykbEnsure(l), c=a.levels[0];
  ykbHist={id:a.id,data:c.getContext('2d').getImageData(0,0,c.width,c.height)};
  ykbLast=null; ykbLayer=l;
  lastT=performance.now(); lastSpeed=0;
  ykbAt(s);
}
function ykbAt(s){
  const l=ykbLayer; if(!l) return;
  const a=ykbAsset(l); if(!a) return;
  const q=ykbUV(l,s.x,s.y); if(!q) return;
  const o=ykbOpts(), c=a.levels[0], g=c.getContext('2d');
  const x=q.u*c.width, y=q.v*c.height;
  const sx=c.width/Math.max(1,q.scr);              // channel px per screen px
  const from=ykbLast||[x,y];
  const force=forceOf(s,Math.hypot(x-from[0],y-from[1])/Math.max(1e-6,sx));
  const R=Math.max(0.6,(o.size||60)*0.5*sx*(0.35+0.65*force));
  const step=Math.max(1,R*0.3);
  const d=Math.hypot(x-from[0],y-from[1]);
  const n=ykbLast?Math.max(1,Math.ceil(d/step)):1;
  const tip=ykbTip(o.tip||'INK BRUSH');
  g.save();
  g.globalCompositeOperation=o.erase?'destination-out':'source-over';
  for(let i=1;i<=n;i++){
    const t=i/n, px=from[0]+(x-from[0])*t, py=from[1]+(y-from[1])*t;
    // weight builds up within a stroke the way ink does: a dab per step, each
    // carrying a share of the weight, turned at random so no pattern repeats
    g.globalAlpha=clamp((o.weight===undefined?0.85:o.weight)*(0.4+0.6*force)*
      (o.tip==='INK PEN'?1:0.55),0,1);
    g.setTransform(1,0,0,1,px,py); g.rotate(Math.random()*6.2832);
    g.drawImage(tip,-R,-R,R*2,R*2);
  }
  g.restore();
  ykbLast=[x,y]; a.cdirty=true;
}
function ykbEnd(){
  const a=ykbLayer&&ykbAsset(ykbLayer);
  if(a){ a.repaint=true; markDirty(); }
  ykbLast=null; ykbLayer=null;
}
const ykbHasUndo=()=>!!ykbHist;
function ykbUndo(){
  if(!ykbHist) return;
  const a=S.assets.get(ykbHist.id);
  if(a&&isCtrl(a)){
    a.levels[0].getContext('2d').putImageData(ykbHist.data,0,0);
    a.cdirty=true; a.repaint=true;
  }
  ykbHist=null; markDirty(); draw(); bump();
}
// Whole-channel actions. Each keeps one step of undo, like a stroke.
function ykbWhole(l,how){
  const a=ykbEnsure(l), c=a.levels[0], g=c.getContext('2d');
  ykbHist={id:a.id,data:g.getImageData(0,0,c.width,c.height)};
  g.save(); g.setTransform(1,0,0,1,0,0); g.globalAlpha=1;
  if(how==='fill'){ g.globalCompositeOperation='source-over'; g.fillStyle=IKB_CSS;
    g.fillRect(0,0,c.width,c.height); }
  else if(how==='clear') g.clearRect(0,0,c.width,c.height);
  else if(how==='flip'){                         // weight becomes its absence
    const im=g.getImageData(0,0,c.width,c.height), dd=im.data;
    for(let i=0;i<dd.length;i+=4){ dd[i]=0; dd[i+1]=47; dd[i+2]=167; dd[i+3]=255-dd[i+3]; }
    g.putImageData(im,0,0);
  }
  g.restore();
  a.cdirty=true; a.repaint=true; markDirty(); draw(); bump();
}
// Copies share a channel. This gives one of them a channel of its own, starting
// from what it was showing.
function ykbOwn(l){
  const a=ykbAsset(l); if(!a) return;
  const src=a.levels[0], c=cnv(src.width,src.height);
  c.getContext('2d').drawImage(src,0,0);
  const b=addAsset('channel '+(l.name||''),c,'ykb',false,'Channels');
  b.levels=[c]; b.repaint=true; b.cdirty=true;
  snap(true);
  l.ykb=Object.assign({},l.ykb,{ch:b.id});
  markDirty(); draw(); bump();
}
const ykbSharers=l=>{ const id=l&&l.ykb&&l.ykb.ch;
  return id?S.layers.filter(q=>q.ykb&&q.ykb.ch===id).length:0; };

/* ── the room ───────────────────────────────────────────────── */
function ykbPanel(K,l){
  const o=ykbOpts();
  const set=(k,v)=>{ o[k]=v; draw(); bump(); };
  K.push(h('div',{className:'note',key:'n'},
    'Yves Klein Brush. Normal painting says what a thing looks like; this says '+
    'what it does. A stroke here is weight, not colour — faint where it is light, '+
    'full where it is solid — and the mapping decides what the weight means.'));
  K.push(h('div',{className:'seg',key:'vw'},
    [['control','control'],['render','render'],['visible','visible']].map(([k,lab])=>
      h('button',{key:k,className:(o.view||'control')===k?'on':'',
        onClick:()=>set('view',k)},lab))));
  K.push(h('div',{className:'note',key:'vn'},
    'CONTROL shows the weight as blue and cuts nothing, so you can see what you '+
    'are saying. RENDER hides the blue and shows only what it does. VISIBLE paints '+
    'the blue into the picture — the blue as the artwork. Control is a working '+
    'view: in every other room it reads as render.'));
  if(!l){
    K.push(h('div',{className:'note',key:'ns',style:{marginTop:'16px'}},
      'Select the layer whose channel you want to paint — tap it in the view, '+
      'or pick it from the layer list below.'));
  } else {
    const y=l.ykb;
    const setY=(k,v)=>{ snap(); ykbSettings(l)[k]=v; markDirty(); draw(); bump(); };
    K.push(h('div',{className:'row',key:'ly'},h('span',{className:'k'},'Layer'),
      h('span',{className:'v'},l.name+(ykbAsset(l)?'  ·  has a channel':''))));
    K.push(h('button',{key:'pt',className:'btn'+(o.paint?' on':''),
      onClick:()=>{ o.paint=!o.paint; if(o.paint&&!l.ykb) ykbSettings(l);
        if(o.paint&&S.tool!=='select') setTool('select'); draw(); bump(); }},
      o.paint?'Painting the channel — stop':'Paint the channel'));
    const now=(!y||y.on===false)?'off':(y.map||'matte');
    K.push(h('div',{className:'seg',key:'mp'},
      YKB_MAPS.map(([k,lab])=>h('button',{key:k,className:now===k?'on':'',
        onClick:()=>{ if(k==='off') setY('on',false);
          else { ykbSettings(l).on=true; setY('map',k); } }},lab))));
    K.push(h(Slider,{key:'am',label:'Amount',min:0,max:1,step:0.01,
      value:y&&y.amt!==undefined?y.amt:1,onChange:v=>setY('amt',v),
      fmt:v=>Math.round(v*100)+'%'}));
    K.push(h('div',{className:'row',key:'iv'},
      h('span',{className:'k'},'Keep only what is painted'),
      h('input',{type:'checkbox',checked:!!(y&&y.inv),
        onChange:e=>setY('inv',e.target.checked)})));
    K.push(h('div',{className:'note',key:'mn'},
      'MATTE cuts the layer away where the weight is — or, with KEEP ONLY WHAT IS '+
      'PAINTED, keeps nothing else. DEPTH sends what is painted back into the haze '+
      'and further away in the depth map, so one card can recede across its own '+
      'width. Masks, shadows and exports all obey the matte.'));
    K.push(h(List,{key:'br',label:'Brush',count:(o.tip||'').toLowerCase(),open:true},[
      h('div',{className:'seg',key:'tp',style:{flexWrap:'wrap'}},
        YKB_TIPS.map(t=>h('button',{key:t,className:o.tip===t?'on':'',
          onClick:()=>set('tip',t)},t))),
      h(Slider,{key:'sz',label:'Size',min:2,max:400,step:1,value:o.size||60,
        onChange:v=>set('size',v),fmt:v=>Math.round(v)+' px'}),
      h(Slider,{key:'wt',label:'Weight',min:0.02,max:1,step:0.01,
        value:o.weight===undefined?0.85:o.weight,
        onChange:v=>set('weight',v),fmt:v=>Math.round(v*100)+'%'}),
      h('div',{className:'row',key:'er'},h('span',{className:'k'},'Erase'),
        h('input',{type:'checkbox',checked:!!o.erase,
          onChange:e=>set('erase',e.target.checked)})),
      h('div',{className:'note',key:'bn'},
        'Size is on the screen, so a brush is the same width near and far. With a '+
        'pen, pressure sets size and weight and fingers only move the view; '+
        'without one, speed stands in for pressure.')]));
    K.push(h('div',{className:'seg',key:'wh'},[
      h('button',{key:'f',onClick:()=>ykbWhole(l,'fill')},'fill'),
      h('button',{key:'c',onClick:()=>ykbWhole(l,'clear')},'clear'),
      h('button',{key:'i',onClick:()=>ykbWhole(l,'flip')},'invert')]));
    K.push(h('button',{key:'un',className:'btn',onClick:()=>{ykbUndo();}},
      'Undo the last stroke'));
    const n=ykbSharers(l);
    if(n>1){
      K.push(h('button',{key:'own',className:'btn',onClick:()=>{ykbOwn(l);hint('its own now');}},
        'Shared by '+n+' copies — give this one its own'));
      K.push(h('div',{className:'note',key:'on'},
        'Copies share a channel, so a matte painted once cuts every copy of it — '+
        'a crowd with the same holes. Give one its own to paint it apart.'));
    }
  }

/* ══ HDRI — the sky as a photograph ════════════════════════
   Not image-based lighting in the full sense: every card faces
   the camera, so there are no normals to integrate against. What
   a panorama gives here is the two things that actually decide
   how a scene sits — the colour of the light coming back from
   the sky, and where the brightest part of it is. Both are read
   once, from a tiny copy of the picture.
──────────────────────────────────────────────────────────── */
const HDRI={img:null,tex:null,name:'',small:null,avg:[1,1,1],hor:[1,1,1],
  sunAz:1,sunEl:0.3,sunCol:[1,1,1],on:false,spin:0,bright:1,
  wrap:true,span:1.4,rise:0.9,blur:0,infl:1};
// How far the photograph decides the haze and the ambient, against the chosen
// environment. One means the picture alone, as before; less lets a preset keep
// its colour under a borrowed sky.
const hdriInfl=()=>(HDRI.on&&HDRI.img)?clamp(HDRI.infl===undefined?1:HDRI.infl,0,1):0;
function hdriFog(e){
  const k=hdriInfl(); if(!k) return e.fog;
  return [0,1,2].map(i=>e.fog[i]+(HDRI.hor[i]-e.fog[i])*k);
}
function readHDRI(img){
  const w=64,hh=32,c=cnv(w,hh),g=c.getContext('2d');
  g.drawImage(img,0,0,w,hh);
  const d=g.getImageData(0,0,w,hh).data;
  let sr=0,sg=0,sb=0,n=0, hr=0,hg=0,hb=0,hn=0;
  let best=-1,bx=0,by=0;
  for(let y=0;y<hh;y++) for(let x=0;x<w;x++){
    const i=(y*w+x)*4, r=d[i]/255,gg=d[i+1]/255,b=d[i+2]/255;
    sr+=r; sg+=gg; sb+=b; n++;
    if(y>hh*0.42&&y<hh*0.58){ hr+=r; hg+=gg; hb+=b; hn++; }   // the horizon band
    const lum=r*0.3+gg*0.59+b*0.11;
    if(y<hh*0.62&&lum>best){ best=lum; bx=x; by=y; }          // the sun, if there is one
  }
  HDRI.avg=[sr/n,sg/n,sb/n];
  HDRI.hor=hn?[hr/hn,hg/hn,hb/hn]:HDRI.avg.slice();
  // equirectangular: x is the turn, y is the height
  HDRI.sunAz=((bx+0.5)/w)*Math.PI*2;
  HDRI.sunEl=clamp((0.5-(by+0.5)/hh)*Math.PI,0.03,1.5);
  const i=((by|0)*w+(bx|0))*4;
  HDRI.sunCol=[d[i]/255,d[i+1]/255,d[i+2]/255];
  HDRI.small=c;
}
function setHDRI(img,name){
  HDRI.img=img; HDRI.name=name||'panorama';
  // 2:1 is the panorama's own shape. Anything else is a picture, and a picture
  // stands on the horizon.
  HDRI.wrap=Math.abs((img.width/img.height)-2)<0.35;
  readHDRI(img);
  if(!HDRI.tex) HDRI.tex=gl.createTexture();
  upload(HDRI.tex,img,true);
  HDRI.on=true; envDirty=true; markDirty(); draw(); bump();
}
// Where the camera is looking, as a rect of the panorama. Linear rather than
// spherical, which is wrong by a little and right by enough for a backdrop.
function hdriRect(vp){
  const az=(Math.atan2(vp.b.fwd[0],vp.b.fwd[2])+HDRI.spin);
  const el=Math.asin(clamp(vp.b.fwd[1],-1,1));
  const fovY=2*Math.atan(vp.tan), fovX=fovY*(vp.w/vp.h);
  if(HDRI.wrap===false){
    // A backdrop rather than a panorama: the picture covers a slice of the turn,
    // and its BOTTOM EDGE sits on the horizon — so an ordinary photograph of a
    // skyline stands on the ground instead of floating at an arbitrary height.
    const span=Math.max(0.35,HDRI.span||1.4);        // how much turn it covers
    const rise=Math.max(0.15,HDRI.rise||0.9);        // how much sky it fills
    const u0=(az/span)+0.5-fovX/(2*span);
    const vBottom=1+el/rise;                          // el = 0 → the picture's foot
    return [u0, vBottom-fovY/rise, fovX/span, fovY/rise];
  }
  const u=((az/(Math.PI*2))%1+1)%1, v=0.5-el/Math.PI;
  return [u-fovX/(Math.PI*4), v-fovY/(Math.PI*2)*0.5,
          fovX/(Math.PI*2), fovY/Math.PI];
}
// The sun the picture implies. One press, and the scene agrees with its sky.
function lightFromHDRI(){
  if(!HDRI.img){ hint('load a panorama first'); return; }
  S.sun.az=HDRI.sunAz; S.sun.el=HDRI.sunEl;
  const c=HDRI.sunCol, warm=clamp((c[0]-c[2])*1.6+0.5,0,1);
  S.sun.warm=warm;
  S.sun.int=clamp(0.25+(c[0]*0.3+c[1]*0.59+c[2]*0.11)*0.9,0.05,1.4);
  S.ambient=clamp(0.3+(HDRI.avg[0]+HDRI.avg[1]+HDRI.avg[2])/3*0.9,0.1,1.4);
  markDirty(); draw(); bump(); hint('light taken from the sky');
}
// Ambient is the light the sky throws back. Its colour is the environment's,
// pushed warm or cool by hand — that push is what you actually see on a surface.
function ambient(){
  const e=ENV[S.env],sc=sunColor(),k=S.ambient*0.9+S.sun.int*0.5;
  const w=(S.ambWarm===undefined?0.5:S.ambWarm)*2-1;          // -1 cool … +1 warm
  const cast=w>=0?[1+w*0.45,1+w*0.06,1-w*0.42]:[1+w*0.40,1+w*0.05,1-w*0.55];
  const env=[e.amb[0]*cast[0]*(0.35+k*0.75*(0.6+0.4*sc[0])),
             e.amb[1]*cast[1]*(0.35+k*0.75*(0.6+0.4*sc[1])),
             e.amb[2]*cast[2]*(0.35+k*0.75*(0.6+0.4*sc[2]))];
  const ki=hdriInfl(); if(!ki) return env;
  // the sky's own colour, at the strength the ambient control asks for
  const a=HDRI.avg;
  const c2=w>=0?[1+w*0.35,1+w*0.05,1-w*0.32]:[1+w*0.30,1+w*0.04,1-w*0.45];
  const g=0.55+k*0.85;
  const sky=[(0.25+a[0]*1.5)*c2[0]*g,(0.25+a[1]*1.5)*c2[1]*g,(0.25+a[2]*1.5)*c2[2]*g];
  return [0,1,2].map(i=>env[i]+(sky[i]-env[i])*ki);
}

/* ══ FIELD — particles as sprites ══════════════════════════
   A kind is a sprite atlas plus a motion, not a branch in the
   shader. Everything that falls, drifts, rises or hangs is the
   same instanced draw with a different picture — which is why
   leaves, letters, daisies and dollars cost no new code, and why
   several can run at once.
──────────────────────────────────────────────────────────── */
const PVS=`#version 300 es
in vec2 p; out vec2 vUV; out float vFade; out float vSpin;
uniform mat4 uVP; uniform vec3 uEye,uRight,uUp;
uniform float uTime,uSpread,uFall,uSize,uWind,uMotion,uSpin,uStretch;
uniform vec2 uAtlas;
float hash(float n){ return fract(sin(n)*43758.5453123); }
void main(){
  float i=float(gl_InstanceID);
  float hx=hash(i*1.13),hy=hash(i*2.71),hz=hash(i*3.37),hs=hash(i*5.11),ha=hash(i*7.13);
  float H=uSpread;
  float fall=uFall*(0.55+hs*0.9);
  float y=mod(hy*H + uTime*fall, H);
  float drift=(uMotion>1.5?1.6:0.6)*uWind;
  float yy;
  if(uMotion>2.5) yy=uEye.y-H*0.15+hy*H*0.5                      // 3 hang, barely moving
       + sin(uTime*0.5+hx*19.0)*0.6*max(0.2,uWind);
  else if(uMotion>1.5) yy=uEye.y-H*0.2+y*0.35;                   // 2 rise
  else yy=uEye.y+H*0.5-y;                                        // 0,1 fall
  vec3 wp=vec3(
    uEye.x+(hx-0.5)*uSpread + sin(uTime*0.6+hx*31.0)*drift*3.0 + uTime*uWind*2.0,
    yy,
    uEye.z+(hz-0.5)*uSpread + cos(uTime*0.5+hz*27.0)*drift*3.0);
  wp.x=uEye.x+mod(wp.x-uEye.x+uSpread*0.5,uSpread)-uSpread*0.5;
  float s=uSize*(0.45+hs*1.3);
  vec3 rt=uRight, up=uUp;
  if(uMotion<0.5){ up=vec3(0.0,1.0,0.0); }        // a streak keeps its own vertical
  vec2 sz=vec2(s*(uStretch<1.0?uStretch:1.0), s*(uStretch>1.0?uStretch:1.0));
  float ang=uSpin*(ha*6.283+uTime*(0.4+hs*1.6)*sign(ha-0.5));
  float ca=cos(ang), sa=sin(ang);
  vec2 q=vec2((p.x-0.5)*sz.x,(p.y-0.5)*sz.y);
  vec2 r2=vec2(q.x*ca-q.y*sa, q.x*sa+q.y*ca);
  vec3 w=wp+rt*r2.x+up*r2.y;
  float cell=floor(ha*uAtlas.x*uAtlas.y);
  vec2 cxy=vec2(mod(cell,uAtlas.x),floor(cell/uAtlas.x));
  vUV=(p+cxy)/uAtlas;
  vFade=1.0-smoothstep(uSpread*0.30,uSpread*0.55,length(wp-uEye));
  gl_Position=uVP*vec4(w,1.0); }`;
const PFS=`#version 300 es
precision mediump float;
in vec2 vUV; in float vFade; out vec4 o;
uniform sampler2D uTex; uniform vec3 uCol; uniform float uAlpha,uOwnCol;
void main(){ vec4 t=texture(uTex,vUV);
  float a=t.a*uAlpha*vFade; if(a<0.004) discard;
  o=vec4(mix(uCol,t.rgb,uOwnCol),a); }`;

/* ── the kinds ────────────────────────────────────────────
   motion 0 streak · 1 fall · 2 rise · 3 hang
   Sprites are drawn white; the environment supplies the colour,
   unless the kind brings its own.
──────────────────────────────────────────────────────────── */
const GLYPHS='ABCDEFGH';
function spriteSheet(cells,px,paint){
  const n=Math.ceil(Math.sqrt(cells)), c=cnv(n*px,n*px), g=c.getContext('2d');
  for(let i=0;i<cells;i++){
    g.save(); g.translate((i%n)*px,Math.floor(i/n)*px); paint(g,px,i); g.restore();
  }
  return {canvas:c,atlas:[n,n]};
}

// SWARM borrows whatever the scatter brush is set to — up to seven of them,
// shrunk to a tenth so they read as flecks rather than objects.
function swarmSheet(){
  const ids=(S.scatter.set||[]).slice(0,7).filter(id=>S.assets.has(id));
  if(!ids.length) return null;
  const px=96, n=Math.ceil(Math.sqrt(ids.length)), c=cnv(n*px,n*px), g=c.getContext('2d');
  ids.forEach((id,i)=>{
    const a=S.assets.get(id), src=a.levels[a.levels.length-1];
    g.drawImage(src,(i%n)*px,Math.floor(i/n)*px,px,px);
  });
  return {canvas:c,atlas:[n,n]};
}
const PTEX={};
function particleTex(kind){
  if(kind==='SWARM'){
    const sh=swarmSheet(); if(!sh) return null;
    if(!PTEX.SWARM||PTEX.SWARM.n!==(S.scatter.set||[]).length){
      const t=gl.createTexture(); upload(t,sh.canvas,true);
      PTEX.SWARM={tex:t,atlas:sh.atlas,n:(S.scatter.set||[]).length};
    }
    return PTEX.SWARM;
  }
  if(PTEX[kind]) return PTEX[kind];
  const d=PKINDS[kind]; if(!d) return null;
  const sh=d.make(), t=gl.createTexture(); upload(t,sh.canvas,true);
  PTEX[kind]={tex:t,atlas:sh.atlas};
  return PTEX[kind];
}
// Your own flake. The atlas machinery does not care where the picture came
// from, so a loaded PNG is a kind like any other.
function addFlakeKind(img,name){
  const key='MY_'+name.toUpperCase().replace(/[^A-Z0-9]+/g,'').slice(0,10);
  const px=128, c=cnv(px,px), g=c.getContext('2d');
  const k=Math.min(px/img.width,px/img.height);

const PKIND_NAMES=()=>Object.keys(PKINDS).concat(['SWARM']);
function addEmitter(kind){

/* ══ SCATTER ══════════════════════════════════════════════ */
let lastScatter=null;
// A stroke of the brush is one group, so a swept line of trees arrives as a
// single thing rather than forty loose layers.
let scatterRun=null, scatterWalk=0;
function scatterBegin(){ scatterRun=[]; scatterWalk=0; lastScatter=null; }
function scatterEnd(){
  if(scatterRun&&scatterRun.length>1){
    makeGroup(scatterRun,'scatter '+(S.groups.length+1));
    S.sel=scatterRun[0].id;          // the gizmo now moves the whole planting
    hint(scatterRun.length+' planted');
  }
  scatterRun=null; draw(); bump();
}
// Walk the drag and drop a mark every `spacing` metres of travel. Measuring
// from the last mark instead let a slow hand clump and a fast one gap.
function scatterAt(p){
  const set=S.scatter.set.filter(id=>S.assets.has(id));
  if(!set.length) return;
  const sp=Math.max(0.2,S.scatter.spacing);
  if(lastScatter){
    scatterWalk+=Math.hypot(p[0]-lastScatter[0],p[2]-lastScatter[2]);
    lastScatter=p.slice();
    if(scatterWalk<sp) return;
    scatterWalk-=sp;
  } else lastScatter=p.slice();
  const id=set[(Math.random()*set.length)|0], a=S.assets.get(id);
  const base=DEFAULT_H[a.kind]||6, j=S.scatter.jitter;
  const l=addLayer(id,[p[0]+(Math.random()-0.5)*sp*0.6,p[1]||0,p[2]+(Math.random()-0.5)*sp*0.6],
    {height:base*(1+(Math.random()-0.5)*2*j)});
  // Width varies on its own: a bush spreads without growing taller, and a run of
  // trees reads as a species rather than as one tree at several sizes.
  const wj=S.scatter.wjit===undefined?0.2:S.scatter.wjit;
  l.wscale=Math.max(0.05,1+(Math.random()-0.5)*2*wj);
  if(S.scatter.flip&&Math.random()<0.5) l.wscale=-l.wscale;
  if(S.scatter.faceJit) l.faceJit=(Math.random()*2-1)*S.scatter.faceJit;
  if(S.scatter.cross) l.cross=true;
  dropToSurface(l);                      // land on the tilted ground, not at y=0
  if(scatterRun) scatterRun.push(l);     // one stroke, one group
}

/* ══ GIZMO ════════════════════════════════════════════════
   Ground arrows for X / Y / Z, a transform box on the card.
   Dragging the centre auto-locks to an axis, SketchUp style.
──────────────────────────────────────────────────────────── */
const GIZ=()=>document.body.classList.contains('touch')?64:52;   // constant screen length

// so a copy needs no second finger and no keyboard.
const GIZMODES=['move','copy','turn','size'];

const cycleGizMode=()=>{ S.gizMode=GIZMODES[(GIZMODES.indexOf(S.gizMode)+1)%GIZMODES.length]; };
// In PLAN and SIDE the gizmo is flat: two axes, drawn in the schematic's own space.
function gizmoFlat(){
  const l=S.layers.find(x=>x.id===S.sel); if(!l) return null;
  const rs=miniRects(); if(!rs.length) return null;
  const r=rs.find(x=>x.id===(S.gizR||rs[0].id))||rs[0];
  const M=miniMap(r,boundsFor(r.id));
  const c=M.to(l.pos);
  if(c[0]<r.x||c[0]>r.x+r.w||c[1]<r.y||c[1]>r.y+r.h) return null;
  const G=GIZ()*1.35;                       // a flat gizmo is the only handle here
  const horiz=r.id==='top'?'x':'z', vert=r.id==='top'?'z':'y';
  return {l,r,M,c,flat:true,horiz,vert,
    hEnd:[c[0]+G,c[1]], vEnd:[c[0],c[1]-G],
    // top: yaw for anything standing. side: rake, and only a plane has one.
    ring:G*0.62, rot:r.id==='top'?!isPlane(l):isPlane(l), rotKind:r.id==='top'?'yaw':'tilt',
    // what a drag from the centre does — tap to cycle
    modeBtn:[c[0]-G*0.62*1.25,c[1]+G*0.62*1.25],
    perM:M.s};
}
function gizmoFlatHit(px,py,g){
  if(px<g.r.x||px>g.r.x+g.r.w||py<g.r.y||py>g.r.y+g.r.h) return null;
  const touch=document.body.classList.contains('touch');
  const R=touch?24:15, RS=touch?18:11;
  if(Math.hypot(g.modeBtn[0]-px,g.modeBtn[1]-py)<(touch?20:15)) return 'fmode';
  if(Math.hypot(g.c[0]-px,g.c[1]-py)<R) return 'fmove';
  if(segDist(px,py,g.c,g.hEnd)<RS) return 'fh';
  if(segDist(px,py,g.c,g.vEnd)<RS) return 'fv';
  if(g.rot&&Math.abs(Math.hypot(px-g.c[0],py-g.c[1])-g.ring)<(touch?18:12)) return 'frot';
  return null;
}
function drawGizmoFlat(){
  const g=gizmoFlat(); if(!g) return;
  const act=drag&&drag.mode;
  const colOf=a=>a==='x'?AXC.x:a==='y'?AXC.y:AXC.z;
  octx.save(); octx.lineCap='round';
  octx.beginPath(); octx.rect(g.r.x,g.r.y,g.r.w,g.r.h); octx.clip();
  if(g.rot){                                  // the turn handle, and what it reads
    const on=act==='frot';
    octx.globalAlpha=1;
    octx.strokeStyle=on?'#FF3A1E':'#C9A227'; octx.lineWidth=on?3:2;
    octx.beginPath(); octx.arc(g.c[0],g.c[1],g.ring,0,6.284); octx.stroke();
    const ang=g.rotKind==='tilt'?(g.l.tilt||0)*Math.PI/180:-(g.l.yaw||0);
    const hx=g.c[0]+Math.cos(ang)*g.ring, hy=g.c[1]+Math.sin(ang)*g.ring;
    octx.fillStyle=on?'#FF3A1E':'#C9A227';
    octx.beginPath(); octx.arc(hx,hy,on?6:5,0,6.284); octx.fill();
    octx.font='10px -apple-system,Helvetica,Arial';
    octx.fillText(g.rotKind==='tilt'
        ? Math.round(g.l.tilt||0)+'° rake'
        : Math.round(((-(g.l.yaw||0)*57.3)%360+360)%360)+'° turn',
      g.c[0]+g.ring+10,g.c[1]-g.ring-6);
  }
  const arrow=(to,col,on,label)=>{
    octx.globalAlpha=1; octx.strokeStyle=col; octx.fillStyle=col;
    octx.lineWidth=on?3.5:2.5;
    const d=Math.atan2(to[1]-g.c[1],to[0]-g.c[0]), hl=13;
    octx.beginPath();
    octx.moveTo(g.c[0]+Math.cos(d)*7,g.c[1]+Math.sin(d)*7);
    octx.lineTo(to[0]-Math.cos(d)*hl,to[1]-Math.sin(d)*hl);
    octx.stroke();
    octx.beginPath(); octx.moveTo(to[0],to[1]);
    octx.lineTo(to[0]-Math.cos(d-0.36)*hl,to[1]-Math.sin(d-0.36)*hl);
    octx.lineTo(to[0]-Math.cos(d+0.36)*hl,to[1]-Math.sin(d+0.36)*hl);
    octx.closePath(); octx.fill();
    octx.font='10px -apple-system,Helvetica,Arial';
    octx.fillText(label,to[0]+7,to[1]+4);
  };
  arrow(g.hEnd,colOf(g.horiz),act==='fh',g.horiz.toUpperCase());
  arrow(g.vEnd,colOf(g.vert),act==='fv',g.vert.toUpperCase());
  octx.globalAlpha=1;
  octx.fillStyle=act==='fmove'?'#FF3A1E':'#F2F2F2';
  octx.beginPath(); octx.arc(g.c[0],g.c[1],6,0,6.284); octx.fill();
  const MB=g.modeBtn;                          // mode button and its label
  octx.strokeStyle='#F2F2F2'; octx.lineWidth=1.5;
  octx.strokeRect(MB[0]-8,MB[1]-8,16,16);
  octx.fillStyle=GIZMODE_COL[S.gizMode]||'#F2F2F2';
  octx.fillRect(MB[0]-4,MB[1]-4,8,8);
  octx.font='10px -apple-system,Helvetica,Arial'; octx.fillStyle='#F2F2F2';
  octx.fillText(S.gizMode.toUpperCase(),MB[0]-8,MB[1]+24);
  octx.strokeStyle='rgba(0,0,0,0.55)'; octx.lineWidth=1; octx.stroke();
  octx.restore();

const FLATVIEW=()=>S.big||['PLAN','SIDE','TRIPLE'].includes(VIEWS[S.view]);
function gizmo(){
  if(FLATVIEW()) return null;
  const l=S.layers.find(x=>x.id===S.sel); if(!l) return null;
  const vp=viewports()[0], a=S.assets.get(l.assetId); if(!a) return null;
  const P=p=>{const q=project(vp.m,p,vp.w,vp.h); return q?[q[0]+vp.x,q[1]+vp.y]:null;};
  const o=l.pos, c=P(o); if(!c) return null;
  // screen direction of each world axis, from a small world probe
  const probe=Math.max(0.05,l.height*0.02+0.05);
  const dirOf=v=>{
    const q=P(V.add(o,V.mul(v,probe))); if(!q) return null;
    const dx=q[0]-c[0],dy=q[1]-c[1],len=Math.hypot(dx,dy);
    if(len<0.0004) return null;
    return {u:[dx/len,dy/len],px:len/probe};       // px per world metre along this axis
  };
  const dX=dirOf([1,0,0]), dY=dirOf([0,1,0]), dZ=dirOf([0,0,1]);
  if(!dX||!dY||!dZ) return null;
  const G=GIZ();
  const end=d=>[c[0]+d.u[0]*G,c[1]+d.u[1]*G];
  const w=widthOf(l,a);
  const {right,up:fUp}=faceBasis(l,vp);   // handles ride the surface, standing or lying
  const top=P(V.add(o,V.mul(fUp,l.height)));
  const rightMid=P(V.add(o,V.add(V.mul(right,w/2),V.mul(fUp,l.height/2))));
  const corner=P(V.add(o,V.add(V.mul(right,w/2),V.mul(fUp,l.height))));
  const dW=(()=>{const q=P(V.add(o,V.mul(right,probe))); if(!q) return dX.px;
    return Math.hypot(q[0]-c[0],q[1]-c[1])/probe;})();
  // rotation ring sits on the ground plane, screen radius fixed
  const ringR=G*0.62;
  const spin=Math.atan2(dX.u[1],dX.u[0]);
  const rotH=[c[0]+Math.cos(spin+0.9)*ringR,c[1]+Math.sin(spin+0.9)*ringR*0.42];
  return {l,a,vp,c,right,
    ax:end(dX),az:end(dZ),ay:end(dY),
    dX,dY,dZ,ringR,spin,rotH,
    top,rightMid,corner,
    pxY:dY.px,pxX:dW};
}
function segDist(px,py,a,b){
  const vx=b[0]-a[0],vy=b[1]-a[1],L=vx*vx+vy*vy;
  let t=L?((px-a[0])*vx+(py-a[1])*vy)/L:0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(a[0]+vx*t),py-(a[1]+vy*t));
}
function gizmoHit(px,py,g){
  const touch=document.body.classList.contains('touch');
  const R=touch?24:15, RS=touch?18:11;
  const near=q=>q&&Math.hypot(q[0]-px,q[1]-py)<R;
  if(near(g.c)) return 'move';                      // centre wins — it is the smallest target
  if(near(g.rotH)) return 'rotate';
  if(near(g.corner)) return 'scaleU';
  if(near(g.top)) return 'scaleH';
  if(near(g.rightMid)) return 'scaleW';
  const axes=[['lift',g.ay],['axisX',g.ax],['axisZ',g.az]]
    .map(([m,e])=>[m,segDist(px,py,g.c,e)])
    .filter(([,d])=>d<RS)
    .sort((a,b)=>a[1]-b[1]);
  return axes.length?axes[0][0]:null;
}
const AXC={x:'#E5484D',y:'#4CC38A',z:'#4C7DF0'};      // X red · Y green · Z blue
function drawGizmo(){
  const g=gizmo(); if(!g) return;
  const act=drag&&drag.mode?drag.mode:null, lock=drag&&drag.lock;
  const busy=!!act;
  octx.save(); octx.lineCap='round';
  const arrow=(to,col,on,dim,label)=>{
    octx.globalAlpha=on?1:(dim?0.22:0.9);
    octx.strokeStyle=col; octx.fillStyle=col;
    octx.lineWidth=on?2:1.5;
    const d=Math.atan2(to[1]-g.c[1],to[0]-g.c[0]), hl=10;
    octx.beginPath();
    octx.moveTo(g.c[0]+Math.cos(d)*7,g.c[1]+Math.sin(d)*7);
    octx.lineTo(to[0]-Math.cos(d)*hl,to[1]-Math.sin(d)*hl);
    octx.stroke();
    octx.beginPath();
    octx.moveTo(to[0],to[1]);
    octx.lineTo(to[0]-Math.cos(d-0.36)*hl,to[1]-Math.sin(d-0.36)*hl);
    octx.lineTo(to[0]-Math.cos(d+0.36)*hl,to[1]-Math.sin(d+0.36)*hl);
    octx.closePath(); octx.fill();
    if(label&&!busy){ octx.globalAlpha=0.75; octx.font='9px -apple-system,Helvetica,Arial';
      octx.fillText(label,to[0]+Math.cos(d)*8-2,to[1]+Math.sin(d)*8+3); }
  };
  // rotation ring — flattened ellipse on the ground, green like Y since it turns about Y
  octx.globalAlpha=act==='rotate'?1:(busy?0.18:0.5);
  octx.strokeStyle=AXC.y; octx.lineWidth=act==='rotate'?2:1.5;
  octx.beginPath();
  octx.ellipse(g.c[0],g.c[1],g.ringR,g.ringR*0.42,g.spin,0,6.284);
  octx.stroke();
  octx.globalAlpha=act==='rotate'?1:(busy?0.18:0.9);
  octx.fillStyle=AXC.y;
  octx.beginPath(); octx.arc(g.rotH[0],g.rotH[1],4,0,6.284); octx.fill();
  const onX=act==='axisX'||lock==='x', onY=act==='lift', onZ=act==='axisZ'||lock==='z';
  arrow(g.ax,AXC.x,onX,busy&&!onX,'X');
  arrow(g.ay,AXC.y,onY,busy&&!onY,'Y');
  arrow(g.az,AXC.z,onZ,busy&&!onZ,'Z');
  // centre — free move / auto-lock origin
  octx.globalAlpha=1;
  octx.fillStyle=act==='move'?'#FF3A1E':'rgba(255,255,255,0.92)';
  octx.beginPath(); octx.arc(g.c[0],g.c[1],4.5,0,6.284); octx.fill();
  octx.strokeStyle='rgba(0,0,0,0.55)'; octx.lineWidth=1; octx.stroke();
  // 2D transform handles on the card — white, they are not axes
  const box=(q,on)=>{ if(!q) return;
    octx.globalAlpha=busy&&!on?0.3:1;
    octx.fillStyle=on?'#FF3A1E':'rgba(255,255,255,0.95)';
    octx.fillRect(q[0]-4,q[1]-4,8,8);
    octx.strokeStyle='rgba(0,0,0,0.55)'; octx.lineWidth=1;
    octx.strokeRect(q[0]-4.5,q[1]-4.5,9,9); };
  box(g.top,act==='scaleH'); box(g.rightMid,act==='scaleW'); box(g.corner,act==='scaleU');
  octx.restore();
}
function inferenceLine(){
  if(!drag||!drag.lock) return;
  const vp=viewports()[0], o=drag.l.pos, ax=drag.lock==='x'?[1,0,0]:[0,0,1];
  const P=p=>{const q=project(vp.m,p,vp.w,vp.h); return q?[q[0]+vp.x,q[1]+vp.y]:null;};
  const a=P(V.sub(o,V.mul(ax,300))), b=P(V.add(o,V.mul(ax,300)));
  if(!a||!b) return;
  octx.save(); octx.strokeStyle=drag.lock==='x'?'rgba(229,72,77,0.55)':'rgba(76,125,240,0.55)';
  octx.lineWidth=1;
  octx.setLineDash([4,4]);
  octx.beginPath(); octx.moveTo(a[0],a[1]); octx.lineTo(b[0],b[1]); octx.stroke();
  octx.restore();
}

/* ══ NODES — a graph that does things to the scene ═════════
   Built on what makes four node systems readable:

   HOUDINI   every node acts on the whole stream, not on one
             object: a stream of THINGS goes in, the same things
             (changed) or new ones come out. Bypass any node to see
             what it contributes. A chain packs into one COMPONENT
             with its useful controls promoted to the top.
   BLENDER   colour says what family a node is; the socket's shape
             says what flows through it — a square carries things,
             a circle carries a value. One node, several MODES,
             instead of a node per operation. And per-item variation
             lives inside the node (spread, jitter), so a forest
             needs no node per tree.
   BITWIG    a SIGNAL is a small modulator dragged onto any live
             control. The control keeps its own value; the signal
             swings it around that value by an amount set on the
             wire. Everything that moves is drawn moving — the
             waveform, the dot running along the wire, the marker
             on the control. Delete a node and its cables join
             around it.
   WIRE      only what may be modulated gets an inlet; settings
             that rebuild things (counts, seeds, kinds) stay in the
             panel. Adding a node after the selected one connects it.

   Two kinds of node change the scene. MAKERS own layers they build
   (an image, an array, a landscape, a building) and rebuild only
   when a setting that shapes them changes. SHAPERS (transform,
   look, animate) never touch a layer: they offset what is drawn,
   frame by frame, so nothing is destroyed and bypass is instant.

   The depth-band grading nodes of earlier builds live on, in grey.
──────────────────────────────────────────────────────────── */

function setCentre(ids){
  let x=0,y=0,z=0,k=0;
  for(const id of ids){ const w=work(id); if(!w) continue; x+=w.pos[0]; y+=w.pos[1]; z+=w.pos[2]; k++; }
  return k?[x/k,y/k,z/k]:[0,0,0];
}
const turnAbout=(w,c,a)=>{ const dx=w.pos[0]-c[0], dz=w.pos[2]-c[2], ca=Math.cos(a), sa=Math.sin(a);
  w.pos[0]=c[0]+dx*ca+dz*sa; w.pos[2]=c[2]-dx*sa+dz*ca; w.yaw+=a; };
function shapeTransform(ids,P){
  const c=setCentre(ids);
  const turn=P('turn')*Math.PI/180, s=P('scale'), wd=P('width');
  const jm=P('jmove'), jt=P('jturn')*Math.PI/180, js=P('jscale');
  for(const id of ids){
    const w=work(id); if(!w) continue;
    const h1=hashId(id,1), h2=hashId(id,2), h3=hashId(id,3), h4=hashId(id,4);
    if(turn) turnAbout(w,c,turn);
    if(s!==1){ w.pos=[c[0]+(w.pos[0]-c[0])*s, c[1]+(w.pos[1]-c[1])*s, c[2]+(w.pos[2]-c[2])*s];
      w.height*=s; }
    w.wscale*=wd;
    w.pos[0]+=P('x')+(h1*2-1)*jm; w.pos[1]+=P('y'); w.pos[2]+=P('z')+(h2*2-1)*jm;
    if(jt) w.yaw+=(h3*2-1)*jt;
    if(js) w.height*=1+(h4*2-1)*js;
  }
}
function shapeLook(n,ids,P){
  const op=P('opacity'), thin=P('thin'), tint=P('tint'), warm=P('warm');
  const tc=[0.75+warm*0.5,0.85+warm*0.12,1.2-warm*0.6];
  for(const id of ids){
    const w=work(id); if(!w) continue;
    w.opacity*=op;
    if(hashId(id,7)<thin) w.hidden=true;
    if(tint>0.001) w.ntint=[0,1,2].map(i=>1-tint+tint*tc[i]);
    if((n.p.black||0)>=0.5) w.solid=true;
  }
}
function shapeAnimate(n,ids,P,t){
  const m=modeOf(n), sp=P('speed'), spread=P('spread');
  const c=setCentre(ids);
  const host=n._orig||n;
  if(m==='record'&&GREC.on===host){
    // the selected thing is the hand; its real moves are written down
    const l=S.layers.find(x=>x.id===GREC.id);
    if(l){ const st=GREC.start;
      host.rec=host.rec||[]; host.rec.push([GT-GREC.t0,l.pos[0]-st[0],l.pos[1]-st[1],l.pos[2]-st[2],(l.yaw||0)-GREC.yaw]);
      if(host.rec.length>3600) host.rec.shift(); }
    return;
  }
  ids.forEach((id,i)=>{
    const w=work(id); if(!w) return;
    const ph=hashId(id,5)*spread;
    if(m==='random'){
      const A=P('amount'), T=P('turn')*Math.PI/180, s=hashId(id,6)*10;
      w.pos[0]+=smoothNoise(t*sp+ph*7,s)*A; w.pos[2]+=smoothNoise(t*sp+ph*7+3.1,s+1)*A;
      w.pos[1]+=Math.max(-w.pos[1],smoothNoise(t*sp+5.7,s+2)*A*0.25);
      w.yaw+=smoothNoise(t*sp+1.9,s+3)*T;
    } else if(m==='sway'){
      const v=Math.sin((t*sp+ph)*Math.PI*2), A=P('amount'), ax=Math.round(n.p.axis||0);
      if(ax===0) w.pos[0]+=v*A; else if(ax===1) w.pos[1]+=Math.max(-w.pos[1],v*A);
      else if(ax===2) w.pos[2]+=v*A; else if(ax===3) w.yaw+=v*P('turn')*Math.PI/180;
      else { w.height*=1+v*0.08*A; }
    } else if(m==='orbit'){
      // each one circles its own place, facing the way it goes — birds, a moon
      const a=(t*sp+ph)*Math.PI*2*0.25, r=P('radius');
      w.pos[0]+=Math.sin(a)*r; w.pos[2]+=Math.cos(a)*r; w.yaw+=a;
    } else if(m==='record'){
      const R=host.rec; if(!R||R.length<2) return;
      const dur=Math.max(0.1,R[R.length-1][0]);
      const tt=(((t*sp)+ph*dur)%dur+dur)%dur;
      let k=0; while(k<R.length-1&&R[k+1][0]<tt) k++;
      const f=R[k];
      w.pos[0]+=f[1]; w.pos[1]+=f[2]; w.pos[2]+=f[3]; w.yaw+=f[4];
    } else if(m==='sequence'){
      const seq=S.assets.get(n.seq);
      if(isSeq(seq)){
        w.assetId=seq.id;
        w.anim={speed:sp,offset:ph,loop:true,rev:false,from:0,to:-1,play:true};
      } else {
        // a flipbook of the stills of one kind
        const pics=pictures().filter(a=>!a.builtin&&a.group===(n.flip||'Imported')&&!isSeq(a));
        if(pics.length){ const k=Math.floor(t*P('fps')*Math.max(0.05,sp)+ph*pics.length*3)%pics.length;
          w.assetId=pics[(k+pics.length)%pics.length].id; }
      }
    }
  });
}
// recording: the hand is the first thing in the animate node's set
const GREC={on:null,t0:0,start:null,yaw:0,id:null};
function recordToggle(n){
  if(GREC.on===n){
    // stopping: the hand goes back to where it started, and plays its moves
    const l=S.layers.find(x=>x.id===GREC.id);
    if(l&&GREC.start){ l.pos=GREC.start.slice(); l.yaw=GREC.yaw; }
    GREC.on=null; hint('recorded '+((n.rec||[]).length)+' steps'); markDirty();
  } else {
    const first=S.layers.find(l=>l.id===S.sel);
    if(!first){ hint('select the thing to move first'); return; }
    n.rec=[]; GREC.on=n; GREC.t0=GT; GREC.start=first.pos.slice(); GREC.yaw=first.yaw||0; GREC.id=first.id;
    S.nodeRun=true;
    hint('recording — move it, then press stop');
  }
  graphDirty=true; animCheck(); draw(); bump();
}
/* ── the world: light and weather are driven, not drawn ──────── */
function worldLight(n,P){
  const m=modeOf(n);
  if(m==='sun'){
    S.sun.az=(((P('az')%360)+360)%360)*Math.PI/180; S.sun.el=clamp(P('el'),1,89)*Math.PI/180;
    S.sun.int=clamp(P('int'),0,1.4); S.sun.warm=clamp(P('warm'),0,1);
  } else if(m==='ambient') S.ambient=clamp(P('amb'),0,1.5);
}
function worldParticles(n,P){
  const id='nd:'+n.id;
  let em=(S.emit||[]).find(e=>e.id===id);
  if(!em){ em={id,kind:n.kind||'SNOW',amount:0.5,size:1,wind:0.3}; S.emit=[...(S.emit||[]),em]; }
  em.kind=n.kind||'SNOW';
  em.amount=clamp(P('amount'),0,1); em.size=Math.max(0.05,P('size')); em.wind=Math.max(0,P('wind'));
}
function dropEmitter(n){ const id='nd:'+n.id; S.emit=(S.emit||[]).filter(e=>e.id!==id); }
// a light maker's glow draws through the same shapers; its size and warmth are live
function glowLive(n,ids,P){
  for(const id of ids){ const w=work(id); if(!w) continue;
    w.height=P('size'); const v=P('warm'); w.tint=[0.6+v*0.6,0.7+v*0.25,1.3-v*0.9].map(x=>x*P('int')*1.6); }
}

/* ══ THE EDITOR ════════════════════════════════════════════ */
const gcv=document.createElement('canvas');
gcv.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;z-index:11;pointer-events:none;display:none';
document.body.appendChild(gcv);
const gctx=gcv.getContext('2d');
const NW=184, NHEAD=26, NROW=17, NDISP=34;
const nv=()=>S.nview||(S.nview={x:0,y:0,z:1});
// The graph takes the lower part of the screen, so what it does stays in view
// above it; FULL gives it the whole screen.
function graphArea(){
  if(!S.nodesOpen) return null;
  if(S.nodeFull) return {x:0,y:0,w:W,h:Hh};
  const y=sceneH();
  return {x:0,y,w:W,h:Hh-y};
}
const inGraph=(px,py)=>{ const g=graphArea(); return !!g&&py>=g.y&&px>=g.x&&px<=g.x+g.w; };
const toScr=(x,y)=>{ const g=graphArea()||{x:0,y:0}, v=nv(); return [g.x+(x+v.x)*v.z, g.y+(y+v.y)*v.z]; };
const toNode=(px,py)=>{ const g=graphArea()||{x:0,y:0}, v=nv(); return [(px-g.x)/v.z-v.x,(py-g.y)/v.z-v.y]; };
function shownParams(n){
  const d=defOf(n);
  if(d.fam==='grade') return paramsOf(n);
  const ps=paramsOf(n);
  if(n.type==='component') return ps.slice(0,6);
  // what can be driven, if it has any; else what shapes it — on its face either way
  const lv=ps.filter(isLive);
  return (lv.length?lv:ps).slice(0,5);
}
function nodeHeight(n){
  const d=defOf(n);
  if(d.fam==='grade') return 46;
  let h=NHEAD+shownParams(n).length*NROW+8;
  if(n.type==='signal'||n.type==='animate') h+=NDISP;
  if(!shownParams(n).length&&n.type!=='signal'&&n.type!=='animate') h+=16;
  return h;
}
function nodeAt(px,py){
  const [x,y]=toNode(px,py);
  for(let i=S.nodes.length-1;i>=0;i--){
    const n=S.nodes[i];
    if(x>=n.x&&x<=n.x+NW&&y>=n.y&&y<=n.y+nodeHeight(n)) return n;
  }
  return null;
}
// Where a node's sockets are. A square carries things, a circle a value.
function portsOf(n){
  const d=defOf(n), out=[], hy=n.y+NHEAD/2;
  if(d.fam==='grade'){
    if(d.bin) out.push({port:'bin',x:n.x,y:n.y+23,dir:'in',kind:'band'});
    if(d.bout) out.push({port:'bout',x:n.x+NW,y:n.y+23,dir:'out',kind:'band'});
    return out;
  }
  if(d.tin) out.push({port:'main',x:n.x,y:hy,dir:'in',kind:'things'});
  if(d.tout) out.push({port:'tout',x:n.x+NW,y:hy,dir:'out',kind:'things'});
  if(d.vout) out.push({port:'vout',x:n.x+NW,y:hy,dir:'out',kind:'value'});
  shownParams(n).forEach((p,i)=>{ if(isLive(p)||n.type==='component')
    out.push({port:'p:'+p[0],x:n.x,y:n.y+NHEAD+i*NROW+NROW/2+2,dir:'in',kind:'value',param:p}); });
  return out;
}
function portAt(px,py,dir){
  const [x,y]=toNode(px,py), R=16/nv().z;
  let best=null;
  for(const n of S.nodes) for(const q of portsOf(n)){
    if(dir&&q.dir!==dir) continue;
    const d=Math.hypot(q.x-x,q.y-y);
    if(d<R&&(!best||d<best.d)) best={n,q,d};
  }
  return best;
}
// a control row's bar, for dragging a value straight on the node's face
function barAt(px,py){
  const n=nodeAt(px,py); if(!n||defOf(n).fam==='grade') return null;
  const [x,y]=toNode(px,py);
  const ps=shownParams(n);
  const i=Math.floor((y-n.y-NHEAD-2)/NROW);
  if(i<0||i>=ps.length||x<n.x+70) return null;
  return {n,p:ps[i],x0:n.x+76,x1:n.x+NW-34};
}
// One place that makes a link: it checks the kinds fit and replaces what must go.
function connect(fromId,toId,port){
  const a=nodeById(fromId), b=nodeById(toId);
  if(!a||!b||a===b) return false;
  const da=defOf(a), db=defOf(b);
  if(da.fam==='grade'||db.fam==='grade'){
    if(da.fam!=='grade'||db.fam!=='grade'||!db.bin) return false;
    S.links=S.links.filter(l=>!(l.from===fromId&&portOfLink(l)==='main')&&
      (db.multi||!(l.to===toId&&portOfLink(l)==='main')));
    S.links.push({from:fromId,to:toId});
  } else if(da.vout){
    if(!port||port==='main'){
      const first=shownParams(b).find(p=>isLive(p)||b.type==='component');
      if(!first) return false; port='p:'+first[0];
    }
    if(!String(port).startsWith('p:')) return false;
    S.links=S.links.filter(l=>!(l.from===fromId&&l.to===toId&&l.port===port));
    S.links.push({from:fromId,to:toId,port,depth:0.5});
  } else {
    if(!da.tout||!db.tin) return false;
    if(S.links.some(l=>l.from===fromId&&l.to===toId)) return false;
    S.links.push({from:fromId,to:toId});
  }
  invalidateChains(); markDirty(); return true;
}
// Deleting a node joins the cables around it, the way Bitwig does.
function deleteNodes(ids){
  const gone=new Set(ids);
  snap(true);
  for(const id of gone){
    const n=nodeById(id); if(!n) continue;
    const ins=S.links.filter(l=>l.to===id&&portOfLink(l)==='main').map(l=>l.from);
    const outs=S.links.filter(l=>l.from===id&&portOfLink(l)==='main').map(l=>l.to);
    for(const a of ins) for(const b of outs) if(!gone.has(a)&&!gone.has(b))
      if(!S.links.some(l=>l.from===a&&l.to===b)) S.links.push({from:a,to:b});
    clearOwned(id);
    if(n.type==='component') for(const m of (n.sub&&n.sub.nodes)||[]) clearOwned(id+'/'+m.id);
    if(n.type==='particles') dropEmitter(n);
  }
  S.links=S.links.filter(l=>!gone.has(l.from)&&!gone.has(l.to));
  S.nodes=S.nodes.filter(n=>!gone.has(n.id));
  S.nodeSel=null; S.nodeMulti=[];
  invalidateChains(); markDirty(); draw(); bump();
}
function wirePath(g,a,b,kind){
  const dx=Math.max(40,Math.abs(b[0]-a[0])*0.5);
  g.beginPath(); g.moveTo(a[0],a[1]);
  g.bezierCurveTo(a[0]+dx,a[1],b[0]-dx,b[1],b[0],b[1]);
}
function bez(a,b,t){
  const dx=Math.max(40,Math.abs(b[0]-a[0])*0.5);
  const p0=a,p1=[a[0]+dx,a[1]],p2=[b[0]-dx,b[1]],p3=b, u=1-t;
  return [u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],
          u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]];
}
const fmtP=(p,v)=>{ const o=p[4]||{};
  if(o.enum) return o.enum[Math.round(v)]||'';
  if(o.bool) return v>=0.5?'on':'off';
  if(o.int) return String(Math.round(v));
  const a=Math.abs(v); return (a>=100?v.toFixed(0):a>=10?v.toFixed(1):v.toFixed(2))+(o.unit||''); };
function drawNodes(){
  const g=graphArea();
  gcv.style.display=g?'block':'none';
  document.body.classList.toggle('graph-open',!!g);
  if(gcv.width!==cv.width||gcv.height!==cv.height){ gcv.width=cv.width; gcv.height=cv.height; }
  gctx.setTransform(DPR,0,0,DPR,0,0); gctx.clearRect(0,0,W,Hh);
  if(!g) return;
  const G=gctx;
  G.save();
  G.fillStyle='#0D0D0D'; G.fillRect(g.x,g.y,g.w,g.h);
  G.strokeStyle='rgba(242,242,242,0.55)'; G.lineWidth=1;
  G.beginPath(); G.moveTo(g.x,g.y+0.5); G.lineTo(g.x+g.w,g.y+0.5); G.stroke();
  G.beginPath(); G.rect(g.x,g.y,g.w,g.h); G.clip();

  for(let y=Math.floor(gy0/32)*32;y<gy1;y+=32){ G.beginPath(); G.moveTo(gx0,y+0.5); G.lineTo(gx1,y+0.5); G.stroke(); }
  const P=(n,port)=>{ const q=portsOf(n).find(x=>x.port===port); return q?[q.x,q.y]:[n.x,n.y]; };
  // cables
  for(const l of S.links){
    const a=nodeById(l.from), b=nodeById(l.to); if(!a||!b) continue;
    const da=defOf(a);
    const pa=da.fam==='grade'?P(a,'bout'):(da.vout?P(a,'vout'):P(a,'tout'));
    const pb=defOf(b).fam==='grade'?P(b,'bin'):P(b,portOfLink(l)==='main'?'main':l.port);
    const value=!!da.vout;
    G.strokeStyle=value?'rgba(76,125,240,0.85)':(da.fam==='grade'?'rgba(255,255,255,0.4)':'rgba(242,242,242,0.75)');
    G.lineWidth=value?1.25:1.75;
    wirePath(G,pa,pb); G.stroke();
    if(value){
      // the signal runs along its cable, at the speed of its own value
      const s=GVAL.get(a.id)||0;
      for(let k=0;k<3;k++){ const t=((GT*0.6+k/3)%1);
        const q=bez(pa,pb,t); G.fillStyle='rgba(120,160,255,'+(0.35+0.65*Math.abs(s))+')';
        G.beginPath(); G.arc(q[0],q[1],2.2,0,6.284); G.fill(); }
    } else if(da.fam!=='grade'&&a._count!==undefined){
      const q=bez(pa,pb,0.5);
      G.fillStyle='#0D0D0D'; G.fillRect(q[0]-12,q[1]-7,24,14);
      G.fillStyle='#9A9A9A'; G.font='9px -apple-system,Helvetica,Arial'; G.textAlign='center';
      G.fillText(String(a._count),q[0],q[1]+3); G.textAlign='left';
    }
  }
  if(S.wire){
    const a=nodeById(S.wire.from);
    if(a){ const da=defOf(a);
      const pa=da.fam==='grade'?P(a,'bout'):(da.vout?P(a,'vout'):P(a,'tout'));
      const pb=toNode(S.wire.x,S.wire.y);

    const d=defOf(n), fam=FAM[d.fam]||FAM.grade, H=nodeHeight(n);
    const sel=n.id===S.nodeSel||multi.has(n.id);
    G.globalAlpha=n.bypass?0.42:1;
    G.fillStyle='#161616'; G.fillRect(n.x,n.y,NW,H);
    G.fillStyle=fam.col; G.fillRect(n.x,n.y,NW,3);
    G.strokeStyle=sel?'#FF3A1E':'#2E2E2E'; G.lineWidth=sel?1.5:1;
    G.strokeRect(n.x+0.5,n.y+0.5,NW-1,H-1);
    G.fillStyle=sel?'#FF3A1E':'#F2F2F2';
    G.font='700 10px -apple-system,Helvetica,Arial';
    const title=(n.name||d.title).toUpperCase();
    G.fillText(title,n.x+10,n.y+17);
    const m=modeOf(n);
    if(m||n.kind||n.type==='image'){
      const tw=G.measureText(title).width;
      G.font='10px -apple-system,Helvetica,Arial'; G.fillStyle='#8A8A8A';
      const extra=n.type==='image'?((S.assets.get(n.asset)||{}).name||''):(m||'')+(n.kind?(' · '+String(n.kind).toLowerCase()):'');
      G.fillText(extra.slice(0,22),n.x+16+tw,n.y+17);
    }
    if(n.bypass){ G.fillStyle='#8A8A8A'; G.font='9px -apple-system,Helvetica,Arial'; G.fillText('BYPASS',n.x+NW-48,n.y+17); }
    if(d.fam==='grade'){
      G.fillStyle='#8A8A8A'; G.font='10px -apple-system,Helvetica,Arial';
      const ks=Object.keys(n.p);
      G.fillText(ks.length?ks.map(k=>(+n.p[k]).toFixed(2)).join('  '):(n.type==='out'?'the picture':'source'),

        const y=n.y+NHEAD+i*NROW+2;
        const base=n.p[p[0]]===undefined?p[3]:n.p[p[0]];
        const now=(n.type==='component')?base:paramNow(n,p[0],F);
        const f=v=>clamp((v-p[1])/Math.max(1e-6,p[2]-p[1]),0,1);
        G.fillStyle='#8A8A8A'; G.font='9px -apple-system,Helvetica,Arial';
        G.fillText(String(p[4].label||p[0]).slice(0,12),n.x+10,y+11);
        const x0=n.x+76, x1=n.x+NW-34;
        G.fillStyle='#2A2A2A'; G.fillRect(x0,y+7,x1-x0,1);
        G.fillStyle='#F2F2F2'; G.fillRect(x0+f(base)*(x1-x0)-1,y+3,2,9);
        if(Math.abs(now-base)>1e-6){       // where the signal has it now
          G.fillStyle='#4C7DF0'; G.fillRect(x0+f(now)*(x1-x0)-2.5,y+5,5,5);
        }
        G.fillStyle='#9A9A9A'; G.textAlign='right';
        G.fillText(fmtP(p,now),n.x+NW-8,y+11); G.textAlign='left';
      });

        G.strokeStyle='rgba(76,125,240,0.35)'; G.lineWidth=1;
        G.beginPath();
        const nn={...n};
        for(let k=0;k<=60;k++){ const t=GT-2+k/30; const vv=signalValue(nn,t);
          const X=x0+k/60*w, Y=y0+hh/2-vv*hh/2; k?G.lineTo(X,Y):G.moveTo(X,Y); }
        G.stroke();
        const vv=GVAL.get(n.id)||0;
        G.fillStyle='#4C7DF0'; G.beginPath(); G.arc(x0+w,y0+hh/2-vv*hh/2,3,0,6.284); G.fill();
      }
      if(n.type==='animate'){
        const y0=n.y+NHEAD+ps.length*NROW+4, hh=NDISP-8, x0=n.x+10, w=NW-20;
        const host=n;
        G.strokeStyle='rgba(255,58,30,0.5)'; G.lineWidth=1; G.beginPath();
        if(m==='record'&&host.rec&&host.rec.length>1){
          const R=host.rec; let mx=0.01; for(const r of R) mx=Math.max(mx,Math.abs(r[1]),Math.abs(r[3]));
          R.forEach((r,k)=>{ const X=x0+w/2+r[1]/mx*w*0.45, Y=y0+hh/2+r[3]/mx*hh*0.45; k?G.lineTo(X,Y):G.moveTo(X,Y); });
        } else {
          for(let k=0;k<=60;k++){ const t=GT-2+k/30;
            const vv=m==='sway'?Math.sin(t*(n.p.speed||0.5)*Math.PI*2):smoothNoise(t*(n.p.speed||0.5),1);
            const X=x0+k/60*w, Y=y0+hh/2-vv*hh*0.4; k?G.lineTo(X,Y):G.moveTo(X,Y); }
        }
        G.stroke();
        if(GREC.on===n){ G.fillStyle='#FF3A1E'; G.beginPath(); G.arc(x0+w-4,y0+4,4,0,6.284); G.fill(); }
      }
      if(!ps.length&&n.type!=='signal'&&n.type!=='animate'){
        G.fillStyle='#8A8A8A'; G.font='9px -apple-system,Helvetica,Arial';
        const txt=n.type==='layers'?((n._count||0)+' things'):n.type==='particles'?String(n.kind||'snow').toLowerCase():
          n.type==='component'?((n.sub&&n.sub.nodes||[]).length+' nodes inside'):'settings in the panel';
        G.fillText(txt,n.x+10,n.y+NHEAD+12);
      }
    }
    // sockets: square for things, circle for a value
    for(const q of portsOf(n)){
      if(q.kind==='things'){ G.fillStyle='#F2F2F2'; G.fillRect(q.x-4,q.y-4,8,8); }
      else if(q.kind==='value'){
        const linked=S.links.some(l=>(l.to===n.id&&l.port===q.port)||(q.port==='vout'&&l.from===n.id));
        G.fillStyle=linked?'#4C7DF0':'#161616'; G.strokeStyle='#4C7DF0'; G.lineWidth=1.2;
        G.beginPath(); G.arc(q.x,q.y,q.port==='vout'?5:3.5,0,6.284); G.fill(); G.stroke();

    }

  G.restore();
  G.fillStyle='#8A8A8A'; G.font='10px -apple-system,Helvetica,Arial';
  G.fillText(S.wire&&S.wire.armed

    :'NODES — drag from a socket to connect · drag a bar to set it · drag empty space to move around · '+

    g.x+16,g.y+g.h-12);

/* ── touching the graph ─────────────────────────────────────── */
let GD=null;                       // the gesture in progress inside the graph
const GP=new Map();                // fingers down in the graph, for the pinch
function graphDown(e){
  const x=e.clientX, y=e.clientY;
  GP.set(e.pointerId,{x,y});
  if(GP.size===2){                 // a second finger: the two of them zoom and move it
    const [a,b]=[...GP.values()], v=nv();
    if(GD&&GD.move) for(const o of GD.move){ o.m.x=o.x; o.m.y=o.y; }
    S.wire=null;
    GD={pinch:true,d0:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),z0:v.z,
      c0:toNode((a.x+b.x)/2,(a.y+b.y)/2)};
    draw(); return;
  }
  // a cable left armed by a tap is finished by the next tap
  if(S.wire&&S.wire.armed){
    const ok=wireDrop(x,y); S.wire=null; draw(); bump();
    if(ok) return;
  }
  const bar=barAt(x,y);
  if(bar&&!e.shiftKey){
    snap(true); S.nodeSel=bar.n.id;
    GD={bar,x0:x,y0:y}; graphMove(e); return;
  }
  const out=portAt(x,y,'out');
  if(out){ S.wire={from:out.n.id,x,y,x0:x,y0:y}; GD={wire:true}; draw(); return; }
  // pulling a cable off an input picks it up again, from where it came
  const inp=portAt(x,y,'in');
  if(inp){
    const lk=[...S.links].reverse().find(l=>l.to===inp.n.id&&
      (inp.q.port==='bin'?portOfLink(l)==='main':(inp.q.port==='main'?portOfLink(l)==='main':l.port===inp.q.port)));
    if(lk){ snap(true); S.links=S.links.filter(l=>l!==lk); invalidateChains();
      S.wire={from:lk.from,x,y,x0:x,y0:y,depth:lk.depth}; GD={wire:true}; draw(); bump(); return; }
  }
  const n=nodeAt(x,y);
  if(n){
    if(e.shiftKey){
      const m=new Set(S.nodeMulti||[]); if(S.nodeSel) m.add(S.nodeSel);
      if(m.has(n.id)) m.delete(n.id); else m.add(n.id);
      S.nodeMulti=[...m]; S.nodeSel=n.id;
    } else if(!(S.nodeMulti||[]).includes(n.id)){ S.nodeMulti=[]; S.nodeSel=n.id; }
    else S.nodeSel=n.id;
    const set=[...new Set([n.id,...(S.nodeMulti||[])])].map(nodeById).filter(Boolean);
    snap(true);
    GD={move:set.map(m=>({m,x:m.x,y:m.y})),x0:x,y0:y};
    bump(); draw(); return;
  }
  GD={pan:true,x0:x,y0:y,vx:nv().x,vy:nv().y,moved:false};
}
function graphMove(e){
  if(!GD) return;
  if(GP.has(e.pointerId)) GP.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(GD.pinch){
    if(GP.size<2) return;
    const [a,b]=[...GP.values()], v=nv();
    v.z=clamp(GD.z0*Math.hypot(a.x-b.x,a.y-b.y)/GD.d0,0.3,2.5);
    // the point between the fingers stays under them
    const c=toNode((a.x+b.x)/2,(a.y+b.y)/2);
    v.x+=c[0]-GD.c0[0]; v.y+=c[1]-GD.c0[1]; draw(); return;
  }
  const x=e.clientX, y=e.clientY, z=nv().z;
  if(GD.wire&&S.wire){ S.wire.x=x; S.wire.y=y; draw(); return; }
  if(GD.bar){
    const b=GD.bar, p=b.p, [nx]=toNode(x,y);
    let v=p[1]+clamp((nx-b.x0)/(b.x1-b.x0),0,1)*(p[2]-p[1]);
    if(p[4].int||p[4].enum) v=Math.round(v);
    if(p[4].bool) v=v>=(p[1]+p[2])/2?1:0;
    setParam(b.n,p[0],v); return;
  }
  if(GD.move){
    const dx=(x-GD.x0)/z, dy=(y-GD.y0)/z;
    for(const o of GD.move){ o.m.x=Math.round(o.x+dx); o.m.y=Math.round(o.y+dy); }
    markDirty(); draw(); return;
  }
  if(GD.pan){
    if(Math.hypot(x-GD.x0,y-GD.y0)>4) GD.moved=true;
    nv().x=GD.vx+(x-GD.x0)/z; nv().y=GD.vy+(y-GD.y0)/z; draw(); return;
  }
}
function graphUp(e){
  GP.delete(e.pointerId);
  if(!GD) return;
  if(GD.pinch){ if(!GP.size) GD=null; return; }
  const x=e.clientX, y=e.clientY;
  if(GD.wire&&S.wire&&!S.wire.armed){
    const moved=Math.hypot(x-S.wire.x0,y-S.wire.y0)>10;
    if(!moved) S.wire.armed=true;              // a tap arms it for a second tap
    else { wireDrop(x,y); S.wire=null; }
  }
  if(GD.pan&&!GD.moved){ S.nodeSel=null; S.nodeMulti=[]; }
  GD=null; draw(); bump();
}
function graphWheel(e){
  const v=nv(), [ax,ay]=toNode(e.clientX,e.clientY);
  v.z=clamp(v.z*(1-Math.sign(e.deltaY)*0.1),0.3,2.5);
  const [bx,by]=toNode(e.clientX,e.clientY);
  v.x+=bx-ax; v.y+=by-ay; draw();
}
// Let go of a cable: onto a socket, or onto a node, which takes it where it can.
function wireDrop(x,y){
  if(!S.wire) return false;
  const q=portAt(x,y,'in');
  let ok=false;
  if(q) ok=connect(S.wire.from,q.n.id,q.q.port==='bin'?'main':q.q.port);
  else { const n=nodeAt(x,y); if(n) ok=connect(S.wire.from,n.id); }
  if(ok&&S.wire.depth!==undefined){
    const l=S.links[S.links.length-1]; if(l&&l.port) l.depth=S.wire.depth; }
  return ok;
}
// One way in for every change to a node's setting, from the face or the panel.
function setParam(n,k,v){
  n.p[k]=v;
  if(n._orig) n._orig.p[k]=v;
  invalidateChains(); markDirty(); draw(); bump();
}
function fitGraph(){
  const g0=graphArea(), g=graphSeen(); if(!g||!S.nodes.length) return;
  const ox=g.x-g0.x;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const n of S.nodes){ x0=Math.min(x0,n.x); y0=Math.min(y0,n.y);
    x1=Math.max(x1,n.x+NW); y1=Math.max(y1,n.y+nodeHeight(n)); }
  const v=nv(), pad=40;
  v.z=clamp(Math.min((g.w-pad*2)/Math.max(1,x1-x0),(g.h-pad*2-20)/Math.max(1,y1-y0)),0.3,1.4);
  v.x=ox/v.z+(g.w/v.z-(x1-x0))/2-x0; v.y=(g.h/v.z-(y1-y0)-20/v.z)/2-y0;
  draw();
}
// The part of the graph not under an open side panel — where fitting aims.
function graphSeen(){
  const g=graphArea(); if(!g) return null;
  let x0=g.x, x1=g.x+g.w;
  const L=document.querySelector('.panel.left.open'), R=document.querySelector('.panel.right.open');
  if(L) x0=Math.max(x0,L.getBoundingClientRect().right);
  if(R) x1=Math.min(x1,R.getBoundingClientRect().left);
  return {x:x0,y:g.y,w:Math.max(120,x1-x0),h:g.h};
}
// a node just made is brought into view if it landed outside it
function revealNode(n,left){
  const g=graphArea(), s=graphSeen(); if(!g||!n) return;
  const v=nv(), [sx,sy]=toScr(n.x,n.y), hh=nodeHeight(n)*v.z;
  if(sx>=s.x+16&&sx+NW*v.z<=s.x+s.w-16&&sy>=s.y+16&&sy+hh<=s.y+s.h-28) return;
  const ox=s.x-g.x;
  v.x=left?((ox+60)/v.z-n.x):((ox+s.w/2)/v.z-NW/2-n.x);
  v.y=(g.h/v.z)*0.35-nodeHeight(n)/2-n.y;
}
// a free spot on screen for a new node: right of the selected one, or in view
function freeSpot(after){
  if(after) return [after.x+NW+48,after.y];
  const g=graphArea()||{x:0,y:0,w:W,h:Hh};
  const [x,y]=toNode(g.x+g.w*0.42,g.y+g.h*0.3);
  let k=0; while(S.nodes.some(n=>Math.abs(n.x-x-k*24)<10&&Math.abs(n.y-y-k*24)<10)) k++;
  return [Math.round(x+k*24),Math.round(y+k*24)];
}
/* ══ REPEAT COPY ══════════════════════════════════════════
   After one duplicate, ask for a count. LINEAR repeats the same
   offset n times; BETWEEN divides the span into n gaps; RADIAL
   sweeps the offset around the original — that is the stone circle.
──────────────────────────────────────────────────────────── */
function cloneOf(src,pos,extra){
  snap();
  const c=JSON.parse(JSON.stringify(src));
  c.id='l'+(uid++); c.pos=pos.slice();
  Object.assign(c,extra||{});
  const a=S.assets.get(src.assetId);
  c.name=a.name+' '+(S.layers.filter(x=>x.assetId===src.assetId).length+1);
  S.layers.push(c); return c;
}
// A PATH is a run of ground points. Drawn in the view, it lives in the world —
// so the same path serves the 3D view, the plan and the array.
// A swept path arrives as hundreds of samples. Keep the corners that matter and
// throw the rest away — then read what remains as a curve, so a handful of
// control points describes a smooth run rather than a chain of facets.
function simplifyPath(pts,tol){
  if(pts.length<3) return pts.slice();
  const keep=new Array(pts.length).fill(false);
  keep[0]=keep[pts.length-1]=true;
  const seg=(a,b)=>{
    let worst=-1,wi=-1;
    for(let i=a+1;i<b;i++){
      const p=pts[i],A=pts[a],B=pts[b];
      const vx=B[0]-A[0],vz=B[2]-A[2], wx=p[0]-A[0],wz=p[2]-A[2];
      const L=vx*vx+vz*vz;
      const t=L>1e-9?Math.max(0,Math.min(1,(wx*vx+wz*vz)/L)):0;
      const d=Math.hypot(wx-vx*t,wz-vz*t);
      if(d>worst){ worst=d; wi=i; }
    }
    if(worst>tol&&wi>0){ keep[wi]=true; seg(a,wi); seg(wi,b); }
  };
  seg(0,pts.length-1);
  return pts.filter((_,i)=>keep[i]);
}
// Catmull-Rom through the kept points: the points ARE the control points.
function splineAt(p,t){
  const n=p.length;
  if(n<3){
    const q=p[Math.min(n-1,Math.round(clamp(t,0,1)*(n-1)))]||p[0];
    return {p:q,yaw:n>1?Math.atan2(p[n-1][0]-p[0][0],p[n-1][2]-p[0][2]):0};
  }
  const at=u=>{
    const x=clamp(u,0,1)*(n-1), i=Math.min(n-2,Math.floor(x)), f=x-i;
    const P=k=>p[Math.max(0,Math.min(n-1,k))];
    const a=P(i-1),b=P(i),c=P(i+1),d=P(i+2);
    const q=j=>0.5*((2*b[j])+(-a[j]+c[j])*f+(2*a[j]-5*b[j]+4*c[j]-d[j])*f*f+
      (-a[j]+3*b[j]-3*c[j]+d[j])*f*f*f);
    return [q(0),q(1),q(2)];
  };
  const pos=at(t), nx=at(Math.min(1,t+0.004));
  return {p:pos,yaw:Math.atan2(nx[0]-pos[0],nx[2]-pos[2])};
}
function pathLengths(p){
  const seg=[0];
  for(let i=1;i<p.length;i++) seg.push(seg[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][2]-p[i-1][2]));
  return seg;
}
function pathAt(p,seg,t){
  if(S.pathSmooth!==false&&p.length>2) return splineAt(p,t);
  const total=seg[seg.length-1], d=clamp(t,0,1)*total;
  let i=1; while(i<seg.length-1&&seg[i]<d) i++;
  const a=p[i-1], b=p[i], s0=seg[i-1], s1=Math.max(s0+1e-6,seg[i]);
  const u=(d-s0)/(s1-s0);
  return {p:[a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u, a[2]+(b[2]-a[2])*u],
          yaw:Math.atan2(b[0]-a[0], b[2]-a[2])};
}
// Plant from the brush's own selection: one asset picked per station, sized and
// turned like the scatter brush does. This is what "array along the path" means
// when nothing in the scene is selected.
// What the path array will repeat. Three sources, and the choice is explicit
// rather than guessed — guessing is what made it use one figure when the brush
// held three.
function pathUnit(){
  const sel=S.layers.find(x=>x.id===S.sel);
  const brush=(S.scatter.set||[]).filter(id=>S.assets.has(id));
  const pick=S.pathSrc||'auto';
  if(pick==='array'||(pick==='auto'&&S.pathArr.unit&&S.lastArray)){
    const ids=(S.lastArray||[]).filter(id=>S.layers.some(l=>l.id===id));
    if(ids.length) return {mode:'layers',src:ids,label:'last array · '+ids.length};
  }
  if(pick==='brush'||(pick==='auto'&&!sel)){
    if(brush.length) return {mode:'assets',src:brush,
      label:'the brush · '+brush.map(id=>(S.assets.get(id)||{}).name).join(', ')};
  }
  if(sel) return {mode:'layers',src:[sel.id],
    label:(S.assets.get(sel.assetId)||{}).name};
  if(brush.length) return {mode:'assets',src:brush,
    label:'the brush · '+brush.length};

// Run it, remembering enough to run it again. Changing a slider afterwards
// rebuilds the same run rather than laying a second one on top — which is what
// makes trying variations quick.
function runPathArray(reroll){
  if(!S.path||S.path.length<2){ hint('draw a path first'); return 0; }
  const u=(S.pathRun&&!reroll)?S.pathRun.unit:pathUnit();
  if(!u){ hint('pick a layer, or tick assets above'); return 0; }
  if(S.pathRun&&S.pathRun.made){                 // clear the previous attempt
    const gone=new Set(S.pathRun.made);
    S.layers=S.layers.filter(l=>!gone.has(l.id));
    if(gone.has(S.sel)) S.sel=null;
    pruneGroups();
  }
  let n=0;
  if(u.mode==='assets') n=arrayOnPathAssets(u.src,S.pathArr);

    const unit=S.layers.filter(l=>u.src.includes(l.id));
    if(!unit.length){ S.pathRun=null; hint('the source is gone'); return 0; }
    const a0=S.assets.get(unit[0].assetId);
    if(unit.length===1&&a0&&(a0.kind==='ground'||a0.kind==='blank')&&isPlane(unit[0])){
      hint('that is the ground — pick an object'); return 0;
    }
    n=arrayOnPath(unit,S.pathArr);

const endPathRun=()=>{ S.pathRun=null; };
function arrayOnPathAssets(ids,o){
  if(!S.path||S.path.length<2||!ids.length) return 0;
  snap(true);
  const seg=pathLengths(S.path), total=seg[seg.length-1];
  const n=o.spacing>0.01?Math.max(1,Math.floor(total/o.spacing)+1):Math.max(1,o.n);
  const rr=()=>Math.random()*2-1;
  const made=[];
  for(let i=0;i<n;i++){
    const t=n===1?0:i/(n-1);
    const st=pathAt(S.path,seg,t);
    const off=(o.offset||0)+rr()*(o.offRnd||0);
    const nx=Math.cos(st.yaw), nz=-Math.sin(st.yaw);
    const id=ids[(Math.random()*ids.length)|0], a=S.assets.get(id);
    if(!a) continue;
    const base=DEFAULT_H[a.kind]||6;
    const k=1+rr()*(o.sizeRnd||0);
    const l=addLayer(id,[st.p[0]+nx*off, st.p[1], st.p[2]+nz*off],
      {height:Math.max(0.05,base*k)});
    l.wscale=Math.max(0.05,1+rr()*(o.wideRnd===undefined?0.15:o.wideRnd));
    if(o.flip&&Math.random()<0.5) l.wscale=-l.wscale;
    if(o.align){ l.yaw=st.yaw; l.face='fixed'; }
    if(o.turnRnd>0.001){ l.yaw=(l.yaw||0)+rr()*o.turnRnd*Math.PI;
      if(l.face==='camera') l.face='fixed'; }
    if(S.pathOnGround!==false) dropToSurface(l);
    made.push(l);
  }

  markDirty(); return made.length;
}
// Distribute a unit — one layer, or a whole set keeping its relative shape —
// along the path. This is the array a fence or a row of houses wants.
function arrayOnPath(unit,o){
  if(!S.path||S.path.length<2||!unit.length) return 0;
  snap(true);
  const seg=pathLengths(S.path), total=seg[seg.length-1];
  const n=o.spacing>0.01?Math.max(1,Math.floor(total/o.spacing)+1):Math.max(1,o.n);
  const cx=unit.reduce((s,l)=>s+l.pos[0],0)/unit.length;
  const cz=unit.reduce((s,l)=>s+l.pos[2],0)/unit.length;
  const made=[];
  const rr=()=>Math.random()*2-1;
  for(let i=0;i<n;i++){
    const t=n===1?0:i/(n-1);
    const st=pathAt(S.path,seg,t);
    // sidestep from the path, plus whatever randomness is asked for
    const off=(o.offset||0)+rr()*(o.offRnd||0);
    const nx=Math.cos(st.yaw), nz=-Math.sin(st.yaw);
    st.p=[st.p[0]+nx*off, st.p[1], st.p[2]+nz*off];
    for(const src of unit){
      const rx=src.pos[0]-cx, rz=src.pos[2]-cz;
      let dx=rx, dz=rz;
      if(o.align){ const c=Math.cos(st.yaw), s=Math.sin(st.yaw);
        dx=rx*c+rz*s; dz=-rx*s+rz*c; }
      const c=cloneOf(src,[st.p[0]+dx, src.pos[1], st.p[2]+dz]);
      if(o.align){ c.yaw=(src.yaw||0)+st.yaw; if(c.face==='camera') c.face='fixed'; }
      if(o.turnRnd>0.001){ c.yaw=(c.yaw||0)+rr()*o.turnRnd*Math.PI;
        if(c.face==='camera') c.face='fixed'; }
      if(o.sizeRnd>0.001){ const k=1+rr()*o.sizeRnd;
        c.height=Math.max(0.05,c.height*k); c.wscale=Math.max(0.05,(c.wscale||1)*k); }
      if(o.wideRnd>0.001) c.wscale=Math.max(0.05,(c.wscale||1)*(1+rr()*o.wideRnd));
