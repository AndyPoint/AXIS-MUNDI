<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SC3NE — build 20</title>
<style>
:root{
  --void:#101010; --surface:#1C1C1C; --line:#303030;
  --dim:#9A9A9A; --text:#F2F2F2; --accent:#FF3A1E;
  --panel:320px; --row:32px; --margin:24px; --gutter:16px; --band:72px;
  --grotesk:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,Arial,sans-serif;
}
body.chrome-dark{ --void:#0B0B0B; --surface:#161616; --line:#2A2A2A; --dim:#8A8A8A; }
body.touch{ --row:44px; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--void);color:var(--text);
  font-family:var(--grotesk);font-weight:400;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.float .glyph{font-size:15px;line-height:1;padding:0 6px;color:inherit;background:none;
  border:0;cursor:pointer;opacity:0.85}
/* On a narrow screen the wordmark and the room stepper were overlapping. The
   glyphs are the first thing to go: every one of them has a key and a panel. */
@media (max-width:560px){
  .float .glyph{display:none}
  .float .mark{font-size:11px;letter-spacing:0.18em}
}
/* Portrait on a phone: the wordmark goes first — it names the app to someone
   who already knows which app they are in. The room name stays, because it is
   the only text that says where you are. */
@media (max-width:440px), (orientation:portrait) and (max-width:820px){
  .float .mark{display:none}
  .float .ws{font-size:10px;letter-spacing:0.10em;max-width:40vw;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
}
.float .glyph.on{color:var(--accent);opacity:1}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-bottom:12px}
.kinds button{background:none;border:1px solid var(--line);color:var(--dim);
  font:10px/14px var(--grotesk);letter-spacing:0.08em;padding:10px 4px;cursor:pointer;
  text-transform:uppercase}
.kinds button.on{color:var(--accent);border-color:var(--accent);
  background:rgba(255,58,30,0.08)}
/* one band at the foot of the screen; everything else sits above it */
:root{--dock:0px}
body.dock-open{--dock:84px}
.tools{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(10px + var(--dock));z-index:30;
  display:flex;background:var(--surface);border:1px solid var(--line)}
.tools button{width:28px;height:28px;background:none;border:0;color:var(--dim);
  font-size:12px;cursor:pointer;border-right:1px solid var(--line)}
.tools button:last-child{border-right:0}
.tools button.on{color:var(--accent);background:rgba(255,58,30,0.10)}
.tools button.mode{font:8px/1 var(--grotesk);letter-spacing:0.06em;width:34px}
.item.off .nm{opacity:0.35;text-decoration:line-through}
.text-in{width:100%;box-sizing:border-box;background:var(--void);border:1px solid var(--line);
  color:var(--text);font:12px/17px var(--grotesk);padding:8px;margin-bottom:12px;resize:vertical}
body.present .float,body.present .panel,body.present .tools,
body.present .timeline,body.present #keep{display:none}
body.web .presentbar{opacity:0.18}
body.web.stir .presentbar{opacity:0.9}
/* the one thing presentation keeps: a way out, and a way through */
.presentbar{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:70;
  display:flex;align-items:center;gap:2px;background:rgba(16,16,16,0.72);
  border:1px solid rgba(255,255,255,0.14);padding:4px;opacity:0.30;
  transition:opacity 180ms ease}
.presentbar:hover,body.stir .presentbar{opacity:1}
.presentbar button{width:34px;height:30px;background:none;border:0;color:#F2F2F2;
  font-size:13px;cursor:pointer}
.presentbar button.on{color:var(--accent)}
.presentbar button.x{border-left:1px solid rgba(255,255,255,0.14)}
.presentbar .count{font:10px/1 var(--grotesk);letter-spacing:0.10em;color:#8A8A8A;
  padding:0 10px;white-space:nowrap}
.timeline{position:fixed;left:0;right:0;bottom:0;z-index:29;display:block;
  pointer-events:none}
.timeline .tab{display:none}
.timeline .shots{pointer-events:auto;height:var(--dock);box-sizing:border-box;
  display:flex;gap:1px;overflow-x:auto;align-items:center;
  background:var(--surface);border-top:1px solid var(--line);padding:0 16px}
.timeline .shots button{background:none;border:1px solid var(--line);color:var(--dim);
  font:10px/14px var(--grotesk);letter-spacing:0.06em;padding:6px 10px;white-space:nowrap;
  cursor:pointer}
.timeline .shots button.on{color:var(--accent);border-color:var(--accent)}
.timeline .shots button.add{border-style:dashed}
#ctxmenu{position:fixed;display:none;z-index:60;background:var(--surface);
  border:1px solid var(--line);min-width:180px;padding:4px 0}
#ctxmenu button{display:block;width:100%;text-align:left;background:none;border:0;
  color:var(--text);font:12px/17px var(--grotesk);padding:7px 16px;cursor:pointer}
#ctxmenu button:disabled{color:var(--line);cursor:default}
#ctxmenu button:not(:disabled):hover{color:var(--accent)}
.t-label{font-size:10px;line-height:10px;text-transform:uppercase;letter-spacing:.12em}
.note{font-size:12px;line-height:17px;color:var(--dim)}

.float{position:fixed;z-index:40;mix-blend-mode:difference;color:#fff;
  display:flex;align-items:center;gap:var(--gutter);user-select:none}
.float button{background:none;border:0;color:#fff;font-family:var(--grotesk);cursor:pointer;
  min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;padding:0}
.float button:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
#tl{top:var(--gutter);left:var(--gutter)}
#tr{top:var(--gutter);right:var(--gutter)}
.burger{flex-direction:column;gap:5px}
.burger i{display:block;width:18px;height:1px;background:#fff}
.mark{font-size:12px;line-height:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  min-width:64px!important}
.bracket{font-size:22px;line-height:22px}
.stepper{display:flex;align-items:center}
.stepper .arrow{font-size:19px;line-height:19px}
.stepper .ws{min-width:92px;text-align:center;cursor:pointer;font-size:12px;line-height:12px;
  font-weight:700;text-transform:uppercase;letter-spacing:.12em}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;
  min-width:10px;min-height:10px;margin-left:8px}
.dot.dirty{background:var(--accent)}
.dot.writing{background:var(--accent);animation:pulse 1600ms ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.dot.writing{animation:none;opacity:.5}}

/* KEEP — the one action that makes a camera out of what you see */
#keep{position:fixed;left:50%;bottom:calc(56px + var(--dock));transform:translateX(-50%);z-index:40;
  mix-blend-mode:difference;color:#fff;background:none;border:0;cursor:pointer;
  font-family:var(--grotesk);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  min-height:44px;padding:0 20px}
body.clean #keep{display:none}

.panel{position:fixed;top:0;bottom:0;width:var(--panel);max-width:86vw;background:var(--surface);
  z-index:30;display:flex;flex-direction:column;transition:transform 120ms linear}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
.panel.left{left:0;border-right:1px solid var(--line);transform:translateX(-100%)}
.panel.right{right:0;border-left:1px solid var(--line);transform:translateX(100%)}
.panel.open{transform:translateX(0)}
.band{height:var(--band);flex:none;border-bottom:1px solid var(--line)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.block{padding:var(--margin) var(--gutter);border-bottom:1px solid var(--line)}
.block > .t-label{color:var(--dim);margin-bottom:var(--gutter);display:block}
.foot{padding:var(--gutter);border-top:1px solid var(--line);color:var(--dim);
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;justify-content:space-between;min-height:var(--row);gap:var(--gutter)}
.row + .row{border-top:1px solid var(--line)}
.row .k{font-size:12px;line-height:17px}
.row .v{font-size:13px;line-height:16px;font-variant-numeric:tabular-nums;color:var(--dim);
  text-align:right;min-width:48px}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:12px;height:12px;
  border:1px solid var(--line);background:none;cursor:pointer;flex:none}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;width:118px;height:24px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:2px;height:14px;
  background:var(--accent);margin-top:-7px;border-radius:0}
input[type=range]::-moz-range-track{height:1px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:2px;height:14px;background:var(--accent);border:0;border-radius:0}
input:focus-visible{outline:1px solid var(--accent)}
.btn{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);
  color:var(--text);font-family:var(--grotesk);font-size:12px;line-height:17px;
  min-height:var(--row);cursor:pointer}
.btn:first-child{border-top:0}
.btn:hover,.btn.on{color:var(--accent)}
.seg{display:flex;gap:1px;background:var(--line);margin-bottom:var(--gutter)}
.seg button{flex:1;background:var(--surface);border:0;color:var(--dim);cursor:pointer;
  font-family:var(--grotesk);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  min-height:var(--row)}
.seg button.on{color:var(--accent)}
.mini{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  background:none;border:0;cursor:pointer;font-family:var(--grotesk);padding:0 0 0 12px}
.mini:hover{color:var(--accent)}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.lib button{background:var(--surface);height:56px;border:0;color:var(--dim);cursor:pointer;
  font-family:var(--grotesk);font-size:10px;text-transform:uppercase;letter-spacing:.12em;
  display:flex;align-items:flex-end;padding:6px;text-align:left}
.lib button:hover{color:var(--text)}
.grp{display:flex;align-items:center;gap:8px;min-height:var(--row);cursor:pointer;
  border-top:1px solid var(--line);color:var(--dim);
  font-size:10px;text-transform:uppercase;letter-spacing:.12em}
.grp .caret{width:10px;text-align:center;font-size:9px}
.grp .cnt{margin-left:auto;font-variant-numeric:tabular-nums}
.item{display:flex;align-items:center;gap:10px;min-height:var(--row);cursor:pointer;padding-left:18px}
.item .nm{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .px{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.item .dp{font-size:13px;font-variant-numeric:tabular-nums;color:var(--dim);width:52px;text-align:right}
.item.sel .nm{color:var(--accent)}
.item .inst,.item .tag{color:var(--dim);font-size:10px;letter-spacing:.08em}
.edge{position:fixed;top:0;bottom:0;width:24px;z-index:20}
body.clean #tr,body.clean .edge{display:none}
#err{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#2A0E0A;color:#FFB4A6;
  font:11px/15px ui-monospace,Menlo,monospace;padding:8px 12px;display:none;max-height:34vh;
  overflow:auto;white-space:pre-wrap;border-top:1px solid var(--accent)}
#err.on{display:block}
#repeat{position:fixed;z-index:45;background:var(--surface);border:1px solid var(--line);
  display:none;padding:10px 12px;min-width:206px}
#repeat.on{display:block}
#repeat .t-label{color:var(--dim);display:block;margin-bottom:8px}
#repeat input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);
  color:var(--text);font-family:var(--grotesk);font-size:20px;line-height:24px;font-weight:700;
  font-variant-numeric:tabular-nums;padding:0 0 4px;outline:0}
#repeat input:focus{border-bottom-color:var(--accent)}
#repeat .seg{margin:10px 0 0}
#repeat .hint{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  margin-top:8px;display:block;text-align:center}
#repeat .done{display:block;width:100%;margin-top:10px;min-height:40px;background:none;
  border:1px solid var(--accent);color:var(--accent);font-family:var(--grotesk);
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
#repeat .done:active{background:var(--accent);color:var(--surface)}
#drop{position:fixed;inset:0;z-index:25;border:1px solid var(--accent);display:none;
  pointer-events:none;background:rgba(255,58,30,0.06)}
#drop.on{display:block}
#drop::after{content:'DROP IT WHERE IT GOES';position:absolute;left:50%;top:28px;
  transform:translateX(-50%);font:10px/1 var(--grotesk);letter-spacing:0.16em;
  color:var(--accent);background:var(--surface);border:1px solid var(--accent);
  padding:8px 14px}

/* WEB — the page in front of the canvas. Transparent: it only scrolls. */
#webscroll{display:none}
#webscroll.on{display:block;position:fixed;inset:0;z-index:15;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
#webscroll.on::-webkit-scrollbar{display:none}
#webscroll .track{position:relative;width:100%}
#webscroll.snap{scroll-snap-type:y mandatory}
#webscroll.snap section{scroll-snap-align:start;scroll-snap-stop:always}
#webscroll.fly section.mark{position:absolute;left:0;width:1px;height:1px}
#webscroll.fly.settle-near{scroll-snap-type:y proximity}
#webscroll.fly.settle-always{scroll-snap-type:y mandatory}
#webscroll.fly.settle-near section.mark,#webscroll.fly.settle-always section.mark{scroll-snap-align:start}
.webpanel{position:fixed;top:0;bottom:0;width:min(420px,86vw);z-index:65;
  background:rgba(16,16,16,0.86);color:#F2F2F2;overflow-y:auto;
  -webkit-overflow-scrolling:touch;padding:72px 32px 48px;
  transition:transform 380ms cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.webpanel{transition:none}}
.webpanel.right{right:0;transform:translateX(100%)}
.webpanel.left{left:0;transform:translateX(-100%)}
.webpanel.open{transform:translateX(0)}
.webpanel h2{font:600 22px/28px var(--grotesk);margin:0 0 16px}
.webpanel p{font:15px/23px var(--grotesk);margin:0 0 16px;color:rgba(242,242,242,0.86)}
.webpanel a{color:#FF3A1E}
.webpanel .wpx{position:absolute;top:20px;background:none;border:0;color:#8A8A8A;
  font-size:14px;cursor:pointer;width:32px;height:32px}
.webpanel.right .wpx{right:16px}
.webpanel.left .wpx{left:16px}
.webtab{position:fixed;top:50%;transform:translateY(-50%);z-index:64;width:28px;height:64px;
  background:rgba(16,16,16,0.6);border:0;color:#F2F2F2;font-size:16px;cursor:pointer}
.webtab.right{right:0}
.webtab.left{left:0}

/* GAME — what is said, typed beside whoever says it */
#gamesay{position:fixed;inset:0;z-index:66;pointer-events:none}
#gamesay .cap{position:absolute;max-width:min(340px,70vw);transform:translate(-50%,-100%);
  padding:10px 14px 12px;background:rgba(10,10,10,0.72);color:#F2F2F2;
  font:15px/22px var(--grotesk);margin-top:-10px}
#gamesay .cap .who{display:block;font:10px/14px var(--grotesk);letter-spacing:0.16em;
  color:#8A8A8A;margin-bottom:4px}
#gamesay .cap.narr{left:50%!important;top:auto!important;bottom:96px;transform:translateX(-50%);
  max-width:min(560px,86vw);text-align:center;background:rgba(10,10,10,0.55)}
.kindsel{background:none;border:0;border-bottom:1px solid var(--line);color:var(--dim);
  font:10px/14px var(--grotesk);letter-spacing:.06em;max-width:86px;cursor:pointer;
  -webkit-appearance:none;appearance:none;padding:0 2px}
.kindsel:focus{outline:none;color:var(--accent);border-color:var(--accent)}
.kindsel option{background:var(--surface);color:var(--text)}

/* ── SWISS — build 105 ─────────────────────────────────────────
   One typeface, three weights of hierarchy: the room name, the
   section heading, the row. Hairlines divide; nothing is boxed.
   Explanations fold to two lines until they are asked for. */
.roomhead{padding:4px 0 20px;border-bottom:2px solid var(--text);margin-bottom:4px}
.roomhead .num{display:block;font:500 10px/14px var(--grotesk);letter-spacing:.16em;
  color:var(--dim);font-variant-numeric:tabular-nums}
.roomhead h1{font:700 28px/30px var(--grotesk);letter-spacing:-0.01em;margin:6px 0 6px;
  text-transform:uppercase;color:var(--text)}
.roomhead p{font:13px/18px var(--grotesk);color:var(--dim)}
.objhead{padding:12px 0 8px}
.objhead .on{font:600 15px/20px var(--grotesk);color:var(--text);margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block.list{padding:0;border-bottom:0}
.block.list > .grp{border-top:1px solid rgba(242,242,242,0.42);margin-top:14px;
  font:600 11px/14px var(--grotesk);letter-spacing:.12em;text-transform:uppercase;
  color:var(--text);min-height:36px}
.block.list > .grp .caret{color:var(--accent);font-size:8px}
.block.list > .grp .cnt{font-weight:400;color:var(--dim);letter-spacing:.06em;
  max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none}
.block.list.open{padding-bottom:8px}
.block.list .block.list > .grp{border-top:1px solid var(--line);margin-top:6px;font-weight:500;
  color:var(--dim)}
.sl{padding:7px 0 3px;border-top:1px solid var(--line)}
.sl .slt{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sl .k{font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .v{font-size:12px;line-height:16px;color:var(--dim);font-variant-numeric:tabular-nums;
  text-align:right;white-space:nowrap}
.sl input[type=range]{width:100%;height:22px;display:block}
.note{font-size:12px;line-height:17px;color:var(--dim);margin:6px 0 4px;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;cursor:pointer}
.note.open,body.notes-full .note{-webkit-line-clamp:unset;display:block;cursor:default}
.note:not(.open):hover{color:var(--text)}
.seg button{font:500 10px/14px var(--grotesk);letter-spacing:.1em;text-transform:uppercase;
  min-height:32px}
.btn{font-size:13px;line-height:18px}
.btn.on{font-weight:600}
.block.list:not(.open) > .grp{margin-top:0}
.block.list:not(.open) + .block.list:not(.open) > .grp{border-top-color:var(--line)}

/* NODES — build 106. The family colour is the only colour a node carries. */
.famdot{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:baseline}
.objhead b{font:600 15px/20px var(--grotesk);color:var(--text)}
.objhead span{font-size:12px;color:var(--dim)}
.seg.segwrap{flex-wrap:wrap}
.seg.segwrap button{flex:1 0 30%}
.btnrow{display:flex;gap:1px;margin:6px 0}
.btnrow .btn{flex:1;border-top:1px solid var(--line);text-align:center}
.btnrow .btn:first-child{border-top:1px solid var(--line)}
.btnrow input.kindsel{flex:1.4;max-width:none;font-size:12px}
.modrow{display:flex;align-items:flex-end;gap:8px;padding-left:12px}
.modrow .sl{flex:1}
.modrow .sl .k{color:#4C7DF0}
.modrow .mini{padding:0 0 10px}
.row.addrow{cursor:pointer;align-items:baseline;padding:6px 0}
.row.addrow .k{font-weight:600;white-space:nowrap}
.row.addrow .v{font-size:11px;line-height:15px;text-align:right}
.row.addrow:hover .k{color:var(--accent)}
.row.chk{justify-content:flex-start;cursor:pointer}
input.findnode{display:block;width:100%;max-width:none;font-size:13px;line-height:20px;
  padding:8px 0;margin-top:14px;color:var(--text)}
body.graph-open #keep{display:none}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="drop"></div>
<div id="err"></div>
<div id="repeat">
  <span class="t-label">Copies</span>
  <input type="text" inputmode="numeric" autocomplete="off" spellcheck="false">
  <div class="seg">
    <button data-style="linear">Repeat</button>
    <button data-style="between">Between</button>
    <button data-style="radial">Radial</button>
  </div>
  <button class="done">Done</button>
  <span class="hint">or tap the scene to finish</span>
</div>
<div class="edge" id="edgeL"></div>
<div class="edge" id="edgeR"></div>
<div id="ui"></div>
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
(function(){
'use strict';
const h=React.createElement;

const V={

// rebuild the blob with a real type, and let the decoder decide.
const MIME={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',
  webp:'image/webp',bmp:'image/bmp',avif:'image/avif',heic:'image/heic',
  svg:'image/svg+xml',tif:'image/tiff',tiff:'image/tiff'};
const UNSUPPORTED={psd:'PSD',pdf:'PDF',ai:'AI',eps:'EPS'};
const IMAGE_EXT=Object.keys(MIME);
async function loadImageFile(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(UNSUPPORTED[ext]) throw new Error(UNSUPPORTED[ext]+' needs a reader');
  if(!IMAGE_EXT.includes(ext)&&!/^image\//.test(file.type||''))
    throw new Error('not an image');
  // Read the bytes rather than handing the File straight to an <img>. A file
  // that lives in iCloud and has not been downloaded yields an empty read, and
  // this is where that shows up as a clear failure instead of a silent one.
  let buf;
  try{ buf=await file.arrayBuffer(); }
  catch(err){ throw new Error('could not be read from storage'); }
  if(!buf||buf.byteLength<16) throw new Error('empty — not downloaded from iCloud?');
  const type=(file.type&&file.type.startsWith('image/'))?file.type:(MIME[ext]||'image/png');
  const blob=new Blob([buf],{type});
  if(self.createImageBitmap&&ext!=='svg'){
    try{ return await createImageBitmap(blob); }catch(err){ /* fall through */ }
  }
  const url=URL.createObjectURL(blob);
  try{
    return await new Promise((res,rej)=>{
      const img=new Image();
      img.onload=()=>{
        if(!img.width||!img.height){          // an SVG with no intrinsic size
          const c=cnv(1024,1024);
          c.getContext('2d').drawImage(img,0,0,1024,1024);
          res(c); return;
        }
        res(img);
      };
      img.onerror=()=>rej(new Error('the decoder refused it'));
      img.src=url;
    });
  } finally { setTimeout(()=>URL.revokeObjectURL(url),2000); }
}
/* ══ SEQUENCES — time on a plane ═══════════════════════════

   how a crowd is made here rather than with a timeline.

function seqTick(dt){

function frameCanvas(img,cap){

function addSequence(imgs,name,group){

  let frames=kept.map(im=>frameCanvas(im));

  tween={a:camNow(),b:s,t0:performance.now(),d:Math.max(120,(secs===undefined?moveOf(s):secs)*1000)};
  S.shotSel=s.id; animCheck(); bump();
}
function tweenTick(now){
  if(!tween) return false;
  const u=clamp((now-tween.t0)/tween.d,0,1);
  const t=S.play.ease?easeIO(u):u, a=tween.a, b=tween.b;
  S.cam.tgt=[0,1,2].map(i=>a.tgt[i]+(b.tgt[i]-a.tgt[i])*t);
  S.cam.dist=a.dist+(b.dist-a.dist)*t;
  S.cam.az=lerpAng(a.az,b.az,t);
  S.cam.el=a.el+(b.el-a.el)*t;
  S.cam.lens=a.lens+(b.lens-a.lens)*t;
  if(u>=1){ applyShotState(b); S.aspect=b.aspect||S.aspect; tween=null; markDirty(); bump();
    gameArrive(); }
  return true;
}
// Where we are in the deck: whatever is playing, else whatever is selected.
function slideIndex(){
  const cur=(S.play.on&&S.play.showing)||S.shots.find(q=>q.id===S.shotSel);
  const i=S.shots.indexOf(cur);
  return i<0?0:i;
}
function stepSlide(d){
  if(!S.shots.length) return;
  if(webActive()){ webStep(d); return; }         // the page owns the order there
  if(S.play.on){ S.play.on=false; }              // stepping takes over from the run
  const n=S.shots.length;
  const i=(slideIndex()+d+n)%n;
  // chosen in WEB: a step takes as long as its distance asks, not the slide's time
  const byGap=S.web&&S.web.scroll==='step'&&S.web.timing==='distance';
  tweenTo(S.shots[i],byGap?flightTime(camNow(),S.shots[i]):undefined);
  hint((i+1)+' / '+n);

function presentToggle(on){
  S.present=on===undefined?!S.present:!!on;
  if(S.present) gameStart(); else gameClear();       // each presentation is a new game
  if(S.present){
    S.mini=false;
    if(S.shots.length) tweenTo(S.shots[slideIndex()],0.4);
  } else if(S.play.on) { S.play.on=false; }
  animCheck(); draw(); bump();
}
function playToggle(){
  const P=S.play;
  if(P.on){ P.on=false; }
  else {
    if(S.shots.length<2){ hint('need two views'); return; }
    P.on=true; P.i=0; P.t0=performance.now();

// DRAW A SURFACE — the rectangle you sweep on screen becomes a card standing in
// the world. Its foot sits where the bottom edge meets the ground, and its size
// in metres is whatever makes it cover exactly that rectangle from here. Lock
// the angle and it stays upright, so verticals stay vertical; unlock it and it
// leans back to face the camera square on.
// UPRIGHT keeps verticals vertical — architecture, and the safe default.
// VIEW lays the card parallel to the screen, so what you draw is what you see
// from here and nowhere else. That second mode is the 3D illusion: a shape
// caught at the angle you were standing.
function viewLean(yaw,b){
  const cu=b.up, f=[Math.sin(yaw),0,Math.cos(yaw)];
  let p=Math.atan2(Math.hypot(cu[0],cu[2]),cu[1]);

}
function surfaceFromRect(x0,y0,x1,y1,assetId,lock){
  const vp=vpAt((x0+x1)/2)||viewports()[0];
  const L=Math.min(x0,x1), R=Math.max(x0,x1), T=Math.min(y0,y1), B=Math.max(y0,y1);
  if(R-L<12||B-T<12) return null;
  const eye=vp.b.eye;
  // UPRIGHT stands on the ground, so it needs a ground hit. VIEW hangs in space
  // at a depth of its own, so it works against the sky too — and that is what
  // makes it a different tool rather than the same one at a shallow angle.
  let foot=surfaceAt((L+R)/2,B,vp)||rayPlane((L+R)/2,B,vp,0);
  if(S.drawMode==='view'){
    const mid=surfaceAt((L+R)/2,(T+B)/2,vp);
    const dd=mid?distTo(mid,eye):S.cam.dist*(S.drawDepth||1);
    const dir=rayDir((L+R)/2,(T+B)/2,vp);
    foot=[eye[0]+dir[0]*dd,eye[1]+dir[1]*dd,eye[2]+dir[2]*dd];
  }
  if(!foot) return null;
  const d=Math.max(0.5,distTo(foot,eye));
  const mPerPx=2*vp.tan*d/vp.h;              // metres covered by one pixel at that depth
  const hM=Math.max(0.05,(B-T)*mPerPx);
  const wM=Math.max(0.05,(R-L)*mPerPx);
  const a=S.assets.get(assetId)||A('blank');
  const l=addLayer(a.id,[foot[0],foot[1],foot[2]],{height:hM});
  // An upright surface can be a fixed wall or a card that turns to face the
  // camera; the pill on the tool strip says which, and it is asked before the
  // sweep rather than corrected afterwards.
  l.face=(S.drawMode!=='view'&&S.drawFace==='camera')?'camera':'free';
  l.yaw=Math.atan2(-vp.b.right[2],vp.b.right[0]);   // card's right = camera's right
  l.pitch=(S.drawMode==='view')?viewLean(l.yaw,vp.b):0;
  if(S.drawMode==='view'){
    // A card is drawn from its foot upward. `foot` here is the centre of what
    // you swept, so step back down along the card's own up vector to find where
    // its base must sit for the card to cover the rectangle.
    const up=faceBasis(l,vp).up;
    l.pos=[foot[0]-up[0]*hM/2, foot[1]-up[1]*hM/2, foot[2]-up[2]*hM/2];
    l.floats=true;                          // it hangs where it was drawn

}

    if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0];
    if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1];

// Draw the strokes into a canvas, in the canvas's own space.

      continue;

    // own stroke with its own width.
    for(let i=1;i<p.length;i++){

      const k=style.taper?Math.sin(Math.PI*clamp(t*1.0,0,1))*0.55+0.45:1;
      g.lineWidth=Math.max(0.7,st.w*scale*k);

      g.lineTo((p[i][0]-b.x0)*scale,(p[i][1]-b.y0)*scale);

  const cx=(b.x0+b.x1)/2, cy=(b.y0+b.y1)/2;

    : surfaceAt(cx,cy,vp);

  const mPerPx=2*vp.tan*d/vp.h;

  const a=addAsset('ink',c,'ink',false,'Drawn');

  const l=addLayer(a.id,[mid[0],mid[1],mid[2]],{height:hM});

  l.yaw=Math.atan2(-vp.b.right[2],vp.b.right[0]);

  if(upright&&hit){

const CH=['rgb','r','g','b'];

// Catmull-Rom through the control points, clamped and monotone in x.
function curveAt(pts,x){
  const p=pts.slice().sort((a,b)=>a[0]-b[0]);

  if(x>=p[p.length-1][0]) return p[p.length-1][1];
  let i=0; while(i<p.length-2&&x>p[i+1][0]) i++;

    (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);

  COOL:   {r:[[0,0],[0.5,0.45],[1,0.95]],g:[[0,0],[0.5,0.50],[1,1]],

  WARM:   {r:[[0,0.04],[0.5,0.58],[1,1]],g:[[0,0],[0.5,0.51],[1,1]],

// One row of 256 samples. Levels first, then the master curve, then per channel,
// then whatever preset or loaded table sits on top.

  for(let i=0;i<256;i++){

    const v=[curveAt(S.curve.r,m),curveAt(S.curve.g,m),curveAt(S.curve.b,m)];

        for(let k=0;k<passes;k++){
          const t=passes>1?(k/(passes-1)-0.5)*2:0;
          const p=[foot[0]+perp[0]*t*spread+away[0]*Math.abs(t)*spread*0.6,
                   foot[1],
                   foot[2]+perp[2]*t*spread+away[2]*Math.abs(t)*spread*0.6];
          quad(vp.m,p,perp,away,[sz[0]*(1+Math.abs(t)*0.06),sz[1]],shTexUse,
            Object.assign({},o,{alpha:o.alpha/passes}));
        }
      };
      // a matted card casts the shadow of what is left of it
      const shCtl=shape?ctl:null;
      if(bk&&bk.shadowsOnly){                  // its own plate, composited as multiply
        drawSh({flat:true,tint:[shCol[0],shCol[1],shCol[2]],alpha:sa,ctl:shCtl});
      } else {
        gl.blendFunc(gl.ZERO,gl.SRC_COLOR);     // multiply — nothing can lighten
        drawSh({shadow:shCol,alpha:sa,ctl:shCtl});
        gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
      }
    }
    if(bk&&bk.shadowsOnly) continue;
    {
      const ch=chains()[groupOf(l)]||{exposure:1,contrast:1,saturation:1,fogMul:1,fogLift:0,tint:[1,1,1],tintAmt:0,opacity:1};
      gl.uniform3f(uQ.uGrade,S.exposure*ch.exposure,S.contrast*ch.contrast,S.saturation*ch.saturation);
      let tn=ch.tintAmt>0.01
        ?[1-ch.tintAmt+ch.tintAmt*ch.tint[0],1-ch.tintAmt+ch.tintAmt*ch.tint[1],
          1-ch.tintAmt+ch.tintAmt*ch.tint[2]]:null;
      if(l.ntint) tn=(tn||[1,1,1]).map((v,i)=>v*l.ntint[i]);
      // A crossed card is the same picture twice at a right angle. For a tree
      // seen from anywhere it holds up better than facing the camera, because
      // nothing ever swings.
      if(l.cross&&!isPlane(l)){
        const r2=[-right[2],0,right[0]];
        quad(vp.m,l.pos,r2,up,[wdt,l.height],tex,
          {fog:clamp(fogAmt(d)*ch.fogMul+ch.fogLift,0,1),tint:l.solid?[0,0,0]:tn,
           flat:!!l.solid,
           alpha:(l.opacity===undefined?1:l.opacity)*(ch.opacity===undefined?1:ch.opacity),
           opaque:l.useAlpha===false, uv:l.uv, ctl});
      }
      if(l.solid){
        // flat black, straight through: no ambient, no fog, no grade
        quad(vp.m,l.pos,right,up,[wdt,l.height],tex,
          {flat:true,tint:[0,0,0],
           alpha:(l.opacity===undefined?1:l.opacity),
           opaque:l.useAlpha===false, uv:l.uv, ctl});
      } else
      quad(vp.m,l.pos,right,up,[wdt,l.height],tex,
        {fog:clamp(fogAmt(d)*ch.fogMul+ch.fogLift,0,1),tint:tn,
         alpha:(l.opacity===undefined?1:l.opacity)*(ch.opacity===undefined?1:ch.opacity),
         opaque:l.useAlpha===false, uv:l.uv, ctl});
      gl.uniform3f(uQ.uGrade,S.exposure,S.contrast,S.saturation);
    }
  }

  /* ══ REFLECTIONS ═════════════════════════════════════════
     A mirrored copy, not a simulation. The card is drawn again
     upside down below the surface, faint and wobbling — which is
     what a reflection looks like, and costs one more quad. Because
     it is a copy rather than an optical effect it can disagree
     with its original: run late, run backwards, or show a
     different frame entirely.
  ──────────────────────────────────────────────────────────── */
  if(!depthMode&&!bk){
    for(const {l:pl} of order){
      if(!isPlane(pl)||!pl.reflect||!pl.reflect.on) continue;
      const R=pl.reflect, py=pl.pos[1];
      const passes=1+Math.round((R.blur||0)*3);
      for(const {l,d} of order){
        if(l===pl||isPlane(l)||isQuad(l)||l.atmos||l.glow||l.hidden) continue;
        if(l.pos[1]<py-0.2) continue;               // it is under the surface
        const a=S.assets.get(l.assetId); if(!a) continue;
        // the reflection may be at a different moment than the thing itself
        let rtex;
        if(isSeq(a)){
          const keep=l.anim, off=(keep&&keep.offset)||0;
          l.anim=Object.assign({},keep||newAnim(),
            {offset:off+(R.tOffset||0),rev:R.rev?!(keep&&keep.rev):(keep&&keep.rev)});
          rtex=seqTex(a,seqFrame(a,l));
          l.anim=keep;
        } else rtex=a.tex;
        if(!rtex) continue;
        const wdt=widthOf(l,a);
        const {right,up}=faceBasis(l,vp);
        const drop=Math.max(0,l.pos[1]-py);
        const fade=clamp(1-(drop/Math.max(0.5,l.height*2))*(R.fade||0),0,1);
        const wob=(R.wob||0)*0.12*l.height;
        for(let k=0;k<passes;k++){
          const t=passes>1?(k/(passes-1)-0.5)*2:0;
          const sway=Math.sin(T*(R.speed||0.6)*2+l.pos[2]*0.6+k)*wob;
          const p=[l.pos[0]+sway+right[0]*t*wob*2,
                   2*py-l.pos[1],
                   l.pos[2]+right[2]*t*wob*2];
          quad(vp.m,p,right,[-up[0],-up[1],-up[2]],[wdt,l.height],rtex,
            {fog:clamp(fogAmt(d)*0.7,0,1),
             alpha:(R.amount===undefined?0.35:R.amount)*fade/passes,
             opaque:l.useAlpha===false, uv:l.uv, ctl:ykbOf(l)});
        }
      }
    }
  }
  if(!depthMode && (!bk||bk.weather) && (S.emit||[]).length){
    gl.useProgram(pP); gl.bindVertexArray(vaoQ);
    gl.uniformMatrix4fv(uP.uVP,false,vp.m);
    gl.uniform3f(uP.uEye,eye[0],eye[1],eye[2]);
    gl.uniform3f(uP.uRight,vp.b.right[0],vp.b.right[1],vp.b.right[2]);
    gl.uniform3f(uP.uUp,vp.b.up[0],vp.b.up[1],vp.b.up[2]);
    gl.uniform1f(uP.uTime,T);
    for(const em of S.emit){
      const d=PKINDS[em.kind]||PKINDS.SNOW;
      const t=particleTex(em.kind); if(!t) continue;
      const N=Math.round(60+em.amount*3500);
      gl.uniform1f(uP.uSpread,d.spread||70);
      gl.uniform1f(uP.uFall,(d.fall||1)*(1+em.wind*0.2));
      gl.uniform1f(uP.uSize,(d.size||0.3)*em.size);
      gl.uniform1f(uP.uWind,em.wind);
      gl.uniform1f(uP.uMotion,d.motion||0);
      gl.uniform1f(uP.uSpin,d.spin||0);
      gl.uniform1f(uP.uStretch,d.stretch||1);
      gl.uniform2f(uP.uAtlas,t.atlas[0],t.atlas[1]);
      gl.uniform1f(uP.uOwnCol,em.kind==='SWARM'?1:(d.own||0));
      const col=(d.motion||0)>=2?[e.fog[0],e.fog[1],e.fog[2]]:[0.92,0.95,1.0];
      gl.uniform3f(uP.uCol,col[0],col[1],col[2]);
      gl.uniform1f(uP.uAlpha,d.alpha===undefined?0.6:d.alpha);
      if(d.add) gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,t.tex);
      gl.uniform1i(uP.uTex,0);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,N);
      if(d.add) gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    }
    gl.useProgram(pQ); gl.bindVertexArray(vaoQ);
    uniformsChanged();
  }
  gl.disable(gl.SCISSOR_TEST);
}
function draw(){ try{ graphEnsure(); draw_(); drawNodes(); }catch(err){ showErr('draw: '+((err&&err.message)||err)+
    (err&&err.stack?'\n'+String(err.stack).split('\n')[1]:'')); } }
function draw_(){
  if(!gl) return;
  if(envDirty){ upload(envTex,envCanvas(),false); envDirty=false; }
  syncLut();
  syncTextures();
  gl.disable(gl.SCISSOR_TEST);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  const v=VIEWS[S.view], vps=viewports();
  if(inPaint()){ overlay(); return; }        // the bake is the picture here
  if(v==='PLAN'||v==='SIDE'||S.big){
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); overlay(); return;
  }
  if(v!=='PLAN'&&v!=='SIDE'){
    // no grid, markers or camera frames in presentation — that is the audience's view
    pass(vps[0],S.idView?2:S.depthView,(v==='OPEN'||v==='SPLIT'||v==='TRIPLE')&&!S.present,null);
    if(vps[1]) pass(vps[1],false,false);
  }
  overlay();
}
let raf=null;
let midiT=0;
function animate(){
  T+=0.016;

  graphTick(0.016);
  if(S.midi&&S.midi.role==='master'&&++midiT>=Math.max(1,Math.round(60/(S.midi.rate||12)))){
    midiT=0; bridgeTick();
  }
  const nowMs=performance.now();
  const tw=tweenTick(nowMs);
  const wc=webTick();
  if(!tw&&S.play&&S.play.on) playTick(nowMs);
  const px=parallaxOn()&&parallaxTick();
  draw();
  if(px&&!raf){ raf=requestAnimationFrame(animate); return; }
  raf=((S.emit||[]).length||(S.play&&S.play.on)||parallaxOn()||tween||seqPlaying()||
    rippling()||wc||gameBusy()||graphLive()||GREC.on)?requestAnimationFrame(animate):null;
}
const rippling=()=>S.layers.some(l=>isPlane(l)&&l.reflect&&l.reflect.on&&
  (l.reflect.wob||0)>0.001&&(l.reflect.speed||0)>0.001);
const seqPlaying=()=>S.layers.some(l=>{
  const a=S.assets.get(l.assetId);
  return isSeq(a)&&(!l.anim||l.anim.play!==false);
});
function animCheck(){
  if(((S.emit||[]).length||(S.play&&S.play.on)||parallaxOn()||tween||seqPlaying()||
    rippling()||webChasing()||gameBusy()||graphLive()||GREC.on)&&!raf) raf=requestAnimationFrame(animate);
}

/* ══ OVERLAY ══════════════════════════════════════════════ */
// Right-click menu. Desktop only in practice; it is the same set of actions the
// gestures reach on the iPad.
// A word in the corner, long enough to read and gone before it annoys.
let hintMsg='', hintT=null;
function hint(t){
  hintMsg=t; clearTimeout(hintT);
  hintT=setTimeout(()=>{ hintMsg=''; draw(); },900);
  draw();
}
const menuEl=document.createElement('div');
menuEl.id='ctxmenu';
document.body.appendChild(menuEl);
function closeMenu(){ menuEl.style.display='none'; }
function openMenu(x,y){
  const l=S.layers.find(q=>q.id===S.sel);
  const items=[
    ['Undo',()=>undo(),canUndo()],
    ['Redo',()=>redo(),canRedo()],
    ['Frame all',()=>frameAll(),true],
    ['Keep this view',()=>{keepShot();draw();bump();},true],
    ['Duplicate',()=>{duplicate();draw();bump();},!!l],
    ['Drop to surface',()=>{snap(true);dropToSurface(l);draw();bump();},!!l&&!isPlane(l)],
    ['Delete',()=>{deleteSelection();},!!l||(S.multi||[]).length>0]

window.addEventListener('pointerdown',e=>{ if(!menuEl.contains(e.target)) closeMenu(); },true);
const ov=document.createElement('canvas');
ov.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:10;pointer-events:none';
document.body.appendChild(ov);
const octx=ov.getContext('2d');
function drawTouchDbg(){
  if(!S.dbg) return;
  octx.save(); octx.setTransform(DPR,0,0,DPR,0,0);
  octx.globalCompositeOperation='source-over';
  octx.font='10px -apple-system,Helvetica,Arial'; octx.fillStyle='#8A8A8A';
  octx.fillText('touch: '+S.dbg,24,Hh-40);
  octx.restore();
}
// A slide's title and subtitle, drawn on the overlay so they take no layer and
// leave no trace in the scene. They fade with the leg, so a cut lands with the
// camera rather than after it.
function drawSlideText(){
  const P=S.play;
  const s=(P.on&&P.showing)||S.shots.find(q=>q.id===S.shotSel);
  if(!s||(!s.title&&!s.sub)) return;
  if(!S.present&&!P.on) return;
  octx.save(); octx.setTransform(DPR,0,0,DPR,0,0);
  octx.globalCompositeOperation='source-over';
  const m=Math.max(28,Math.min(64,W*0.05));
  let y=Hh-m-(s.sub?46:16);
  if(s.title){
    octx.font='600 '+Math.round(Math.max(20,Math.min(34,W*0.024)))+
      'px -apple-system,Helvetica,Arial';
    octx.fillStyle='rgba(0,0,0,0.45)'; octx.fillText(s.title,m+1,y+1);
    octx.fillStyle='#FFFFFF'; octx.fillText(s.title,m,y);
    y+=30;
  }
  if(s.sub){
    octx.font='14px -apple-system,Helvetica,Arial';
    octx.fillStyle='rgba(0,0,0,0.45)'; octx.fillText(s.sub,m+1,y+1);
    octx.fillStyle='rgba(255,255,255,0.78)'; octx.fillText(s.sub,m,y);
  }
  if(S.present&&S.shots.length){
    const i=S.shots.indexOf(s)+1;
    octx.font='11px -apple-system,Helvetica,Arial';
    octx.fillStyle='rgba(255,255,255,0.55)';

function drawHint(){
  if(!hintMsg) return;
  octx.save(); octx.setTransform(DPR,0,0,DPR,0,0);
  octx.globalCompositeOperation='source-over';
  octx.font='12px -apple-system,Helvetica,Arial'; octx.fillStyle='#FF3A1E';
  octx.fillText(hintMsg.toUpperCase(),24,Hh-24);
  octx.restore();
}
function overlay(){
  if(ov.width!==cv.width||ov.height!==cv.height){ov.width=cv.width;ov.height=cv.height;}
  octx.setTransform(DPR,0,0,DPR,0,0); octx.clearRect(0,0,W,Hh);
  gameCaptionsTick();
  if(inPaint()){
    ov.style.mixBlendMode='normal';
    octx.fillStyle='#0B0B0B'; octx.fillRect(0,0,W,Hh);
    drawPlates(octx);
    const f=paintView();
    octx.strokeStyle='rgba(255,255,255,0.25)'; octx.lineWidth=1;
    octx.strokeRect(f.x+0.5,f.y+0.5,f.w-1,f.h-1);
    octx.fillStyle='#8A8A8A'; octx.font='10px -apple-system,Helvetica,Arial';
    octx.fillText('PAINT — '+(S.plateSel||'')+'   · '+Math.round((S.pview.z||1)*100)+'%'+
      '   · two fingers to zoom and pan',
      Math.max(8,f.x),Math.max(14,f.y-8));
    drawHint();
    return;
  }
  const vNow=VIEWS[S.view];
  if(vNow==='PLAN'||vNow==='SIDE'||S.big){     // a schematic fills the screen, opaque
    ov.style.mixBlendMode='normal';
    octx.fillStyle='#0B0B0B'; octx.fillRect(0,0,W,Hh);
    drawMini();

    return;
  }
  ov.style.mixBlendMode='difference';
  // Presentation is the audience's view: the words of the slide and nothing of
  // the editor — no gizmo, outlines, markers or frames.
  if(S.present){ drawSlideText(); drawHint(); return; }
  const v=VIEWS[S.view], vps=viewports();
  // the frame — the image inside the room
  if(v==='TRIPLE'){
    const vp=vps[0];
    octx.strokeStyle='rgba(255,255,255,0.75)'; octx.lineWidth=1;
    octx.strokeRect(Math.round(vp.x)+0.5,Math.round(vp.y)+0.5,Math.round(vp.w),Math.round(vp.h));
  }
  if((v==='OPEN'||v==='SPLIT')&&(S.showFrame||WS[S.ws]==='CAMERA')){
    const vp=vps[0], r=frameRect(vp.w,vp.h,S.aspect,S.over);
    octx.save();
    octx.fillStyle='rgba(11,11,11,0.55)';
    octx.beginPath();
    octx.rect(vp.x,vp.y,vp.w,vp.h);
    octx.rect(vp.x+r[0],vp.y+r[1],r[2],r[3]);
    octx.fill('evenodd');
    octx.strokeStyle='rgba(255,255,255,0.75)'; octx.lineWidth=1;
    octx.strokeRect(Math.round(vp.x+r[0])+0.5,Math.round(vp.y+r[1])+0.5,Math.round(r[2]),Math.round(r[3]));
    octx.restore();
  }
  const sel=S.layers.find(x=>x.id===S.sel);
  octx.save(); octx.globalCompositeOperation='difference';
  for(const vp of vps){
    if(sel&&VIEWS[S.view]!=='PLAN'&&VIEWS[S.view]!=='SIDE'){
      const a=S.assets.get(sel.assetId),wdt=a?widthOf(sel,a):sel.height;
      // the card's own frame, whichever way it faces — a lying plane used to get
      // the outline of a card standing up on its near edge
      const C4=cornersOf(sel,vp);
      const pts=[C4[3],C4[2],C4[1],C4[0]].map(q=>project(vp.m,q,vp.w,vp.h));
      if(pts.every(Boolean)){

        octx.globalAlpha=(l.id===S.sel||picked)?1:0.45;
        octx.fillRect(p[0]+vp.x-s/2,p[1]+vp.y-s/2,s,s);
        // the middle of the thing, not just where it stands — what you actually
        // line up against when placing one object beside another
        if(S.centres!==false&&!l.hidden&&!(isQuad(l)&&(l.ground||l.recipe))&&!l.node){
          const a=S.assets.get(l.assetId);
          if(a){
            const {up}=faceBasis(l,vp);
            const q=project(vp.m,V.add(l.pos,V.mul(up,l.height/2)),vp.w,vp.h);
            if(q){
              const x=q[0]+vp.x, y=q[1]+vp.y, r=picked||l.id===S.sel?4:2.5;

              octx.moveTo(x,y-r); octx.lineTo(x,y+r);

    octx.beginPath();octx.moveTo(Math.round(W/2)+0.5,0);octx.lineTo(Math.round(W/2)+0.5,Hh);octx.stroke();
  }
  if(S.mini||['TRIPLE','PLAN','SIDE'].includes(VIEWS[S.view])) drawMini();
  inferenceLine();
  if(FLATVIEW()) drawGizmoFlat();
  else { drawGizmo(); if(S.mini&&S.gizR) drawGizmoFlat(); }
  drawCornerHandles();
  drawSlideText();
  ykbOverlay();
  drawTouchDbg();
  if(S.drawPath){
    octx.fillStyle='#C9A227'; octx.font='10px -apple-system,Helvetica,Arial';
    octx.fillText('DRAW A PATH — drag across the ground',24,60);
  }
  if(S.drawSurf&&!S.drawRect){
    const vp0=viewports()[0];
    const lean=Math.round(viewLean(Math.atan2(-vp0.b.right[2],vp0.b.right[0]),vp0.b));
    octx.fillStyle='#C9A227'; octx.font='10px -apple-system,Helvetica,Arial';
    octx.fillText(S.drawMode==='view'
      ? ('DRAW VIEW — the card will lean '+lean+'° from this camera'+

  }
  if(S.outlines!==false){
    const vp=viewports()[0];
    for(const l of S.layers){
      if(l.face!=='free'&&l.face!=='fixed'&&!isQuad(l)) continue;
      if(l.hidden) continue;
      if(((isQuad(l)&&(l.ground||l.recipe))||l.node)&&l.id!==S.sel) continue;   // a landscape or a building is outlined by its own edges
      const a=S.assets.get(l.assetId); if(!a) continue;
      const C4=cornersOf(l,vp);
      const c=[C4[3],C4[2],C4[1],C4[0]].map(q=>project(vp.m,q,vp.w,vp.h));
      if(!c.every(Boolean)) continue;
      const sel=l.id===S.sel;
      octx.strokeStyle=sel?'#FF3A1E':'rgba(255,255,255,0.30)';
      octx.lineWidth=sel?2:1;
      octx.beginPath();
      c.forEach((q,i)=>{ const x=q[0]+vp.x,y=q[1]+vp.y;
        i?octx.lineTo(x,y):octx.moveTo(x,y); });
      octx.closePath(); octx.stroke();
    }
    octx.lineWidth=1;
  }
  if(S.inkOn){
    const st=S.ink.strokes;
    octx.save();
    octx.strokeStyle=S.ink.colour; octx.lineCap='round'; octx.lineJoin='round';
    for(const s of st){
      if(s.pts.length<2) continue;
      octx.lineWidth=s.w;
      octx.beginPath();
      s.pts.forEach((p,i)=>i?octx.lineTo(p[0],p[1]):octx.moveTo(p[0],p[1]));
      octx.stroke();
    }
    octx.restore();
    octx.fillStyle='#C9A227'; octx.font='10px -apple-system,Helvetica,Arial';
    octx.fillText(st.length
      ? ('DRAWING — '+st.length+' stroke'+(st.length>1?'s':'')+
         (S.ink.once===false?'   · press DONE to place it':''))
      : ('DRAW A LINE — it becomes a card facing '+
         (S.drawMode==='view'?'the view':'upright')),24,60);
  }
  if(S.snapHit&&drag){
    const vp=viewports()[0];
    const q=project(vp.m,[S.snapHit[0],0,S.snapHit[1]],vp.w,vp.h);
    if(q){
      const x=q[0]+vp.x,y=q[1]+vp.y;
      octx.save(); octx.strokeStyle='#4CC38A'; octx.lineWidth=1.5;
      octx.beginPath();
      octx.moveTo(x-7,y); octx.lineTo(x+7,y);
      octx.moveTo(x,y-7); octx.lineTo(x,y+7);
      octx.stroke();
      octx.beginPath(); octx.arc(x,y,4,0,6.284); octx.stroke();
      octx.restore();
    }
  }
  if(S.band){
    const [x0,y0,x1,y1]=S.band, crossing=x1<x0;
    octx.save();
    octx.strokeStyle=crossing?'#C9A227':'#FF3A1E';
    octx.setLineDash(crossing?[5,4]:[]);
    octx.lineWidth=1;
    octx.strokeRect(Math.min(x0,x1)+0.5,Math.min(y0,y1)+0.5,
      Math.abs(x1-x0),Math.abs(y1-y0));
    octx.fillStyle=crossing?'rgba(201,162,39,0.08)':'rgba(255,58,30,0.07)';
    octx.fillRect(Math.min(x0,x1),Math.min(y0,y1),Math.abs(x1-x0),Math.abs(y1-y0));
    octx.restore();
    octx.fillStyle='#8A8A8A'; octx.font='10px -apple-system,Helvetica,Arial';
    octx.fillText((crossing?'TOUCHING':'FULLY INSIDE')+
      '  ·  '+((S.bandHit||[]).length),
      Math.min(x0,x1),Math.min(y0,y1)-6);
  }
  if(S.drawRect){
    const [a,b,c,d]=S.drawRect;
    octx.strokeStyle='#FF3A1E'; octx.lineWidth=1.5;
    octx.strokeRect(Math.min(a,c),Math.min(b,d),Math.abs(c-a),Math.abs(d-b));
    octx.fillStyle='#8A8A8A'; octx.font='10px -apple-system,Helvetica,Arial';
    const vp0=viewports()[0];
    const lean=S.drawMode==='view'
      ? Math.round(viewLean(Math.atan2(-vp0.b.right[2],vp0.b.right[0]),vp0.b))
      : 0;
    octx.fillText((S.drawMode==='view'?'VIEW PLANE · lean '+lean+'°':'UPRIGHT')+
      (S.drawMode==='view'&&Math.abs(lean)<6
        ? '   (level with the horizon — tilt the camera to see the difference)':''),
      Math.min(a,c),Math.min(b,d)-6);
  }
  drawHint();
}

/* ══ PLAN & SIDE — schematic placement views ══════════════ */
function sceneBounds(){
  const e=basisOf(S.cam).eye;
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9,y1=6;
  const pts=[];
  for(const l of S.layers){
    if(isQuad(l)){ pts.push(...quadCorners(l)); continue; }
    if(isPlane(l)){
      const a=S.assets.get(l.assetId), wdt=a?widthOf(l,a):l.height;
      const t=(l.tilt||0)*Math.PI/180, c=Math.cos(t);
      const rt=[Math.cos(l.yaw),0,-Math.sin(l.yaw)];
      const up=[Math.sin(l.yaw)*c,Math.sin(t),Math.cos(l.yaw)*c];
      for(const [u,v] of [[-0.5,0],[0.5,0],[0.5,1],[-0.5,1]])
        pts.push([l.pos[0]+rt[0]*u*wdt+up[0]*v*l.height,
                  l.pos[1]+up[1]*v*l.height,
                  l.pos[2]+rt[2]*u*wdt+up[2]*v*l.height]);
    } else pts.push([l.pos[0],l.pos[1]+l.height,l.pos[2]]);
  }
  // The camera used to be part of this. Orbit far enough out and the schematic
  // fitted to the camera instead of the scene — hence the kilometre scales.
  if(!pts.length) pts.push(e,S.cam.tgt);
  for(const p of pts){
    x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]);
    z0=Math.min(z0,p[2]); z1=Math.max(z1,p[2]);
    y1=Math.max(y1,p[1]);
  }
  if(x0>x1){x0=-10;x1=10;z0=-10;z1=10;}
  const px=(x1-x0)*0.12+4, pz=(z1-z0)*0.12+4;
  return {x0:x0-px,x1:x1+px,z0:z0-pz,z1:z1+pz,y1:y1*1.12+2};
}
// How much of the screen the views dock is holding. One number, read by
// everything that sits at the foot of the screen.
const DOCK=()=>S.timeline?(S.dockH||84):0;
function miniRects(){
  const v=VIEWS[S.view];
  if(v==='PLAN') return [{id:'top',x:0,y:0,w:W,h:Hh,big:true,full:true}];
  if(v==='SIDE') return [{id:'side',x:0,y:0,w:W,h:Hh,big:true,full:true}];
  if(v==='TRIPLE'){
    const x=Math.round(W*0.62)+1, w=W-x-8, hh=Math.round((Hh-24)/2);
    return [{id:'top',x,y:8,w,h:hh,big:true},{id:'side',x,y:hh+16,w,h:hh,big:true}];
  }
  if(S.big) return [{id:S.big,x:0,y:0,w:W,h:Hh,big:true,full:true}];
  const w=Math.min(240,Math.max(148,W*0.2)), hh=Math.round(w*0.62), m=16;
  const by=Hh-m-hh-DOCK();
  return [{id:'top',x:m,y:by-hh-8,w,h:hh},{id:'side',x:m,y:by,w,h:hh}];
}
const mzKey=id=>id==='top'?'mzTop':'mzSide';
// Refit: to the selected layer if there is one, otherwise to the whole scene.
// Fitting to a selection is what makes an axo usable when one stray object sits
// far away from everything else.
function fitSchematic(id){
  const l=S.layers.find(x=>x.id===S.sel);
  if(!l){ setMz(id,null); return; }
  const a=S.assets.get(l.assetId);
  const span=Math.max(6,(a?widthOf(l,a):l.height)*2.2, l.height*1.6);
  setMz(id,{x0:l.pos[0]-span,x1:l.pos[0]+span,
            z0:l.pos[2]-span,z1:l.pos[2]+span,
            y1:Math.max(2,l.pos[1]+l.height*1.6)});
}
const getMz=id=>S[mzKey(id)];
const setMz=(id,v)=>{S[mzKey(id)]=v;};
function boundsFor(id){
  const held=S.heldB;
  if(held&&held.id===id&&held.B) return held.B;   // held for the length of a gesture
  const b=getMz(id);
  return b?{x0:b.x0,x1:b.x1,z0:b.z0,z1:b.z1,y1:b.y1}:sceneBounds();
}
function miniMap(r,B){
  if(r.id==='top'){
    const s=Math.min((r.w-16)/(B.x1-B.x0),(r.h-16)/(B.z1-B.z0));
    const ox=r.x+r.w/2-((B.x0+B.x1)/2)*s, oy=r.y+r.h/2+((B.z0+B.z1)/2)*s;
    return {s,to:p=>[ox+p[0]*s,oy-p[2]*s],from:(a,b)=>({x:(a-ox)/s,z:(oy-b)/s})};
  }
  const s=Math.min((r.w-16)/(B.z1-B.z0),(r.h-20)/B.y1);
  const ox=r.x+r.w/2-((B.z0+B.z1)/2)*s, oy=r.y+r.h-12;
  return {s,to:p=>[ox+p[2]*s,oy-p[1]*s],from:(a,b)=>({z:(a-ox)/s,y:Math.max(0,(oy-b)/s)})};
}
function niceStep(s){
  const want=26/s;
  const p=Math.pow(10,Math.floor(Math.log10(want)));
  for(const m of [1,2,5,10]) if(p*m>=want) return p*m;
  return p*10;

function drawMini(){
  const rs=miniRects(), b=basisOf(S.cam);
  for(const r of rs){
    const B=boundsFor(r.id), M=miniMap(r,B);
    octx.save();
    octx.fillStyle='#0B0B0B';                    // schematics are opaque — they are documents
    octx.fillRect(r.x,r.y,r.w,r.h);
    octx.beginPath(); octx.rect(r.x,r.y,r.w,r.h); octx.clip();
    const st=niceStep(M.s);
    octx.strokeStyle='rgba(255,255,255,0.07)'; octx.lineWidth=1;
    octx.beginPath();
    if(r.id==='top'){
      for(let x=Math.ceil(B.x0/st)*st;x<=B.x1;x+=st){const q=M.to([x,0,B.z0]),w2=M.to([x,0,B.z1]);
        octx.moveTo(q[0],q[1]);octx.lineTo(w2[0],w2[1]);}
      for(let z=Math.ceil(B.z0/st)*st;z<=B.z1;z+=st){const q=M.to([B.x0,0,z]),w2=M.to([B.x1,0,z]);
        octx.moveTo(q[0],q[1]);octx.lineTo(w2[0],w2[1]);}
    } else {
      for(let z=Math.ceil(B.z0/st)*st;z<=B.z1;z+=st){const q=M.to([0,0,z]),w2=M.to([0,B.y1,z]);
        octx.moveTo(q[0],q[1]);octx.lineTo(w2[0],w2[1]);}
      for(let y=0;y<=B.y1;y+=st){const q=M.to([0,y,B.z0]),w2=M.to([0,y,B.z1]);
        octx.moveTo(q[0],q[1]);octx.lineTo(w2[0],w2[1]);}
    }
    octx.stroke();
    if(r.id==='side'){                              // ground
      const g0=M.to([0,0,B.z0]),g1=M.to([0,0,B.z1]);
      octx.strokeStyle='rgba(255,255,255,0.30)';
      octx.beginPath();octx.moveTo(g0[0],g0[1]);octx.lineTo(g1[0],g1[1]);octx.stroke();
    }
    // camera cone
    const tan=Math.tan(fovOf(S.cam.lens)/2), L=Math.max(12,S.cam.dist*1.5);
    const e=b.eye, ep=M.to(e);
    octx.strokeStyle='rgba(255,58,30,0.85)'; octx.lineWidth=1;
    octx.beginPath();
    for(const sgn of [-1,1]){
      const d = r.id==='top'
        ? V.norm(V.add(b.fwd,V.mul(b.right,sgn*tan*S.aspect)))
        : V.norm(V.add(b.fwd,V.mul(b.up,sgn*tan)));
      const q=M.to(V.add(e,V.mul(d,L)));
      octx.moveTo(ep[0],ep[1]); octx.lineTo(q[0],q[1]);
    }
    octx.stroke();
    octx.fillStyle='#FF3A1E'; octx.fillRect(ep[0]-2.5,ep[1]-2.5,5,5);
    if(S.path&&S.path.length>1){
      octx.strokeStyle='#C9A227'; octx.lineWidth=2; octx.beginPath();
      S.path.forEach((q,i)=>{ const s=M.to(q); i?octx.lineTo(s[0],s[1]):octx.moveTo(s[0],s[1]); });
      octx.stroke(); octx.lineWidth=1;
    }
    // objects
    for(const l of S.layers){
      const sel=l.id===S.sel;
      if(isQuad(l)){                              // its true outline, in plan and in side
        const cor=quadCorners(l).map(c=>M.to(c));
        octx.strokeStyle=sel?'#FF3A1E':'rgba(255,255,255,0.34)';
        octx.lineWidth=sel?2:1;
        octx.beginPath(); octx.moveTo(cor[0][0],cor[0][1]);
        for(let i=1;i<4;i++) octx.lineTo(cor[i][0],cor[i][1]);
        octx.closePath(); octx.stroke(); octx.lineWidth=1;
      }
      else if(isPlane(l)){
        // a plane has area: plan shows the footprint, side shows its rake
        const a=S.assets.get(l.assetId), wdt=a?widthOf(l,a):l.height;
        const t=(l.tilt||0)*Math.PI/180, c=Math.cos(t);
        const rt=[Math.cos(l.yaw),0,-Math.sin(l.yaw)];
        const up=[Math.sin(l.yaw)*c,Math.sin(t),Math.cos(l.yaw)*c];
        const cor=[[-0.5,0],[0.5,0],[0.5,1],[-0.5,1]].map(([u,v])=>M.to(
          [l.pos[0]+rt[0]*u*wdt+up[0]*v*l.height,
           l.pos[1]+up[1]*v*l.height,
           l.pos[2]+rt[2]*u*wdt+up[2]*v*l.height]));
        octx.strokeStyle=sel?'#FF3A1E':'rgba(255,255,255,0.30)';
        octx.beginPath(); octx.moveTo(cor[0][0],cor[0][1]);
        for(let i=1;i<4;i++) octx.lineTo(cor[i][0],cor[i][1]);
        octx.closePath(); octx.stroke();
      }
      else if(r.id==='side'){
        const a1=M.to([0,l.pos[1],l.pos[2]]), a2=M.to([0,l.pos[1]+l.height,l.pos[2]]);
        octx.strokeStyle=sel?'#FF3A1E':'rgba(255,255,255,0.45)';
        octx.beginPath();octx.moveTo(a1[0],a1[1]);octx.lineTo(a2[0],a2[1]);octx.stroke();
      }
      if(r.id==='top'&&!isPlane(l)&&!isQuad(l)){
        const a=S.assets.get(l.assetId), wd=a?widthOf(l,a):1;
        const yaw=l.face==='fixed'?(l.yaw||0):(Math.atan2(b.right[0],-b.right[2])+Math.PI/2);
        const rr=[Math.cos(yaw),0,-Math.sin(yaw)];
        const e1=M.to(V.add(l.pos,V.mul(rr,-wd/2))), e2=M.to(V.add(l.pos,V.mul(rr,wd/2)));
        octx.strokeStyle=sel?'#FF3A1E':'rgba(255,255,255,0.72)';
        octx.lineWidth=sel?3:2;
        octx.beginPath(); octx.moveTo(e1[0],e1[1]); octx.lineTo(e2[0],e2[1]); octx.stroke();
        octx.lineWidth=1;
      }
      const q=M.to(l.pos);
      octx.fillStyle=sel?'#FF3A1E':'rgba(255,255,255,0.65)';
      const sz=sel?6:4; octx.fillRect(q[0]-sz/2,q[1]-sz/2,sz,sz);
    }
    octx.restore();
    if(!r.full){ octx.strokeStyle='#2A2A2A'; octx.lineWidth=1;
      octx.strokeRect(r.x+0.5,r.y+0.5,r.w-1,r.h-1); }
    octx.fillStyle='#8A8A8A'; octx.font='10px -apple-system,Helvetica,Arial';
    const zoomed=!!getMz(r.id);
    octx.fillText((r.id==='top'?'PLAN':'SIDE')+
      (r.big?(zoomed?'   — double-tap to refit':'   — pinch or drag to navigate'):''),r.x+8,r.y+15);
    octx.fillText(Math.round(r.id==='top'?B.x1-B.x0:B.z1-B.z0)+' m',r.x+8,r.y+r.h-9);
  }
}
function miniAt(px,py){
  if(!S.mini&&!S.big&&!['TRIPLE','PLAN','SIDE'].includes(VIEWS[S.view])) return null;
  if(S.repeat) return null;
  for(const r of miniRects())
    if(px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h) return r;
  return null;
}
function miniPick(px,py,r){
  const M=miniMap(r,boundsFor(r.id));
  const R=r.full?44:(r.big?26:14);
  const near=S.layers.map(l=>{const q=M.to(l.pos);
      return {l,d:Math.hypot(q[0]-px,q[1]-py)};})
    .filter(o=>o.d<R).sort((a,b)=>a.d-b.d);
  if(near.length>1){                    // tap the same cluster again to step underneath
    const i=near.findIndex(o=>o.l.id===S.sel);
    return near[(i+1)%near.length].l;
  }
  let best=near.length?near[0].l:null, bd=R;
  if(best||r.id!=='side') return best;
  for(const l of S.layers){                      // side view: the height stroke is a target too
    const a=M.to([0,l.pos[1],l.pos[2]]), b=M.to([0,l.pos[1]+l.height,l.pos[2]]);
    if(segDist(px,py,a,b)<12) return l;
  }
  return null;
}

/* ══ BAKE — the scene collapsed into plates ════════════════
   One operation, two consumers: PAINT gets brushes on the plates,
   EXPORT writes the same plates out. A plate is category × depth
   band, because collapsing a category alone would flatten the
   interleaving — a tree behind a figure cannot share a plate with
   a tree in front of one. Only the recipe is durable; pixels are
   regenerated, and kept only where paint has been laid on them.
──────────────────────────────────────────────────────────── */
const PLATE_ORDER=['Terrain','Vegetation','Objects','People','Imported','Atmosphere'];
function plateKeyOf(l){
  const a=S.assets.get(l.assetId);
  const cat=(isPlane(l)||(isQuad(l)&&l.ground))?'Ground':
    (isQuad(l)?'Built':((a&&a.group)||'Imported'));
  return cat+' · '+GROUPS.find(g=>g.id===groupOf(l)).name;
}
function plateRecipe(){
  const map=new Map();
  for(const l of S.layers){
    const k=plateKeyOf(l);
    if(!map.has(k)) map.set(k,{name:k,ids:new Set(),depth:0,n:0});
    const p=map.get(k);
    p.ids.add(l.id);
    p.depth+=distTo(l.pos,basisOf(S.cam).eye); p.n++;
  }
  const out=[...map.values()];
  out.forEach(p=>p.depth/=Math.max(1,p.n));
  out.sort((a,b)=>b.depth-a.depth);          // back to front
  return out;
}
// Render one plate by drawing only its layers, then lifting the frame rect.
function renderPlate(bk,fr){
  const vp=mkVP(S.cam,fr.x,fr.y,fr.w,fr.h,1);
  gl.clearColor(0,0,0,0);
  pass(vp,false,false,bk);
  const w=Math.round(fr.w*DPR), hh=Math.round(fr.h*DPR);
  const buf=new Uint8Array(w*hh*4);
  gl.readPixels(Math.round(fr.x*DPR),Math.round((Hh-fr.y-fr.h)*DPR),w,hh,
    gl.RGBA,gl.UNSIGNED_BYTE,buf);
  const c=cnv(w,hh), g=c.getContext('2d'), im=g.createImageData(w,hh);
  for(let y=0;y<hh;y++){                      // GL reads bottom-up
    const s=(hh-1-y)*w*4, d=y*w*4;
    im.data.set(buf.subarray(s,s+w*4),d);
  }
  g.putImageData(im,0,0);
  return c;
}
// The picture fills the screen here. Same aspect as the camera's frame, but
// there is no room to work around it — in PAINT the frame IS the workspace.
// COVER by default: the picture fills the screen and the long side runs off,
// so there are no borders to look past. CONTAIN shows the whole frame instead.
function frameOf(){
  let w,hh;
  if(S.paintCover!==false){ w=W; hh=w/S.aspect; if(hh<Hh){ hh=Hh; w=hh*S.aspect; } }
  else { w=W; hh=w/S.aspect; if(hh>Hh){ hh=Hh; w=hh*S.aspect; } }
  return {x:(W-w)/2,y:(Hh-hh)/2,w,h:hh};
}
function bake(){
  const fr=frameOf();
  S.bakeFrame=fr;
  const rec=plateRecipe();
  const keep=new Map((S.plates||[]).map(p=>[p.name,p.paint]));
  const keepFlat=new Map((S.plates||[]).map(p=>[p.name,!!p.flat]));
  const mk=(name,bk,blend)=>({name,depth:0,blend:blend||null,
    img:renderPlate(bk,fr),paint:keep.get(name)||null,on:true,
    flat:!!keepFlat.get(name),hidden:!!keepFlat.get(name)});
  const out=[mk('Sky',{only:new Set(),sky:true,shadows:false,weather:false})];
  let shadowPlaced=false;
  for(const p of rec){
    // the shadow plate slips in once the ground is down, before anything standing
    if(!shadowPlaced&&!/^Ground/.test(p.name)){
      out.push(mk('Shadows',{only:null,sky:false,shadows:true,shadowsOnly:true,weather:false},
        'multiply'));
      shadowPlaced=true;
    }
    out.push(Object.assign(
      mk(p.name,{only:p.ids,sky:false,shadows:false,weather:false}),
      {ids:[...p.ids],depth:p.depth}));
  }
  if(!shadowPlaced) out.push(mk('Shadows',
    {only:null,sky:false,shadows:true,shadowsOnly:true,weather:false},'multiply'));
  if((S.emit||[]).length||S.fog>0.01)
    out.push(mk('Weather',{only:new Set(),sky:false,shadows:false,weather:true}));
  S.plates=out;
  // land on the front plate: painting on Sky would sit behind everything
  const front=[...S.plates].reverse().find(p=>p.name!=='Weather'&&p.name!=='Shadows');
  S.plateSel=front?front.name:(S.plates.length?S.plates[S.plates.length-1].name:null);
  S.bakeAt=Date.now();

// Writing out. The frame is rendered on its own, at the size you ask for, and

function saveCanvas(c,name){
  return new Promise(res=>c.toBlob(b=>{
    const u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000); res();

}
function renderFrame(mode,scale){
  const fr=frameOf();

  gl.clearColor(0,0,0,1);

  const w=Math.round(fr.w*DPR), hh=Math.round(fr.h*DPR);

  g.putImageData(im,0,0);

async function exportImage(kind){

    if(kind==='picture'){
      let c;
      if(S.plates){ c=cnv(Math.round(frameOf().w*DPR),Math.round(frameOf().h*DPR));
        const g=c.getContext('2d'), fr=frameOf();
        g.setTransform(c.width/fr.w,0,0,c.height/fr.h,-fr.x*c.width/fr.w,-fr.y*c.height/fr.h);

    }
    else if(kind==='depth'){ await saveCanvas(renderFrame('depth'),'sc3ne-'+stamp+'-depth.png'); }
    else if(kind==='object'){ S.idView=1; await saveCanvas(renderFrame('object'),'sc3ne-'+stamp+'-object.png'); }
    else if(kind==='material'){ S.idView=2; await saveCanvas(renderFrame('material'),'sc3ne-'+stamp+'-material.png'); }

      if(!S.plates){ hint('bake first'); return; }

// FLATTEN — a plate goes back into the library as a cut-out, and can be placed

// flatten one back to an object, build with it. What was a picture becomes
// material.
function trimCanvas(src){
  const g=src.getContext('2d');
  const im=g.getImageData(0,0,src.width,src.height).data;
  let x0=src.width,y0=src.height,x1=-1,y1=-1;
  for(let y=0;y<src.height;y++) for(let x=0;x<src.width;x++){
    if(im[(y*src.width+x)*4+3]>6){
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
    }
  }
  if(x1<0) return null;
  const w=x1-x0+1, hh=y1-y0+1, c=cnv(w,hh);
  c.getContext('2d').drawImage(src,x0,y0,w,hh,0,0,w,hh);

}
function flattenPlateToLibrary(p,place){
  const fr=frameOf();
  const full=cnv(p.img.width,p.img.height), fg=full.getContext('2d');
  if(!p.hidden) fg.drawImage(p.img,0,0);
  if(p.paint) fg.drawImage(p.paint,0,0);
  const t=trimCanvas(full);
  if(!t){ hint('plate is empty'); return null; }
  const name=p.name.replace(/[^A-Za-z0-9]+/g,' ').trim().toLowerCase();
  const a=addAsset(name,t.canvas,null,false,'Flattened');
  if(place){
    // Size it so it covers exactly the part of the frame it came from, at the
    // distance the camera is looking — so it lands where the picture was.
    const vp=viewports()[0], d=Math.max(1,S.cam.dist);
    const mPerPx=2*vp.tan*d/vp.h;
    const scale=fr.h/p.img.height;                 // canvas px → screen px
    const hM=Math.max(0.05,t.hh*scale*mPerPx);
    const b=basisOf(S.cam);
    const cxPx=(t.x0+t.w/2)*scale + fr.x - (vp.x+vp.w/2);
    const cyPx=(t.y0+t.hh/2)*scale + fr.y - (vp.y+vp.h/2);
    const centre=[S.cam.tgt[0]+b.right[0]*cxPx*mPerPx-b.up[0]*cyPx*mPerPx,
                  S.cam.tgt[1]+b.right[1]*cxPx*mPerPx-b.up[1]*cyPx*mPerPx,
                  S.cam.tgt[2]+b.right[2]*cxPx*mPerPx-b.up[2]*cyPx*mPerPx];
    const l=addLayer(a.id,[centre[0],Math.max(0,centre[1]-hM/2),centre[2]],{height:hM});
    l.face='free';
    l.yaw=Math.atan2(-b.right[2],b.right[0]);
    const cu=b.up, f=[Math.sin(l.yaw),0,Math.cos(l.yaw)];
    let pit=Math.atan2(Math.hypot(cu[0],cu[2]),cu[1]);
    if(cu[0]*f[0]+cu[2]*f[2]>0) pit=-pit;

}
function plateBySel(){ return (S.plates||[]).find(p=>p.name===S.plateSel); }

// The composite the painter sees: plates back to front, each with its paint.

function paintView(){
  const b=frameOf(), v=S.pview||{z:1,x:0,y:0};

function paintFit(){ S.pview={z:1,x:0,y:0}; }
function drawPlates(ctx,fr0){

const brushColour=()=>hsv(S.brush.hue,S.brush.sat,S.brush.val);

function stampFor(){

let strokeUndo=null, lastT=0, lastSpeed=0;
function flattenPlate(pl){          // an effect brush needs pixels to work on
  const c=paintCanvasOf(pl);

function strokeBegin(s){

// Pressure drives size and weight. Without a pen, speed stands in — fast is thin.
function forceOf(s,dpx){

const fxPool=new Map();

function fxChannel(src,w,hh,slot,colour){

  g.globalCompositeOperation='destination-in'; g.drawImage(src,0,0);

// slices go back to horizontal, which is the industrial look.
function effectStamp(g,c,x,y,r,a,tip,ang){
  const b=S.brush;
  // SLICE is the first glitch, kept as its own brush: always horizontal, and
  // pasted rather than blended, so the bands stay hard and never accumulate.
  if(tip==='SLICE'){
    const s=Math.max(2,Math.round(r*2));
    const sx=Math.round(clamp(x-r,0,Math.max(0,c.width-2)));
    const sy=Math.round(clamp(y-r,0,Math.max(0,c.height-2)));

    const band=Math.max(1,Math.round(hh/bands));

  const sy=Math.round(clamp(y-R,0,Math.max(0,c.height-2)));
