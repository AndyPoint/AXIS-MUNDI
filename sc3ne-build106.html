// The same file coming back, from a picker or from a URL.
// A picture beside the scene on another host has to be asked for with CORS, or
// the canvas it is drawn into can never be read again.
const dataToImage=d=>new Promise((res,rej)=>{
  const im=new Image();
  if(!/^data:/.test(d)) im.crossOrigin='anonymous';
  im.onload=()=>res(im); im.onerror=rej; im.src=d;
});
async function loadSceneObject(o){
  if(!o) return false;
  migrateDoc(o);
  reserveIds(o);
  // linked sequences: the frames sit beside the scene, named in order
  for(const id of Object.keys(o.seqFiles||{})){
    if(S.assets.has(id)) continue;
    try{
      const imgs=[];
      for(const f of o.seqFiles[id])
        imgs.push(await dataToImage((o.base||'')+(o.imgBase||'')+f));
      const meta=(o.assets||[]).find(x=>x.id===id)||{};
      const made=sequenceFrom(imgs,meta.name||'sequence',meta.group,(o.fps||{})[id]||12);
      S.assets.delete(made.id); made.id=id; S.assets.set(id,made);
    }catch(err){}
  }
  for(const id of Object.keys(o.seq||{})){
    if(S.assets.has(id)) continue;
    try{
      const imgs=[];
      for(const d of o.seq[id]) imgs.push(await dataToImage(d));
      const meta=(o.assets||[]).find(x=>x.id===id)||{};
      const made=sequenceFrom(imgs,meta.name||'sequence',meta.group,(o.fps||{})[id]||12);
      S.assets.delete(made.id); made.id=id; S.assets.set(id,made);
    }catch(err){}
  }
  for(const a of o.assets||[]){
    if(a.builtin||S.assets.has(a.id)) continue;
    let d=(o.img||{})[a.id];
    if(!d&&o.imgFiles&&o.imgFiles[a.id]) d=(o.base||'')+(o.imgBase||'')+o.imgFiles[a.id];
    if(!d) continue;
    try{
      const img=await dataToImage(d);
      const made=addAsset(a.name,img,a.kind,false,a.group||'Imported');
      S.assets.delete(made.id); made.id=a.id; S.assets.set(a.id,made);
    }catch(err){}
  }
  for(const k of DOC_KEYS) if(o[k]!==undefined) S[k]=o[k];
  S.layers=(S.layers||[]).filter(l=>S.assets.has(l.assetId));
  S.multi=[]; S.inGroup=null; S.pathRun=null;
  ykbNormalise&&ykbNormalise(); webNormalise(); gameNormalise();
  animCheck();
  invalidateChains&&invalidateChains();
  invalidateLut&&invalidateLut();
  markDirty(); draw(); bump();
  return true;
}
async function loadSceneURL(url){
  try{
    const r=await fetch(url,{mode:'cors'});
    const o=await r.json();
    o.base=url.replace(/[^/]*$/,'');       // linked images sit beside the scene
    return await loadSceneObject(o);
  }catch(err){ showErr('scene — '+err.message); return false; }
}

      t.objectStore('doc').clear(); t.objectStore('img').clear();
      t.oncomplete=res; t.onerror=res; });

}

function frameAll(){
  if(!S.layers.length) return;
  let mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];
  for(const l of S.layers)for(let i=0;i<3;i++){
    mn[i]=Math.min(mn[i],l.pos[i]); mx[i]=Math.max(mx[i],l.pos[i]+(i===1?l.height:0));}
  S.cam.tgt=[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2];
  S.cam.dist=clamp(Math.max(mx[0]-mn[0],mx[2]-mn[2])*1.1+18,6,900);

function gotoWS(i){
  const next=WS[(i+WS.length)%WS.length];
  // A drawing tool doesn't follow you out of its room. Going through setTool
  // keeps the tool strip honest — it used to go on showing the brush as armed
  // after the brush had been switched off underneath it.
  if((WS[S.ws]==='DRAW'&&next!=='DRAW'&&['rect','ink'].includes(S.tool))||
     (WS[S.ws]==='SCATTER'&&next!=='SCATTER'&&['path','scatter'].includes(S.tool)))
    setTool('select');
  if(WS[S.ws]==='DRAW'&&next!=='DRAW') S.drawRect=null;
  if(WS[S.ws]==='YKB'&&next!=='YKB'&&S.ykb) S.ykb.paint=false;
  S.ws=(i+WS.length)%WS.length;
  S.nodesOpen=WS[S.ws]==='NODES';
  if(S.nodesOpen) defaultGraph();
  if(WS[S.ws]==='PAINT'&&!S.plates&&S.layers.length){
    if(!S.brush) S.brush=newBrush();
    try{ bake(); }catch(err){ showErr('Bake failed: '+err.message); }

// Delete what is chosen: the live path run first, then a hand-picked set, then
// the one selected layer. Undoing a bad array should not mean hunting for its
// fifty copies.
function deleteSelection(){
  if(S.pathRun&&S.pathRun.made&&S.pathRun.made.length){
    snap(true);
    const gone=new Set(S.pathRun.made);
    S.layers=S.layers.filter(l=>!gone.has(l.id));
    S.pathRun=null; S.lastArray=null; S.sel=null;
    pruneGroups();
    hint('run removed'); markDirty(); draw(); bump(); return true;
  }
  // What is selected is what goes: the hand-picked set, else the selected thing
  // at the level you are standing at — the whole group from outside it, the one
  // layer from inside. Deleting a single member of a group you could see as one
  // object left the rest of it standing.
  const one=S.sel?S.layers.find(x=>x.id===S.sel):null;
  const set=(S.multi&&S.multi.length)?multiLayers():(one?movingSet(one):[]);
  if(!set.length) return false;
  snap(true);
  const gone=new Set(set.map(l=>l.id));
  S.layers=S.layers.filter(l=>!gone.has(l.id));
  for(const r of S.recipes||[]) r.made=(r.made||[]).filter(id=>!gone.has(id));
  clearMulti(); S.sel=null;
  pruneGroups();
  hint(gone.size+' deleted'); markDirty(); draw(); bump(); return true;
}
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  const meta=e.metaKey||e.ctrlKey;
  if((e.key==='z'||e.key==='Z')&&meta){
    e.preventDefault(); (e.shiftKey?redo:undo)(); return;
  }
  if(e.key==='y'&&meta){ e.preventDefault(); redo(); return; }
  if(e.key==='Backspace'||e.key==='Delete'){ e.preventDefault();
    // in the graph, a key deletes nodes — never the layers behind them
    if(S.nodesOpen&&(S.nodeSel||(S.nodeMulti||[]).length)){
      const ids=[...new Set([...(S.nodeMulti||[]),S.nodeSel].filter(Boolean))]
        .filter(id=>{ const n=nodeById(id); return n&&!['band','out'].includes(n.type); });
      if(ids.length) deleteNodes(ids); return; }
    deleteSelection(); return; }
  if((e.key==='c'||e.key==='C')&&meta){ e.preventDefault(); copySelection(); return; }
  if((e.key==='v'||e.key==='V')&&meta&&!S.pasteImagePending){
    // an image on the clipboard wins; the paste handler clears this flag
    setTimeout(()=>{ if(!S.pasteImagePending) pasteClip(); },0);
    return;
  }
  if((e.key==='d'||e.key==='D')&&meta){ e.preventDefault(); duplicate(); draw(); bump(); return; }
  if(e.key==='Escape'&&(S.multi||[]).length){ clearMulti(); draw(); bump(); return; }
  if(e.target.tagName==='INPUT') return;
  const k=e.key,i=S.layers.findIndex(l=>l.id===S.sel),l=S.layers[i];
  if(S.present){
    if(k==='Escape'){ if(!S.webMode) presentToggle(false); return; }
    if(k===' '||k==='Spacebar'){ e.preventDefault(); playToggle(); return; }
    if(k==='ArrowRight'||k==='PageDown'){ e.preventDefault(); stepSlide(1); return; }
    if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); stepSlide(-1); return; }
  }
  // ⌘A has to be read before A on its own, which frames everything — the other
  // order meant select-all could never be reached.
  if((k==='a'||k==='A')&&meta){ e.preventDefault();
    S.multi=S.layers.filter(x=>!x.atmos&&!x.hidden).map(x=>x.id);
    hint(S.multi.length+' selected'); draw(); bump(); return; }
  if(k==='Tab'){ e.preventDefault(); cycleTool(); return; }
  if(meta) return;                       // leave the browser's own shortcuts alone
  if(k>='1'&&k<='9'){gotoWS(+k-1);return;}
  if(k==='w'||k==='W'){S.view=(S.view+1)%VIEWS.length;applyView();return;}
  if(k==='k'||k==='K'){keepShot();draw();bump();return;}
  if(k==='a'||k==='A'){frameAll();return;}
  if(k==='t'||k==='T'){S.cam.el=1.4;S.cam.az=0;draw();bump();return;}
  if(k==='m'||k==='M'){S.depthView=!S.depthView;draw();bump();return;}
  if(k==='p'||k==='P'){ if(S.big) S.big=null; else S.mini=!S.mini; draw();bump();return;}
  if(k==='Escape'&&S.big){S.big=null;draw();bump();return;}
  if(k==='b'||k==='B'){ setTool(S.scatter.on?'select':'scatter'); return; }
  if(k==='n'||k==='N'){
    if(WS[S.ws]==='NODES'){ S.nodesOpen=!S.nodesOpen; if(S.nodesOpen) defaultGraph(); draw(); bump(); }
    else gotoWS(WS.indexOf('NODES'));
    return;}
  if(k==='d'||k==='D'){duplicate();draw();bump();return;}
  if(k==='z'&&!meta){ undo(); return; }
  if(k==='Z'&&!meta){ redo(); return; }
  if(!l) return;
  if(k==='x'||k==='X'){ e.preventDefault(); deleteSelection(); return; }
  if(!['-','=','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','f','F'].includes(k)) return;
  snap();                                // so a nudge can be taken back
  if(k==='-'){l.height=Math.max(0.1,l.height*0.93);}
  else if(k==='='){l.height=l.height*1.07;}
  else if(k==='ArrowLeft'){l.pos[0]-=0.4;} else if(k==='ArrowRight'){l.pos[0]+=0.4;}
  else if(k==='ArrowUp'){l.pos[2]+=0.4;} else if(k==='ArrowDown'){l.pos[2]-=0.4;}
  else if(k==='f'||k==='F'){l.face=l.face==='camera'?'fixed':'camera';}
  e.preventDefault(); markDirty(); draw(); bump();
});

// CURVE — drag a point, tap empty space to add one, tap a point twice to remove.
// Ends stay on their edges. Draws its own grid; no plate, no radius.
function Curve(p){
  const ref=React.useRef(null);
  const [,force]=React.useState(0);
  const SZ=p.size||272, R=13;
  const pts=p.points;
  const toS=q=>[8+q[0]*(SZ-16), SZ-8-q[1]*(SZ-16)];
  const toV=(x,y)=>[clamp((x-8)/(SZ-16),0,1),clamp((SZ-8-y)/(SZ-16),0,1)];
  React.useEffect(()=>{
    const c=ref.current; if(!c) return;
    const g=c.getContext('2d'), d=window.devicePixelRatio||1;
    c.width=SZ*d; c.height=SZ*d; g.setTransform(d,0,0,d,0,0);
    g.fillStyle='#101010'; g.fillRect(0,0,SZ,SZ);
    g.strokeStyle='#2A2A2A'; g.lineWidth=1;
    for(let i=0;i<=4;i++){ const t=8+i/4*(SZ-16);
      g.beginPath(); g.moveTo(t+0.5,8); g.lineTo(t+0.5,SZ-8); g.stroke();
      g.beginPath(); g.moveTo(8,t+0.5); g.lineTo(SZ-8,t+0.5); g.stroke(); }
    g.strokeStyle='#2A2A2A';
    g.beginPath(); g.moveTo(8,SZ-8); g.lineTo(SZ-8,8); g.stroke();
    // every channel is drawn; the one being edited is the bright one
    (p.others||[]).forEach(o=>{
      g.strokeStyle=o.colour; g.globalAlpha=0.38; g.lineWidth=1;
      g.beginPath();
      for(let i=0;i<=64;i++){ const x=i/64, s=toS([x,curveAt(o.points,x)]);
        i?g.lineTo(s[0],s[1]):g.moveTo(s[0],s[1]); }
      g.stroke(); g.globalAlpha=1;
    });
    g.strokeStyle=p.colour||'#F2F2F2'; g.lineWidth=1.5;
    g.beginPath();
    for(let i=0;i<=96;i++){ const x=i/96, s=toS([x,curveAt(pts,x)]);
      i?g.lineTo(s[0],s[1]):g.moveTo(s[0],s[1]); }
    g.stroke();
    g.fillStyle=p.colour||'#F2F2F2';
    pts.forEach(q=>{ const s=toS(q); g.fillRect(s[0]-3,s[1]-3,6,6); });
  });
  const hit=(x,y)=>{ let bi=-1,bd=R;
    pts.forEach((q,i)=>{ const s=toS(q), dd=Math.hypot(s[0]-x,s[1]-y);
      if(dd<bd){bd=dd;bi=i;} }); return bi; };
  const down=e=>{
    e.preventDefault(); e.stopPropagation();
    const r=ref.current.getBoundingClientRect();
    const x=e.clientX-r.left, y=e.clientY-r.top;
    let i=hit(x,y);
    if(i<0){ const v=toV(x,y); pts.push(v); pts.sort((a,b)=>a[0]-b[0]); i=pts.indexOf(v); }
    else if(i>0&&i<pts.length-1&&e.detail>1){ pts.splice(i,1); p.onChange(); force(n=>n+1); return; }
    ref.current.setPointerCapture(e.pointerId);
    ref.current._drag=i; p.onChange(); force(n=>n+1);
  };
  const move=e=>{
    const i=ref.current&&ref.current._drag; if(i===undefined||i===null||i<0) return;
    const r=ref.current.getBoundingClientRect();
    const v=toV(e.clientX-r.left,e.clientY-r.top);
    const first=i===0, last=i===pts.length-1;
    pts[i]=[first?0:(last?1:clamp(v[0],
      pts[i-1][0]+0.01,pts[i+1][0]-0.01)),v[1]];
    p.onChange(); force(n=>n+1);
  };
  const up=e=>{ if(ref.current) ref.current._drag=-1; };
  return h('canvas',{ref,style:{position:'relative',width:SZ+'px',height:SZ+'px',
    display:'block',marginTop:(p.top||0)+'px',marginBottom:'16px',touchAction:'none'},
    onPointerDown:down,onPointerMove:move,onPointerUp:up,onPointerCancel:up});
}

function LoadFiles(){
  const f=React.useRef(null), d=React.useRef(null);
  React.useEffect(()=>{ if(d.current){ d.current.setAttribute('webkitdirectory','');
    d.current.setAttribute('directory',''); } },[]);
  const take=async e=>{
    const files=[...(e.target.files||[])];
    const bad=[];
    for(const x of files){
      const rel=x.webkitRelativePath||'';
      const grp=groupFor(x.name,rel.includes('/')?rel.split('/')[0]:null);
      try{
        const img=await loadImageFile(x);
        addAsset(x.name.replace(/\.[^.]+$/,''),img,null,false,grp);
      }catch(err){ bad.push(x.name+' — '+err.message); }
      draw(); bump();
    }
    if(bad.length) showErr('Not imported:\n'+bad.join('\n'));
    e.target.value='';
  };
  const seqIn=React.useRef(null);
  const takeSeq=async e=>{
    const files=[...(e.target.files||[])]
      .sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
    e.target.value='';
    if(files.length<2){ showErr('A sequence needs at least two frames.'); return; }
    const imgs=[], bad=[];
    for(const x of files){
      try{ imgs.push(await loadImageFile(x)); }
      catch(err){ bad.push(x.name+' — '+err.message); }
    }
    if(!imgs.length){ showErr('Not imported:\n'+bad.join('\n')); return; }
    const base=(files[0].name.replace(/[_-]?\d+\.[^.]+$/,'')||'sequence').slice(0,16);
    const a=addSequence(imgs,base);
    hint(imgs.length+' frames');
    if(bad.length) showErr('Some frames were skipped:\n'+bad.join('\n'));
    draw(); bump();
  };
  return h('div',{style:{marginTop:'16px'}},
    h('input',{type:'file',multiple:true,ref:f,style:{display:'none'},onChange:take}),
    h('input',{type:'file',multiple:true,accept:'image/*',ref:seqIn,
      style:{display:'none'},onChange:takeSeq}),
    h('input',{type:'file',multiple:true,ref:d,style:{display:'none'},onChange:take}),
    h('button',{className:'btn',onClick:()=>f.current&&f.current.click()},'Add images to library…'),
    h('button',{className:'btn',onClick:()=>d.current&&d.current.click()},'Add a folder…'),
    h('button',{className:'btn',onClick:()=>seqIn.current&&seqIn.current.click()},
      'Add a PNG sequence…'),
    h('div',{className:'note'},
      'Pick every frame at once — they are sorted by name and held as one asset. '+
      'Transparency is kept exactly as it is: a rough cut-out with slack around '+
      'it stays transparent, never matted onto black.'));
}

// Fold a room's flat list into named sections, by the keys of what is in it.
// Anything the plan does not name keeps its place after them.
function sections(items,plan){
  const byKey=new Map(items.filter(Boolean).map(e=>[e.key,e]));
  const used=new Set(), out=[];
  for(const [label,count,open,keys] of plan){
    const kids=keys.map(k=>byKey.get(k)).filter(Boolean);
    kids.forEach(e=>used.add(e));
    if(kids.length) out.push(h(List,{key:'sec-'+label,label,count,open},kids));
  }
  for(const e of items) if(e&&!used.has(e)) out.push(e);
  return out;
}

// Each room says what it is: its number, its name, and one line. The name is the
// largest thing in the panel, because it is the one thing you need to know first.
const ROOM_LINE={IMPORT:'Pictures in — dropped, pasted or picked.',SCENE:'The selected thing.',
  DRAW:'Surfaces, lines, arrays and groups.',
  'CUT PLANE':'Stacks of surfaces that make a world.',LANDSCAPE:'Ground made of plates.',
  BUILD:'Houses, bridges, stairs and tubes, out of planes.',
  SCATTER:'Brushes and paths that plant things.',PLAYBACK:'Sequences and their clocks.',
  CAMERA:'Views, slides and presentation.',LIGHT:'Sun, shadow and glow.',
  ATMOS:'Sky, haze and weather.',COLOR:'The grade.',
  YKB:'Control channels — what a layer does.',EFFECT:'Not built yet.',
  NODES:'Things, what happens to them, and what drives it.',PAINT:'Brushes on the baked plates.',
  EXPORT:'Pictures, masks and scene files.',WEB:'The scene as a page.',
  GAME:'Things that speak, places that answer.'};
function RoomHead(p){
  const i=WS.indexOf(p.ws);
  return h('div',{className:'roomhead'},
    h('span',{className:'num'},String(i+1).padStart(2,'0')+' / '+WS.length),
    h('h1',null,p.ws),
    h('p',null,ROOM_LINE[p.ws]||''));
}
function ContextList(){
  const ws=WS[S.ws];
  if(ws==='EXPORT'||ws==='COLOR'||ws==='PAINT') return null;
  if(ws==='CAMERA'||ws==='WEB')
    return h(List,{label:ws==='WEB'?'Views, in page order':'Cameras',count:S.shots.length,addLabel:'+ keep',
      onAdd:()=>{keepShot();draw();bump();}},
      S.shots.map((s,i)=>h('div',{key:s.id,className:'item'+(s.id===S.shotSel?' sel':''),
        onClick:()=>useShot(s)},
        h('span',{className:'nm'},(i+1)+'  '+s.name),
        h('span',{className:'px'},Math.round(s.lens)+'mm'),
        h('button',{className:'mini',onClick:e=>{e.stopPropagation();
          if(i>0){ const t=S.shots[i-1]; S.shots[i-1]=s; S.shots[i]=t; markDirty(); bump(); }}},
          '↑'),
        h('button',{className:'mini',onClick:e=>{e.stopPropagation();
          const j=S.shots.indexOf(s);
          S.shots.splice(j,1); markDirty(); bump();}},'×'))));
  if(ws==='LIGHT'){
    const gl2=S.layers.filter(x=>x.glow);
    return h(List,{label:'Glow objects',count:gl2.length,
      onAdd:()=>{addLayer(A('glow').id,[S.cam.tgt[0],3,S.cam.tgt[2]]);draw();bump();}},
      gl2.map(x=>h('div',{key:x.id,className:'item'+(x.id===S.sel?' sel':''),
        onClick:()=>{S.sel=x.id;bump();draw();}},
        h('span',{className:'nm'},x.name),
        h('span',{className:'dp'},x.height.toFixed(1)+' m'))));
  }
  if(ws==='ATMOS'){
    const at=S.layers.filter(x=>x.atmos);
    return h(List,{label:'Fog cards',count:at.length,
      onAdd:()=>{addLayer(A('fog').id,[S.cam.tgt[0],4,S.cam.tgt[2]]);draw();bump();}},
      at.map(x=>h('div',{key:x.id,className:'item'+(x.id===S.sel?' sel':''),
        onClick:()=>{S.sel=x.id;bump();draw();}},
        h('span',{className:'nm'},x.name),
        h('span',{className:'dp'},x.height.toFixed(0)+' m'))));
  }
  if(ws==='IMPORT')
    return h(List,{label:'Assets',count:S.assets.size},
      pictures().filter(a=>!['shadow','dot','streak'].includes(a.kind)).map(a=>
        h('div',{key:a.id,className:'item'},
          h('span',{className:'nm'},a.name),
          h('span',{className:'inst'},'×'+usersOf(a.id)),
          h('span',{className:'px'},a.level>=0?a.levels[a.level].width:'—'))));
  return h(List,{label:'Layers',count:S.layers.filter(x=>!x.atmos).length},h(Layers));
}

/* ══ REPEAT POPUP WIRING ══════════════════════════════════ */
function wireRepeat(){
  const el=rEl(), inp=el.querySelector('input');
  el.addEventListener('pointerdown',e=>e.stopPropagation());
  inp.addEventListener('input',()=>{
    const v=parseInt(inp.value.replace(/[^0-9]/g,''),10);
    if(!isNaN(v)&&S.repeat){ S.repeat.n=clamp(v,1,400); applyRepeat(); }
  });
  inp.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Enter'){ endRepeat(); }
    else if(e.key==='Escape'){
      if(S.repeat){ S.repeat.n=1; applyRepeat(); }
      endRepeat();
    }
  });
  el.querySelector('.done').addEventListener('click',e=>{ e.stopPropagation(); endRepeat(); });
  el.querySelectorAll('.seg button').forEach(b=>{
    b.addEventListener('click',()=>{
      if(!S.repeat) return;
      S.repeat.style=b.dataset.style; syncRepeatSeg(); applyRepeat();
      inp.focus();
    });
  });
}

/* ══ ERROR SURFACE ════════════════════════════════════════ */
function showErr(msg){
  const el=document.getElementById('err');
  el.classList.add('on');
  el.textContent=(el.textContent?el.textContent+'\n':'')+msg;
  el.scrollTop=el.scrollHeight;
}
window.addEventListener('error',ev=>{
  if(ev&&ev.error&&ev.error.stack){
    showErr((ev.error.message||'error')+'\n'+
      String(ev.error.stack).split('\n').slice(0,3).join('\n'));
    return;
  }
  if(!ev||!ev.lineno){
    showErr('An error was reported without any detail — the webview hides the '+
      'source of errors raised outside our own handlers. If this keeps appearing, '+
      'note what you were doing just before it.');
    return;
  }
  showErr((ev.message||'error')+'  @'+(ev.lineno||'?')+':'+(ev.colno||'?')+
    (ev.error&&ev.error.stack?'\n'+String(ev.error.stack).split('\n').slice(0,3).join('\n'):''));
});
window.addEventListener('unhandledrejection',ev=>showErr('promise: '+ev.reason));
// An explanation folds to two lines; a tap opens it, another closes it.
document.addEventListener('click',e=>{
  const n=e.target&&e.target.closest&&e.target.closest('.note');
  if(n&&!e.target.closest('a')) n.classList.toggle('open');
});
document.getElementById('err').addEventListener('click',function(){
  this.textContent=''; this.classList.remove('on'); });

/* ══ BOOT ═════════════════════════════════════════════════ */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; Hh=window.innerHeight;
  cv.width=W*DPR; cv.height=Hh*DPR;
  draw();
}
function boot(){
  if(!gl){document.getElementById('ui').innerHTML=
    '<div style="padding:24px;font:12px/17px sans-serif;color:#8A8A8A">WebGL2 unavailable.</div>';return;}
  initGL();
  S.curve=newCurve(); S.levels=newLevels(); S.duo=newDuo(); S.brush=newBrush();
  ['ridge','tower','tree','bush','rock','human','wall','ground','blank',
   'earth','sky','forest','build','fog','glow','dot','streak']
    .forEach(k=>addAsset(k,silhouette(k,512),k,true,GROUP_OF[k]));
  for(let i=0;i<5;i++) addAsset('shadow'+i,silhouette('shadow'+i,256),'shadow'+i,true);
  Object.assign(S.sun,ENV.BLUE.sun);
  addLayer(A('ground').id,[0,0.01,2],{height:70,wscale:1.6});
  addLayer(A('ridge').id,[-40,0,320],{height:150});
  addLayer(A('ridge').id,[60,0,210],{height:110});
  addLayer(A('tower').id,[22,0,74],{height:38});
  addLayer(A('tree').id,[-9,0,26],{height:11});
  addLayer(A('tree').id,[-14,0,34],{height:9});
  addLayer(A('bush').id,[11,0,15],{height:1.6});
  addLayer(A('rock').id,[6,0,11],{height:1.2});
  addLayer(A('human').id,[-1.2,0,9],{height:1.8});
  S.sel=S.layers[S.layers.length-1].id;
  keepShot();
  S.dirty=false; clearTimeout(autoT);
  if(matchMedia('(pointer:coarse)').matches) document.body.classList.add('touch');
  wireRepeat();
  ReactDOM.createRoot(document.getElementById('ui')).render(h(App));
  resize();
  // The same file is the editor and the viewer. A handful of URL parameters
  // decide which, so embedding it on a page needs no second build.
  (async()=>{
    let q;
    try{ q=new URLSearchParams(location.search); }catch(err){ return; }
    if(!q||![...q.keys()].length) return;
    const on=k=>q.get(k)==='1'||q.get(k)==='true';
    if(q.get('scene')) await loadSceneURL(q.get('scene'));
    if(q.get('parallax')!==null) S.parallax=parseFloat(q.get('parallax'))||0;
    if(q.get('chrome')==='0') S.webMode=true;
    if(q.get('loop')!==null) S.play.loop=on('loop');
    if(on('scroll')) S.scrollDeck=true;
    // the page settings come with the scene; a parameter can still override them
    webNormalise();
    if(['off','step','snap','fly'].includes(q.get('web'))) S.web.scroll=q.get('web');
    const sl=parseInt(q.get('slide'),10);
    if(!isNaN(sl)&&S.shots[sl]) S.shotSel=S.shots[sl].id;
    if(q.get('mode')==='present'||S.webMode){
      S.offer=null;
      presentToggle(true);
      if(webActive()){
        // a page is scrolled, not played; an address naming a view starts there
        webSync();
        const at=webFromHash(); if(at>=0) webGoto(at,false);
      } else if(on('autoplay')&&S.shots.length>1&&!S.play.on) playToggle();
    }
    bump(); draw();
  })();
  // Whatever was open last time is offered, not loaded: starting the app should
  // not silently replace the fresh scene with someone's half-finished document.
  (async()=>{
    try{
      const got=await loadDoc('live');
      if(got&&got.doc&&(got.doc.layers||[]).length){
        await keepRestorePoint();          // so this session can be undone
        S.hasRestore=true;
        S.offer={at:got.doc.at,n:got.doc.layers.length};
        bump();
      }
    }catch(err){}
  })();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));
boot();
})();
