<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SYSTEM 8 Node Language</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style id="s8-css">
/* Layout: a stage holds the graph and the view side by side (stacked on phones); edge panels slide over it, and dock beside it on wide screens. Left = settings + info, right = selection + tools. Node headers carry the family colour; red stays for state and selection. */
:root{
  --ground:#EEEEEC; --surface:#F7F7F5; --raise:#FFFFFF; --line:#C9C9C4; --hair:#DCDCD8;
  --ink:#161616; --dim:#6F6F68; --accent:#FF3A1E; --void:#0B0B0B;
  --f-time:#D9A21B; --ft-time:#161616;
  --f-control:#7457D6; --ft-control:#FFFFFF;
  --f-input:#12968A; --ft-input:#FFFFFF;
  --f-image:#2F5BEA; --ft-image:#FFFFFF;
  --f-geo:#3A9550; --ft-geo:#FFFFFF;
  --f-output:#161616; --ft-output:#F2F2F2;
  --f-structure:#8A8A85; --ft-structure:#FFFFFF;
  --f-text:#C2338F; --ft-text:#FFFFFF;
  --t-image:var(--f-image); --t-geo:var(--f-geo); --t-signal:#8A8A85; --t-event:#161616;
  --grid:rgba(22,22,22,.13); --font:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif; --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0E0E0D; --surface:#171716; --raise:#1F1F1E; --line:#3A3A37; --hair:#2A2A28;
  --ink:#F2F2F2; --dim:#94948D; --accent:#FF3A1E; --void:#000000;
  --f-time:#E3B23C; --ft-time:#111111; --f-control:#9580F2; --ft-control:#0B0B0B; --f-input:#2BB8A7; --ft-input:#0B0B0B;
  --f-image:#7193FF; --ft-image:#0B0B0B; --f-geo:#62C273; --ft-geo:#0B0B0B; --f-output:#F2F2F2; --ft-output:#0B0B0B; --f-structure:#76766F; --ft-structure:#F2F2F2; --f-text:#E46BB5; --ft-text:#0B0B0B;
  --t-signal:#9A9A94; --t-event:#F2F2F2; --grid:rgba(242,242,242,.10); color-scheme:dark; } }
:root[data-theme="dark"]{
  --ground:#0E0E0D; --surface:#171716; --raise:#1F1F1E; --line:#3A3A37; --hair:#2A2A28;
  --ink:#F2F2F2; --dim:#94948D; --accent:#FF3A1E; --void:#000000;
  --f-time:#E3B23C; --ft-time:#111111; --f-control:#9580F2; --ft-control:#0B0B0B; --f-input:#2BB8A7; --ft-input:#0B0B0B;
  --f-image:#7193FF; --ft-image:#0B0B0B; --f-geo:#62C273; --ft-geo:#0B0B0B; --f-output:#F2F2F2; --ft-output:#0B0B0B; --f-structure:#76766F; --ft-structure:#F2F2F2; --f-text:#E46BB5; --ft-text:#0B0B0B;
  --t-signal:#9A9A94; --t-event:#F2F2F2; --grid:rgba(242,242,242,.10); color-scheme:dark; }
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--ground);color:var(--ink);font:400 12px/17px var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
.f-time{--fc:var(--f-time);--fct:var(--ft-time)} .f-control{--fc:var(--f-control);--fct:var(--ft-control)} .f-input{--fc:var(--f-input);--fct:var(--ft-input)} .f-image{--fc:var(--f-image);--fct:var(--ft-image)}
.f-geo{--fc:var(--f-geo);--fct:var(--ft-geo)} .f-text{--fc:var(--f-text);--fct:var(--ft-text)} .f-output{--fc:var(--f-output);--fct:var(--ft-output)} .f-structure{--fc:var(--f-structure);--fct:var(--ft-structure)}

#app{position:fixed;inset:0;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;--plw:0px;--prw:0px}
#app.dock.pl-open{--plw:320px} #app.dock.pr-open{--prw:320px}
#stage{position:absolute;top:0;bottom:0;left:var(--plw);right:var(--prw);display:flex}
#app.narrow #stage{flex-direction:column-reverse}
#vp{position:relative;flex:1 1 58%;min-width:0;min-height:0;overflow:hidden;touch-action:none;background-color:var(--ground);background-image:radial-gradient(circle,var(--grid) 1px,transparent 1.3px)}
#vp.panning{cursor:grabbing}
#vw{position:relative;flex:1 1 42%;min-width:0;min-height:0;overflow:hidden;background:var(--void);border-left:1px solid var(--line)}
#app.narrow #vw{border-left:0;border-bottom:1px solid var(--line);flex-basis:44%}
#vc,#vo{position:absolute;inset:0;width:100%;height:100%;display:block}
#vo{touch-action:none;cursor:grab}
.vfoot{position:absolute;left:0;right:0;bottom:0;padding:10px;display:grid;gap:6px;pointer-events:none}
.vcapb{justify-self:start;max-width:100%;background:rgba(11,11,11,.62);color:#F2F2F2;padding:6px 8px;font:600 10px/14px var(--font);letter-spacing:.1em;text-transform:uppercase}
.vcapb:empty{display:none}
#vhint{display:block;font-weight:400;letter-spacing:.01em;text-transform:none;color:rgba(242,242,242,.72)}
#vhint:empty{display:none}
.vbar{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap}
.vbar button{background:rgba(11,11,11,.62);color:#F2F2F2;border:1px solid rgba(242,242,242,.45);padding:8px 9px;font:600 9.5px/1 var(--font);letter-spacing:.12em}
.seg{display:inline-flex}
.seg button+button{border-left-width:0}
.seg button.on{background:#F2F2F2;color:#0B0B0B;border-color:#F2F2F2}
#vw:not([data-k="scene"]) [data-va="usecam"]{display:none}
#vw[data-k="img"] [data-va="frame"]{display:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#frames{position:absolute;left:0;top:0}
#wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#wires .whit{pointer-events:stroke;stroke:transparent;stroke-width:18;fill:none;cursor:pointer}
.w{fill:none;stroke-linecap:round}
.w.image{stroke:var(--t-image);stroke-width:2}
.w.geo{stroke:var(--t-geo);stroke-width:3}
.w.signal{stroke:var(--t-signal);stroke-width:2;stroke-dasharray:1 5}
.w.event{stroke:var(--t-event);stroke-width:1.25}
.w.text{stroke:var(--f-text);stroke-width:2}
.w.doc{stroke:var(--f-text);stroke-width:4}
.w.doc.flow,.w.text.flow{stroke-dasharray:12 4;animation:flow16 .5s linear infinite}
.w.image.flow,.w.geo.flow{stroke-dasharray:12 4;animation:flow16 .5s linear infinite}
.w.signal.flow{animation:flow6 .35s linear infinite}
.w.sel{stroke:var(--accent)!important}
.w.ghost{stroke:var(--ink);stroke-width:1.25;stroke-dasharray:4 4}
.edot{fill:var(--t-event)}
@keyframes flow16{to{stroke-dashoffset:-16}}
@keyframes flow6{to{stroke-dashoffset:-6}}
#marq{position:absolute;border:1px solid var(--accent);background:rgba(255,58,30,.06);pointer-events:none;z-index:5}

.sym{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:miter;display:block;flex:none}
.sym .f{fill:currentColor;stroke:none}

/* nodes */
.node{position:absolute;background:var(--surface);border:1px solid var(--ink)}
.node.sel{outline:2px solid var(--accent);outline-offset:3px}
.node.msel{outline:1px dashed var(--accent);outline-offset:3px}
.nh{position:absolute;left:0;right:0;top:0;height:30px;display:flex;align-items:center;gap:8px;padding:0 9px;background:var(--fc);color:var(--fct);cursor:grab}
.nh .nm{font-weight:600;font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-group .nh{box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.t-group{border-width:2px}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.sdot.wait{background:var(--accent)}
.sdot.run{border:1.5px solid var(--accent)}
.sdot.done{border:1px solid var(--line)}
.nh .sdot.wait,.nh .sdot.run{box-shadow:0 0 0 2px var(--surface);background-color:var(--accent)}
.nh .sdot.run{background:var(--surface)}
.pin{position:absolute;height:20px;display:flex;align-items:center;gap:6px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;cursor:crosshair;white-space:nowrap;color:var(--dim)}
.pin.in{left:-7px}
.pin.out{right:-7px;flex-direction:row-reverse}
.pin::before{content:'';position:absolute;top:-2px;bottom:-2px;width:30px}
.pin.in::before{left:-10px}
.pin.out::before{right:-10px}
.stud{width:13px;height:13px;display:block;flex:none;overflow:visible}
.si{fill:var(--t-image)}
.sg{fill:var(--t-geo)}
.ss{fill:var(--surface);stroke:var(--t-signal);stroke-width:1.6}
.se{fill:var(--t-event)}
.st{fill:var(--f-text)}
.sd{fill:var(--surface);stroke:var(--f-text);stroke-width:1.8}
.pin em{font-style:normal;color:var(--accent);letter-spacing:.08em}
.pin em.bind{color:var(--ft-time);background:var(--f-time);padding:1px 4px;font-size:8.5px;letter-spacing:.08em}
.pin em.b-tx,.pin em.b-ty{color:var(--ft-input);background:var(--f-input)}
.pin.hint .stud{outline:2px solid var(--accent);outline-offset:3px;animation:hp 1.1s ease-in-out infinite}
@keyframes hp{50%{outline-offset:6px}}
.face{position:absolute;left:10px;right:10px}
.thumb,.mthumb{display:block;width:100%;height:auto;background:var(--void)}
.thumb.geoth{background:var(--raise);outline:1px solid var(--hair);outline-offset:-1px}
.fbtn{position:absolute;right:6px;top:6px;background:var(--surface);border:1px solid var(--ink);padding:3px 6px;font:600 9.5px/1 var(--font);letter-spacing:.12em}
.t-out .fbtn{position:static;margin-top:6px;width:100%;padding:7px 0}
.playbtn,.recbtn,.diebtn{display:flex;align-items:center;gap:10px;width:100%;height:46px;border:1px solid var(--hair);background:none;padding:0 10px;text-align:left}
.diebtn.sm{height:28px;padding:0 6px;gap:8px;border:0}
.pl{font:600 10px/1 var(--font);letter-spacing:.12em}
.pt{margin-left:auto;font:400 11px/1 var(--mono);color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.pv{width:30px;height:30px;flex:none}
.pv .ring0{fill:none;stroke:var(--hair);stroke-width:2}
.pv .ring{fill:none;stroke:var(--f-time);stroke-width:2.5;stroke-dasharray:100;stroke-dashoffset:100}
.pv .tri{fill:none;stroke:var(--ink);stroke-width:1.5}
.playbtn.on .tri{fill:var(--ink)}
.rdot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);flex:none}
.recbtn.on .rdot{background:var(--accent);border-color:var(--accent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.die{width:22px;height:22px;flex:none;fill:none;stroke:var(--ink);stroke-width:1.5}
.die .f{fill:var(--ink);stroke:none}
.pad{position:relative;height:96px;border:1px solid var(--hair);background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);background-size:25% 25%;cursor:crosshair;touch-action:none}
.pad .ch{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border:1.5px solid var(--ink);border-radius:50%;left:50%;top:50%}
.pad.on .ch{background:var(--f-input);border-color:var(--f-input)}
.mixv{display:block;width:100%;height:28px}
.mixv circle{fill:none;stroke:var(--ink);stroke-width:1.5}
.sl{position:relative;height:20px;cursor:ew-resize;touch-action:none;flex:1;min-width:0}
.sl::before{content:'';position:absolute;left:0;right:0;top:9px;height:2px;background:var(--hair)}
.sl i{position:absolute;left:0;top:9px;height:2px;background:var(--fc,var(--ink));width:50%}
.sl i::after{content:'';position:absolute;right:-1px;top:-5px;width:2px;height:12px;background:var(--ink)}
.scope{display:block;width:100%;height:44px;border:1px solid var(--hair);background:var(--raise)}
.t-random .scope{height:24px;margin-top:4px}
.t-code .scope{height:34px}
.flab{position:absolute;left:5px;top:4px;font:400 9.5px/1 var(--mono);color:var(--dim);pointer-events:none}
.fval{position:absolute;right:5px;top:4px;font:400 10px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;pointer-events:none}
.t-value .face{display:flex;align-items:center;gap:8px;height:34px}
.t-value .fval{position:static;min-width:40px;text-align:right;font-size:12px}
.stepsc{display:block;width:100%;height:72px;cursor:crosshair;touch-action:none}
.bendc{display:block;width:100%;height:64px;cursor:ns-resize;touch-action:none}
.clk{display:flex;gap:6px;align-items:center;height:40px;cursor:pointer}
.clk i{width:14px;height:14px;border:1.5px solid var(--ink)}
.clk i.on{background:var(--f-time);border-color:var(--f-time)}
.cnt{display:flex;align-items:baseline;gap:8px;height:46px;padding-top:6px;cursor:pointer}
.cnt .cn{font:700 28px/1 var(--font);font-variant-numeric:tabular-nums}
.tog{display:flex;align-items:center;gap:10px;height:36px;width:100%;background:none;border:1px solid var(--hair);padding:0 8px}
.tk{width:34px;height:16px;border:1.5px solid var(--ink);position:relative;flex:none}
.tk::after{content:'';position:absolute;left:2px;top:2px;width:10px;height:9px;background:var(--ink)}
.tog.on .tk::after{left:auto;right:2px;background:var(--f-control)}
.expr{font:400 10.5px/14px var(--mono);height:28px;overflow:hidden;margin-bottom:4px;word-break:break-all}
.expr.err{color:var(--accent)}
.keycap{display:flex;align-items:center;gap:10px;height:44px;border:1px solid var(--hair);padding:0 8px;cursor:pointer;touch-action:none}
.keycap b{min-width:28px;height:28px;display:grid;place-items:center;border:1.5px solid var(--ink);font:700 12px/1 var(--font);padding:0 4px}
.keycap.on b{background:var(--f-input);border-color:var(--f-input);color:var(--ft-input)}
.notet{font-size:12px;line-height:16px;white-space:pre-wrap;overflow:hidden;height:88px}
.t-note{border-style:dashed;border-color:var(--line)}
.t-note .nh{background:none;color:var(--dim)}
.gx{display:grid;gap:2px;margin-top:6px}
.gr{display:grid;grid-template-columns:74px 1fr 40px;align-items:center;gap:6px;height:20px;font-size:9.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--dim)}
.gr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gv{font:400 10px/1 var(--mono);font-style:normal;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.fsel{grid-column:2/4;text-align:left;background:none;border:1px solid var(--hair);padding:2px 6px;font:600 9.5px/14px var(--font);letter-spacing:.1em;text-transform:uppercase}
.grl{display:flex;align-items:center;margin-top:4px;border-top:1px solid var(--hair)}
.fnote{position:absolute;left:6px;bottom:6px;font:400 10px/1 var(--mono);color:#F2F2F2;background:rgba(0,0,0,.55);padding:3px 5px;max-width:calc(100% - 12px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* middle distance: a coloured tile with a big symbol or a picture */
.mid{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;pointer-events:none;color:var(--fct)}
.mid b{font:700 24px/1.05 var(--font);letter-spacing:-.01em;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid .mthumb{width:100%}
.mid .mbig .sym{width:48px;height:48px}
.mid .mthumb.geoth{background:var(--surface)}
.node.m{background:var(--fc);border-color:var(--fc)}
.node.m.t-group{border-color:var(--ink)}
.node.m .nh,.node.m .face,.node.m .pin span,.node.m .pin em{display:none}
.node.m .mid{display:flex}
.node.m .stud{width:20px;height:20px}

/* groups on the canvas */
.frm{position:absolute;border:1px dashed var(--fc);background:color-mix(in srgb,var(--fc) 7%,transparent);pointer-events:none}
.frm.sel{border:1px solid var(--accent)}
.frm .fb{display:none}
.frm .fh{pointer-events:auto;position:absolute;left:-1px;bottom:100%;transform-origin:0 100%;transform:scale(var(--iz,1));height:24px;display:flex;align-items:center;gap:6px;padding:0 9px;background:var(--fc);color:var(--fct);font:600 10px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;cursor:grab;max-width:100%;white-space:nowrap}
.frm .fh em{font-style:normal;opacity:.7}

/* chrome */
.chrome{position:absolute;display:flex;align-items:center;gap:6px;z-index:40}
.tl{top:calc(env(safe-area-inset-top,0px) + 8px);left:calc(env(safe-area-inset-left,0px) + 8px)}
.tr{top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 8px)}
.bl{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 12px);z-index:25}
#app.dock.pl-open .bl{left:calc(var(--plw) + 12px)}
.ibtn{width:40px;height:40px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);padding:0;color:var(--ink)}
.ibtn.on{border-color:var(--ink)}
.trail{display:flex;align-items:center;gap:2px;font:700 11px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;max-width:calc(100vw - 200px);overflow:hidden;background:var(--surface);border:1px solid var(--line);height:40px;padding:0 6px}
.trail button{background:none;border:0;padding:8px 4px;color:var(--dim);font:inherit;letter-spacing:inherit;text-transform:inherit;white-space:nowrap}
.trail button:last-child{color:var(--ink)}
.trail i{font-style:normal;color:var(--dim)}
.zbtn{background:var(--surface);border:1px solid var(--line);padding:7px 8px;font:600 10px/1 var(--font);letter-spacing:.12em;color:var(--dim)}
#gdot{margin-right:2px;box-shadow:0 0 0 3px var(--surface)}

/* panels */
.panel{position:absolute;top:0;bottom:0;width:min(320px,calc(100vw - 48px));background:var(--surface);z-index:30;overflow-y:auto;overflow-x:hidden;transition:transform .12s ease;padding-block:calc(env(safe-area-inset-top,0px) + 58px) calc(env(safe-area-inset-bottom,0px) + 24px);-webkit-user-select:text;user-select:text}
.panel.left{left:0;border-right:1px solid var(--line);transform:translateX(-102%);padding-left:env(safe-area-inset-left,0px)}
.panel.right{right:0;border-left:1px solid var(--line);transform:translateX(102%);padding-right:env(safe-area-inset-right,0px)}
.panel.open{transform:none}
#app.dock .panel{transition:none}
.sec{padding:14px 16px;border-top:1px solid var(--hair)}
.sec h3{margin:0 0 10px;font:600 10px/10px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.sec h3.h3b{margin-top:16px}
.sec p{margin:0 0 8px}
h4.sub{margin:14px 0 6px;font:600 10px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.dim{color:var(--dim)}
.mono{font-family:var(--mono)}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:0 8px 12px 8px}
.stepper button{width:44px;height:36px;background:none;border:0;font:700 16px/1 var(--font)}
.stepper button:disabled{opacity:.25;cursor:default}
.stepper b{font:700 12px/1 var(--font);letter-spacing:.12em}
.what{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.wsym{width:44px;height:44px;display:grid;place-items:center;background:var(--fc);color:var(--fct);flex:none}
.kind{font:600 10px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.tin{width:100%;background:var(--raise);border:1px solid var(--hair);border-radius:0;padding:7px 8px;font:400 13px/16px var(--font);color:var(--ink)}
.tin:focus{border-color:var(--ink);outline:none}
.ta{resize:vertical;min-height:52px;font-size:12px;line-height:17px}
.prow{display:grid;grid-template-columns:92px minmax(0,1fr) 48px 30px;align-items:center;gap:8px;min-height:34px}
.prow label,.prow2 label{font:400 12px/15px var(--font)}
.prow output{font:400 11px/1 var(--mono);text-align:right;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
.prow input[type=range]{width:100%;accent-color:var(--ink)}
.prow select,.prow input[type=text]{grid-column:2/4;background:var(--raise);border:1px solid var(--hair);border-radius:0;padding:5px 6px;min-width:0}
.prow2{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:8px;min-height:36px}
.prow2 select{background:var(--raise);border:1px solid var(--hair);border-radius:0;padding:5px 6px;min-width:0}
.pair{display:flex;gap:8px;align-items:center;min-width:0}

  if(code){if(/^\s*```/.test(l)){out.push({t:'code',s:code.join('\n')});code=null;}else code.push(l);continue;}

  if(!l.trim()){flush();list=null;lastQ=false;continue;}

  if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){flush();list=null;out.push({t:'hr'});continue;}
  if((m=/^>\s?(.*)$/.exec(l))){flush();list=null;var lq=out[out.length-1];if(lastQ&&lq&&lq.t==='q')lq.s+=' '+m[1];else out.push({t:'q',s:m[1]});lastQ=true;continue;}
